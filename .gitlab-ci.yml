  stage: test-backend
  needs:
    - build-authentication-service
  script:
    - "make test-identifier-service"
    - "cat ./fda-identifier-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
