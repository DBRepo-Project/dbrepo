before_script:
  - "docker version"
  - "docker compose version"
  - "docker system prune -f"
  - "mvn --version"
  - "python3 --version"
  - "df / -h"

variables:
  HOSTALIASES: ./hosts
  DOCKER_TLS_CERTDIR: /certs
  TAG: ${TAG:-latest}

cache:
  paths:
    - /root/.m2/repository/
    - /root/.npm/

image: "docker/compose:latest"

stages:
  - build-backend
  - build-frontend
  - test-backend
  - test-frontend
  - build-docker
  - release

build-metadata-db:
  stage: build-backend
  script:
    - "make build-metadata-db"

build-identifier-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-identifier-service"

build-container-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-container-service"

build-database-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-database-service"

build-discovery-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-discovery-service"

build-gateway-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-gateway-service"

build-query-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-query-service"

build-table-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-table-service"

build-user-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-user-service"

build-metadata-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-metadata-service"

build-semantics-service:
  stage: build-backend
  script:
    - "make build-semantics-service"

build-analyse-service:
  stage: build-backend
  script:
    - "make build-analyse-service"

test-identifier-service:
  stage: test-backend
  needs:
    - build-identifier-service
  script:
    - "make test-identifier-service"
    - "cat ./dbrepo-identifier-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-identifier-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-identifier-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-identifier-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-user-service:
  stage: test-backend
  needs:
    - build-user-service
  script:
    - "make test-user-service"
    - "cat ./dbrepo-user-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-user-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-user-service/rest-service/target/surefire-reports/
