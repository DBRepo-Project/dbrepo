docs-swagger:
  stage: docs
  image: docker.io/alpine:3.18
  script:
    - "apk add bash"
    - "cd ./.docs/.swagger && bash ./generate.sh"
  cache:
    paths:
      - ./.docs/.swagger/site

docs-docs:
  stage: docs
  image: docker.io/python:3-slim
  needs:
    - docs-swagger
  script:
    - "apt-get update && apt-get install -y git make"
    - "pip install -r ./.docs/requirements.txt"
    # latest
    - "mkdocs build && cp -r ./site ../final/latest"
    # 1.3
    - "git checkout master && mkdocs build && cp -r ./site ../final/1.3"
    - "cp ./.docs/redirect.html ./final/index.html"
    - "tar czfv ./final.tar.gz ./final"