release-latest:
  stage: release
  image: docker:24-dind
  needs:
    - test-metadata-service
    - test-data-service
    - test-mirror-service
    - test-analyse-service
    - test-frontend
  only:
    refs:
      - dev
  script:
    - "ifconfig eth0 mtu 1450 up"
    - "apk add make"
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY_URL
    - echo "$CI_REGISTRY2_PASSWORD" | docker login --username "$CI_REGISTRY2_USER" --password-stdin $CI_REGISTRY2_URL
    - TAG=latest make release

release-version:
  stage: release
  image: docker:24-dind
  needs:
    - test-metadata-service
    - test-data-service
    - test-mirror-service
    - test-analyse-service
    - test-frontend
  only:
    refs:
      - master
  script:
    - "ifconfig eth0 mtu 1450 up"
    - "apk add make"
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY_URL
    - echo "$CI_REGISTRY2_PASSWORD" | docker login --username "$CI_REGISTRY2_USER" --password-stdin $CI_REGISTRY2_URL
    - "TAG=1.3 make release"

build-api-latest:
  stage: build
  image: docker.io/alpine:3.18
  only:
    refs:
      - dev
      - master
  script:
    - apk add bash git
    - git fetch && git checkout dev
    - bash .docs/.swagger/generate.sh
    - mkdir -p ./swagger/latest
    - cp -r ./site/* ./swagger/latest/
  cache:
    paths:
      - ./swagger/latest
  artifacts:
    when: always
    paths:
      - ./swagger/latest
    expire_in: 1 days

build-api-version:
  stage: build
  image: docker.io/alpine:3.18
  only:
    refs:
      - dev
      - master
  script:
    - apk add bash git
    - git fetch && git checkout master
    - bash .docs/.swagger/generate.sh
    - mkdir -p ./swagger/1.3
    - cp -r ./site/* ./swagger/1.3/
  cache:
    paths:
      - ./swagger/1.3
  artifacts:
    when: always
    paths:
      - ./swagger/1.3
    expire_in: 1 days

docs-latest:
  stage: docs
  image: docker.io/python:3.9-slim
  needs:
    - build-api-latest
    - build-api-version
  only:
    refs:
      - dev
      - master
  script:
    - apt-get update && apt-get install -y git make
    - git fetch && git checkout dev
    - pip install -r ./.docs/requirements.txt
    - mkdir -p ./final
    - mkdocs build && cp -r ./site ./final/latest
    - cp ./.docs/redirect.html ./final/index.html
    - cp -r ./swagger/latest ./final/latest/swagger
  cache:
    paths:
      - ./final
  artifacts:
    when: always
    paths:
      - ./final
    expire_in: 1 days

docs-version:
  stage: docs
  image: docker.io/python:3.9-slim
  needs:
    - build-api-latest
    - build-api-version
  only:
    refs:
      - dev
      - master
  script:
    - apt-get update && apt-get install -y git make
    - git fetch && git checkout master
    - pip install -r ./.docs/requirements.txt
    - mkdir -p ./final
    - mkdocs build && cp -r ./site ./final/1.3
    - cp -r ./swagger/1.3 ./final/1.3/swagger
  cache:
    paths:
      - ./final
  artifacts:
    when: always
    paths:
      - ./final
    expire_in: 1 days

release-docs:
  stage: release
  image: docker.io/finalgene/openssh:9.1
  needs:
    - docs-latest
    - docs-version
  only:
    refs:
      - dev
      - master
  script:
    - eval $(ssh-agent -s)
    - echo "$CI_KEY_PRIVATE" > /root/.ssh/id_rsa && chmod 0600 /root/.ssh/id_rsa
    - echo "$CI_KEY_PUBLIC" > /root/.ssh/id_rsa.pub
    - echo "$CI_DOC_ID" > ~/.ssh/known_hosts
    - tar czfv final.tar.gz ./final
    - "scp -oHostKeyAlgorithms=+ssh-rsa -oPubkeyAcceptedAlgorithms=+ssh-rsa final.tar.gz $CI_DOC_USER@$CI_DOC_IP:final.tar.gz"
    - "ssh -oHostKeyAlgorithms=+ssh-rsa -oPubkeyAcceptedAlgorithms=+ssh-rsa $CI_DOC_USER@$CI_DOC_IP 'rm -rf /system/user/ifs/infrastructures/public_html/dbrepo/*; tar xzfv ./final.tar.gz; rm -f ./final.tar.gz; cp -r ./final/* /system/user/ifs/infrastructures/public_html/dbrepo; rm -rf ./final'"
