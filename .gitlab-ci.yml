deploy-dbrepo2:
  stage: deploy
  script:
    - "cat ./.dbrepo2/known_hosts > /home/gitlab-runner/.ssh/known_hosts"
    - "scp ./docker-compose.dbrepo2.yml demo@dbrepo2.ec.tuwien.ac.at:"
    - "ssh demo@dbrepo2.ec.tuwien.ac.at '/bin/bash docker container stop $(docker container ls -aq)'"
    - "ssh demo@dbrepo2.ec.tuwien.ac.at '/bin/bash docker container rm $(docker container ls -aq)'"
    - "ssh demo@dbrepo2.ec.tuwien.ac.at 'docker system prune -f --volumes'"
    - "ssh demo@dbrepo2.ec.tuwien.ac.at 'docker compose -f ./docker-compose.dbrepo2.yml up -d"