  HOSTALIASES: ./hosts
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"
  DOCKER_HOST: "unix:///var/run/dind/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "false"
  DOC_VERSIONS: "latest,1.4.1,1.4.0,1.3.0"
  APP_VERSION: "1.4.1"
  CHART_VERSION: "1.4.1"

image: debian:12-slim

cache:
  paths:
