variables:
  HOSTALIASES: ./hosts
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"
  DOCKER_HOST: "unix:///var/run/dind/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "false"
  APP_VERSION: "1.4.4"
  CHART_VERSION: "1.4.4"

image: debian:12-slim

cache:
  policy: pull
  key: ${CI_BUILD_REF_NAME}
  paths:
    - final/
    - .m2/

stages:
  - build
  - test
  - docs
  - release
  - verify
  - scan

build-metadata-service:
  image: maven:3-openjdk-17
  stage: build
  except:
    refs:
      - /^release-.*/
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean install -Dstyle.color=always -DskipTests"

build-analyse-service:
  image: docker.io/python:3.11-alpine
  stage: build
  except:
    refs:
      - /^release-.*/
  variables:
    PIPENV_PIPFILE: "./dbrepo-analyse-service/Pipfile"
  script:
    - "pip install pipenv"
    - "pipenv install gunicorn && pipenv install --dev --system --deploy"

build-data-db-sidecar:
  image: docker.io/python:3.11-alpine
  stage: build
  except:
    refs:
      - /^release-.*/
  variables:
    PIPENV_PIPFILE: "./dbrepo-data-db/sidecar/Pipfile"
  script:
    - "pip install pipenv"
    - "pipenv install gunicorn && pipenv install --dev --system --deploy"

build-lib:
  image: docker.io/python:3.11-alpine
  stage: build
  except:
    refs:
      - /^release-.*/
  variables:
    PIPENV_PIPFILE: "./lib/python/Pipfile"
  script:
    - "pip install pipenv"
    - "pipenv install gunicorn && pipenv install --dev --system --deploy"

build-data-service:
  image: maven:3-openjdk-17
  stage: build
  except:
    refs:
      - /^release-.*/
  needs:
    - build-metadata-service
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean install -Dstyle.color=always -DskipTests"
    - "mvn -f ./dbrepo-data-service/pom.xml clean package -Dstyle.color=always -DskipTests"

build-ui:
  image: oven/bun:1.0.26-alpine
  stage: build
  except:
    refs:
      - /^release-.*/
  script:
    - "cd ./dbrepo-ui && bun install && bun run build"

build-search-service:
  image: docker.io/python:3.11-alpine
  stage: build
  except:
    refs:
      - /^release-.*/
  script:
    - "pip install pipenv"
    - "cd dbrepo-search-service && pipenv install --system --deploy"

build-docker:
  image: docker.io/docker:24-dind
  stage: build
  except:
    refs:
      - /^release-.*/
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY_URL
  script:
    - "cp .env.unix.example .env"
    - "docker build -t dbrepo-metadata-service:build --target build dbrepo-metadata-service"
    - "docker build -t dbrepo-data-service:build --target build dbrepo-data-service"
    - "docker compose build --parallel"

build-helm:
  image: docker.io/docker:24-dind
  stage: build
  except:
    refs:
      - /^release-.*/
  before_script:
    - echo "$CI_GPG_KEYRING" | base64 -d > ./secring.gpg
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY_URL
  script:
    - apk add sed helm curl
    - helm package ./helm/dbrepo --sign --key 'Martin Weise' --keyring ./secring.gpg --destination ./build

verify-install-script:
  image: docker.io/docker:24-dind
  stage: verify
  only:
    refs:
      - /^release-.*/
  variables:
    SKIP_CHECKS: 1
  script:
    - apk add bash curl
    - bash install.sh
    - exit 0

test-metadata-service:
  image: maven:3-openjdk-17
  stage: test
  except:
    refs:
      - /^release-.*/
  needs:
    - build-metadata-service
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean install -Dstyle.color=always -DskipTests"
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean test -Dstyle.color=always verify"
    - "cat ./dbrepo-metadata-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-metadata-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-metadata-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-metadata-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-data-service:
  image: maven:3-openjdk-17
  stage: test
  except:
    refs:
      - /^release-.*/
  needs:
    - build-data-service
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean install -Dstyle.color=always -DskipTests"
    - "mvn -f ./dbrepo-data-service/pom.xml clean test verify -Dstyle.color=always"
    - "cat ./dbrepo-data-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-data-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-data-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-data-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-analyse-service:
  image: docker.io/python:3.11-alpine
  stage: test
  except:
    refs:
      - /^release-.*/
  variables:
    PIPENV_PIPFILE: "./dbrepo-analyse-service/Pipfile"
  needs:
    - build-analyse-service
  script:
    - "pip install pipenv"
    - "pipenv install gunicorn && pipenv install --dev --system --deploy"
    - cd ./dbrepo-analyse-service/ && coverage run -m pytest test/test_determine_dt.py test/test_determine_pk.py test/test_s3_client.py --junitxml=report.xml && coverage html --omit="test/*" && coverage report --omit="test/*" > ./coverage.txt
    - "cat ./coverage.txt | grep -o 'TOTAL[^%]*%'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-analyse-service/report.xml
      - ./dbrepo-analyse-service/coverage.txt
    expire_in: 1 days
    reports:
      junit: ./dbrepo-analyse-service/report.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

test-search-service:
  image: docker.io/python:3.11-alpine
  stage: test
  except:
    refs:
      - /^release-.*/
  variables:
    PIPENV_PIPFILE: "./dbrepo-search-service/Pipfile"
  needs:
    - build-search-service
  script:
    - "pip install pipenv"
    - "pipenv install gunicorn && pipenv install --dev --system --deploy"
    - cd ./dbrepo-search-service/ && coverage run -m pytest test/test_opensearch_client.py --junitxml=report.xml && coverage html --omit="test/*" && coverage report --omit="test/*" > ./coverage.txt
    - "cat ./coverage.txt | grep -o 'TOTAL[^%]*%'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-search-service/report.xml
      - ./dbrepo-search-service/coverage.txt
    expire_in: 1 days
    reports:
      junit: ./dbrepo-search-service/report.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

test-lib:
  image: docker.io/python:3.11-alpine
  stage: test
  except:
    refs:
      - /^release-.*/
  variables:
    PIPENV_PIPFILE: "./lib/python/Pipfile"
  needs:
    - build-lib
  script:
    - "pip install pipenv"
    - "pipenv install gunicorn && pipenv install --dev --system --deploy"
    - cd ./lib/python/ && coverage run -m pytest tests/test_unit_analyse.py tests/test_unit_container.py tests/test_unit_database.py tests/test_unit_identifier.py tests/test_unit_license.py tests/test_unit_query.py tests/test_unit_rest_client.py tests/test_unit_table.py tests/test_unit_user.py tests/test_unit_view.py --junitxml=report.xml && coverage html --omit="test/*" && coverage report --omit="test/*" > ./coverage.txt
    - "cat ./coverage.txt | grep -o 'TOTAL[^%]*%'"
  artifacts:
    when: always
    paths:
      - ./lib/python/report.xml
      - ./lib/python/coverage.txt
    expire_in: 1 days
    reports:
      junit: ./lib/python/report.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

scan-analyse-service:
  image: bitnami/trivy:latest
  stage: scan
  only:
    refs:
      - master
  allow_failure: true
  script:
    - trivy image --insecure --exit-code 0 --format template --template "@.gitlab/gitlab.tpl" -o ./.trivy/trivy-analyse-service-report.json dbrepo-analyse-service:latest
    - trivy image --insecure --exit-code 0 dbrepo-analyse-service:latest
    - trivy image --insecure --exit-code 1 --severity CRITICAL dbrepo-analyse-service:latest
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    expire_in: 1 days
    reports:
      container_scanning: ./.trivy/trivy-analyse-service-report.json

