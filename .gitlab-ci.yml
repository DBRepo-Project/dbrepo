before_script:
  - "docker version"
  - "docker compose version"
  - "docker system prune -f"
  - "mvn --version"
  - "python3 --version"
  - "df / -h"
  - "docker logout"
  - "docker logout ghcr.io"
  - "docker logout registry.hub.docker.com"

variables:
  HOSTALIASES: ./hosts
  DOCKER_TLS_CERTDIR: /certs
  TAG: "${TAG:-latest}"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"

cache:
  paths:
    - /root/.m2/repository/
    - /root/.npm/

image: "docker/compose:latest"

stages:
  - build-backend
  - build-frontend
  - test-backend
  - test-frontend
  - build-docker
  - scan-docker
  - release-docker

build-metadata-db:
  stage: build-backend
  script:
    - "make build-metadata-db"

build-identifier-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-identifier-service"

build-container-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-container-service"

build-database-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-database-service"

build-query-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-query-service"

build-table-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-table-service"

build-user-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-user-service"

build-metadata-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-metadata-service"

build-semantics-service:
  stage: build-backend
