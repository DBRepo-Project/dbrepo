  artifacts:
    when: always
    paths:
      - ./dbrepo-analyse-service/report.xml
    expire_in: 1 days
    reports:
      junit: ./dbrepo-analyse-service/report.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

test-frontend:
  stage: test-frontend
  needs:
    - build-frontend
  script:
    - "make test-frontend"
    - "cat ./dbrepo-ui/coverage/cobertura-coverage.xml | grep -o 'line-rate=\"[0-9.]*' | head -1"
  artifacts:
    when: always
    paths:
      - ./dbrepo-ui/coverage/
    expire_in: 1 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./dbrepo-ui/coverage/cobertura-coverage.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

build-docker:
  stage: build-docker
  needs:
    - build-metadata-db
    - build-identifier-service
    - build-container-service
    - build-database-service
    - build-query-service
    - build-table-service
    - build-metadata-service
    - build-semantics-service
    - build-analyse-service
    - build-user-service
  script:
    - cp .env.unix.example .env
    - make build-docker

build-frontend:
  stage: build-frontend
  script:
    - make build-frontend

scan-analyse-service:
  stage: scan-docker
  needs:
    - build-docker
  only:
    refs:
      - dev
      - master
  allow_failure: true
  script:
    - make scan-analyse-service
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    expire_in: 1 days
    reports:
      container_scanning: ./.trivy/trivy-analyse-service-report.json

