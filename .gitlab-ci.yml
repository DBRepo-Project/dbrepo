before_script:
  - "docker version"
  - "docker compose version"
  - "docker system prune -f"
  - "mvn --version"
  - "python3 --version"
  - "df / -h"

variables:
  HOSTALIASES: ./hosts
  DOCKER_TLS_CERTDIR: /certs
  TAG: ${TAG:-latest}

cache:
  paths:
    - /root/.m2/repository/
    - /root/.npm/

image: "docker/compose:latest"

stages:
  - build-backend
  - build-frontend
  - test-backend
  - test-frontend
  - build-docker
  - release

build-backend-metadata-db:
  stage: build-backend
  script:
    - "make build-backend-metadata-db"

build-backend-authentication:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-authentication"

build-backend-identifier:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-identifier"

build-backend-container:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-container"

build-backend-database:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-database"

build-backend-discovery:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-discovery"

build-backend-gateway:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-gateway"

build-backend-query:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-query"

build-backend-table:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-table"

build-backend-metadata:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-backend-metadata"

build-backend-semantics:
  stage: build-backend
  script:
    - "make build-backend-semantics"

build-backend-analyse:
  stage: build-backend
  script:
    - "make build-backend-analyse"

test-backend-authentication:
  stage: test-backend
  needs:
    - build-backend-authentication
  script:
    - "make test-authentication-service"
    - "cat ./dbrepo-authentication-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-authentication-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-authentication-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-authentication-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-identifier-service:
  stage: test-backend
  needs:
    - build-backend-authentication
  script:
    - "make test-identifier-service"
    - "cat ./dbrepo-identifier-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-identifier-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-identifier-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-identifier-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

