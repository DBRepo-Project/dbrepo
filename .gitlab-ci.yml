  HOSTALIASES: ./hosts
  TAG: "${TAG:-latest}"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"
  DOCKER_HOST: "unix:///var/run/dind/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "false"

image: debian:12-slim

cache:
  paths:
    - /root/.m2/repository/
    - /root/.npm/

