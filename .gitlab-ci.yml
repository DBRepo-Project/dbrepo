    - scan-proxy
    - scan-query-service
    - scan-search-db
    - scan-semantics-service
    - scan-table-service
    - scan-ui
    - scan-user-service
  only:
    refs:
      - master
  script:
    - cp .env.unix.example .env
    - docker login -p "${DOCKER_PASSWORD}" -u "${DOCKER_USERNAME}"
    - TAG=1.3 make release
