variables:
  HOSTALIASES: ./hosts
  DOCKER_HOST: "unix:///var/run/dind/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "false"
  PYTHON_VERSION: "3.11"
  APP_VERSION: "1.4.5"
  CHART_VERSION: "1.4.5"
  CACHE_FALLBACK_KEY: ${CI_DEFAULT_BRANCH}
  # This will supress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true -Dstyle.color=always"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

image: debian:12-slim

# Cache downloaded dependencies and plugins between builds.
# To keep cache across branches add 'key: "$CI_JOB_NAME"'
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

stages:
  - build
  - lint
  - test
  - docs
  - release
  - verify
  - scan

build-metadata-service:
  image: maven:3-openjdk-17
  stage: build
  except:
    refs:
      - /^release-.*/
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean install $MAVEN_CLI_OPTS -DskipTests"

build-data-service:
  image: maven:3-openjdk-17
  stage: build
  except:
    refs:
      - /^release-.*/
  needs:
    - build-metadata-service
  script:
    - "ls -la ~"
    - "ls -la .m2/repository"
    - "mvn -f ./dbrepo-data-service/pom.xml clean package $MAVEN_CLI_OPTS -DskipTests"

