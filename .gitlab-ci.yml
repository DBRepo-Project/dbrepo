variables:
  HOSTALIASES: ./hosts
  DOCKER_TLS_CERTDIR: /certs
  TAG: "${TAG:-latest}"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"

cache:
  paths:
    - /root/.m2/repository/
    - /root/.npm/

image: "docker/compose:latest"

stages:
  - build-backend
  - build-frontend
  - test-backend
  - test-frontend
  - build-docker
  - test-deployment
  - scan-docker
  - release-docker

build-metadata-service:
  stage: build-backend
  script:
    - "make build-metadata-service"

build-analyse-service:
  stage: build-backend
  script:
    - "make build-analyse-service"

build-data-service:
  stage: build-backend
  needs:
    - build-metadata-service
  script:
    - "make build-data-service"

build-mirror-service:
  stage: build-backend
  needs:
    - build-metadata-service
  script:
    - "make build-mirror-service"

build-frontend:
  stage: build-frontend
  script:
    - "make build-frontend"

build-docker:
  image: docker:24-dind
  stage: build-docker
  needs:
    - build-metadata-service
    - build-analyse-service
  script:
    - "cp .env.unix.example .env"
    - "make build-docker"

test-deployment:
  stage: release-docker
  needs:
    - release-latest
  only:
    refs:
      - dev
  script:
    - "curl -sSL https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services/-/raw/dev/install.sh | sudo bash"

test-metadata-service:
  stage: test-backend
  needs:
    - build-metadata-service
  script:
    - "make test-metadata-service"
    - "cat ./dbrepo-metadata-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-metadata-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-metadata-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-metadata-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-data-service:
  stage: test-backend
  needs:
    - build-data-service
  script:
    - "make test-data-service"
    - "cat ./dbrepo-data-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-data-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-data-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-data-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-mirror-service:
  stage: test-backend
  needs:
    - build-mirror-service
  script:
    - "make test-mirror-service"
    - "cat ./dbrepo-mirror-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-mirror-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-mirror-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-mirror-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-analyse-service:
  stage: test-backend
  needs:
    - build-analyse-service
  script:
    - "make test-analyse-service"
    - "cat ./dbrepo-analyse-service/coverage.txt | grep -o 'TOTAL[^%]*%'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-analyse-service/report.xml
    expire_in: 1 days
    reports:
      junit: ./dbrepo-analyse-service/report.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

test-frontend:
  stage: test-frontend
  needs:
    - build-frontend
  script:
    - "make test-frontend"
    - "cat ./dbrepo-ui/coverage/cobertura-coverage.xml | grep -o 'line-rate=\"[0-9.]*' | head -1"
  artifacts:
    when: always
    paths:
      - ./dbrepo-ui/coverage/
    expire_in: 1 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./dbrepo-ui/coverage/cobertura-coverage.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

scan-analyse-service:
  stage: scan-docker
  needs:
    - build-docker
  only:
    refs:
      - dev
      - master
  allow_failure: true
  script:
    - make scan-analyse-service
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    expire_in: 1 days
    reports:
      container_scanning: ./.trivy/trivy-analyse-service-report.json

