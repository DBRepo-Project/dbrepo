variables:
  DOCKER_HOST: "tcp://localhost:2375/"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_TLS_VERIFY: 0
  TAG: "${TAG:-latest}"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"

image: maven:3-openjdk-17

services:
  - docker:24-dind-rootless

stages:
  - build-backend
  - build-frontend
  - test-backend
  - test-frontend
  - build-docker
  - scan-docker
  - release-docker

build-metadata-service:
  image: openjdk:17-alpine
  stage: build-backend
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean test verify"

build-analyse-service:
  image: python:3.9-slim
  stage: build-backend
  script:
    - "mvn -f ./dbrepo-analyse-service/pom.xml clean test verify"

build-search-sync-agent:
  image: openjdk:17-alpine
  stage: build-backend
  script:
    - "mvn -f ./dbrepo-metadata-service/pom.xml clean install -DskipTests"
    - "mvn -f ./dbrepo-search-sync-agent/pom.xml clean package -DskipTests"

test-metadata-service:
  stage: test-backend
  needs:
    - build-metadata-service
  script:
    - "make test-metadata-service"
    - "cat ./dbrepo-metadata-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-metadata-service/report/target/site/jacoco-aggregate/
      - ./dbrepo-metadata-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-metadata-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-search-sync-agent:
  stage: test-backend
  needs:
    - build-search-sync-agent
  script:
    - "make test-search-sync-agent"
    - "cat ./dbrepo-search-sync-agent/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-search-sync-agent/report/target/site/jacoco-aggregate/
      - ./dbrepo-search-sync-agent/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./dbrepo-search-sync-agent/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

test-analyse-service:
  stage: test-backend
  needs:
    - build-analyse-service
  script:
    - "make test-analyse-service"
    - "cat ./dbrepo-analyse-service/coverage.txt | grep -o 'TOTAL[^%]*%'"
  artifacts:
    when: always
    paths:
      - ./dbrepo-analyse-service/report.xml
    expire_in: 1 days
    reports:
      junit: ./dbrepo-analyse-service/report.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

test-frontend:
  stage: test-frontend
  needs:
    - build-frontend
  script:
    - "make test-frontend"
    - "cat ./dbrepo-ui/coverage/cobertura-coverage.xml | grep -o 'line-rate=\"[0-9.]*' | head -1"
  artifacts:
    when: always
    paths:
      - ./dbrepo-ui/coverage/
    expire_in: 1 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./dbrepo-ui/coverage/cobertura-coverage.xml
  coverage: '/TOTAL.*?([0-9]{1,3})%/'

build-docker:
  stage: build-docker
  needs:
    - build-metadata-service
    - build-analyse-service
  script:
    - bash .scripts/docker-prune.sh
    - cp .env.unix.example .env
    - make build-docker

build-frontend:
  stage: build-frontend
  script:
    - make build-frontend

scan-analyse-service:
  stage: scan-docker
  needs:
    - build-docker
  only:
    refs:
      - dev
      - master
  allow_failure: true
  script:
    - make scan-analyse-service
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    expire_in: 1 days
    reports:
      container_scanning: ./.trivy/trivy-analyse-service-report.json

