before_script:
  - "docker version"
  - "docker compose version"
  - "docker system prune -f"
  - "mvn --version"
  - "python3 --version"
  - "df / -h"

variables:
  HOSTALIASES: ./hosts
  DOCKER_TLS_CERTDIR: /certs
  TAG: ${TAG:-latest}

cache:
  paths:
    - /root/.m2/repository/
    - /root/.npm/

image: "docker/compose:latest"

stages:
  - build-backend
  - build-frontend
  - test-backend
  - test-frontend
  - build-docker
  - release

build-metadata-db:
  stage: build-backend
  script:
    - "make build-metadata-db"

build-authentication-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-authentication-service"

build-identifier-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-identifier-service"

build-container-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-container-service"

build-database-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-database-service"

build-discovery-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-discovery-service"

build-gateway-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-gateway-service"

build-query-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-query-service"

build-table-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-table-service"

build-metadata-service:
  stage: build-backend
  needs:
    - build-metadata-db
  script:
    - "make build-metadata-service"

build-semantics-service:
  stage: build-backend
  script:
    - "make build-semantics-service"

build-analyse-service:
  stage: build-backend
  script:
    - "make build-analyse-service"

test-backend-authentication:
  stage: test-backend
  needs:
    - build-authentication-service
  script:
    - "make test-authentication-service"
    - "cat ./fda-authentication-service/report/target/site/jacoco-aggregate/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'"
  artifacts:
    when: always
    paths:
      - ./fda-authentication-service/report/target/site/jacoco-aggregate/
      - ./fda-authentication-service/rest-service/target/surefire-reports/
    expire_in: 1 days
    reports:
      junit: ./fda-authentication-service/rest-service/target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

