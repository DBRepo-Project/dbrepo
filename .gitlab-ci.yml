before_script: 
  - "docker version"
  - "docker-compose version"
  - "mvn --version"
  - "df / -h"

variables:
  HOSTALIASES: ./hosts
  DOCKER_TLS_CERTDIR: /certs

cache:
  paths: 
    - /root/.m2/repository/
    - /root/.npm/

image: "docker/compose:latest"

stages:
  - build

build-backend-metadata:
  stage: build
  script:
    - "make build-backend-metadata"

build-backend-authentication:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-authentication"

build-backend-identifier:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-identifier"

build-backend-container:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-container"

build-backend-database:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-database"

build-backend-discovery:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-discovery"

build-backend-gateway:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-gateway"

build-backend-query:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-query"

build-backend-table:
  stage: build
  needs:
    - build-backend-metadata
  script:
    - "make build-backend-table"

build-docker:
  stage: build
  script:
    - make build-docker

build-frontend:
  stage: build
  script:
    - make build-frontend

