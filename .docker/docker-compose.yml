volumes:
  metadata-db-data:
  data-db-data:
  auth-db-data:
  broker-service-data:
  upload-service-data:
  search-db-data:
  identity-service-data:
  metric-db-data:
  dashboard-service-data:

services:
  dbrepo-metadata-db:
    restart: "no"
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    image: docker.io/bitnami/mariadb-galera:11.3.2-debian-12-r9
    volumes:
      - metadata-db-data:/bitnami/mariadb
      - ./config/1_setup-schema.sql:/docker-entrypoint-initdb.d/1_setup-schema.sql
      - ./config/2_setup-data.sql:/docker-entrypoint-initdb.d/2_setup-data.sql
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: "${METADATA_DB:-dbrepo}"
      MARIADB_ROOT_PASSWORD: "${METADATA_DB_PASSWORD:-dbrepo}"
      MARIADB_GALERA_MARIABACKUP_PASSWORD: "${METADATA_DB_BACKUP_PASSWORD:-dbrepobackup}"
    healthcheck:
      test: mysqladmin ping --user=root --password="${METADATA_DB_PASSWORD:-dbrepo}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-data-db:
    restart: "no"
    container_name: dbrepo-data-db
    hostname: data-db
    image: docker.io/bitnami/mariadb-galera:11.3.2-debian-12-r9
    volumes:
      - data-db-data:/bitnami/mariadb
      - "${SHARED_VOLUME:-/tmp}:/tmp"
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${DATA_DB_PASSWORD:-dbrepo}"
      MARIADB_GALERA_MARIABACKUP_PASSWORD: "${DATA_DB_BACKUP_PASSWORD:-dbrepobackup}"
    healthcheck:
      test: mysqladmin ping --user=root --password="${DATA_DB_PASSWORD:-dbrepo}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-auth-db:
    restart: "no"
    container_name: dbrepo-auth-db
    hostname: auth-db
    image: docker.io/bitnami/postgresql:17.0.0-debian-12-r1
    volumes:
      - auth-db-data:/bitnami/postgresql
    environment:
      POSTGRESQL_DATABASE: "${AUTH_DB_NAME:-keycloak}"
      POSTGRESQL_USERNAME: "${AUTH_DB_USERNAME:-keycloak}"
      POSTGRESQL_PASSWORD: "${AUTH_DB_PASSWORD:-dbrepo}"
      PGPASSWORD: "${AUTH_DB_PASSWORD:-dbrepo}"
    healthcheck:
      test: "psql -U ${AUTH_DB_USERNAME:-keycloak} -h 127.0.0.1 -p 5432 -d ${AUTH_DB_NAME:-keycloak} -c 'select version();'"
      interval: 15s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-auth-service:
    restart: "no"
    container_name: dbrepo-auth-service
    hostname: auth-service
    image: bitnami/keycloak:26.0.0-debian-12-r1
    volumes:
      - ./config/import-realms.sh:/docker-entrypoint-initdb.d/import-realms.sh
      - ./config/master-realm.json:/opt/keycloak/data/import/master-realm.json
      - ./config/dbrepo-realm.json:/opt/keycloak/data/import/dbrepo-realm.json
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ENABLE_HTTPS: "false"
      KEYCLOAK_ENABLE_STATISTICS: "true"
      KEYCLOAK_ENABLE_HEALTH_ENDPOINTS: "true"
      KEYCLOAK_DATABASE_HOST: "auth-db"
      KEYCLOAK_DATABASE_NAME: "${AUTH_DB_NAME:-keycloak}"
      KEYCLOAK_DATABASE_USER: "${AUTH_DB_USERNAME:-keycloak}"
      KEYCLOAK_DATABASE_PASSWORD: "${AUTH_DB_PASSWORD:-dbrepo}"
    healthcheck:
      test: curl --head -fsS http://localhost:9000/health/ready
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      dbrepo-identity-service:
        condition: service_healthy
      dbrepo-auth-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-auth-service-init:
    init: true
    restart: "no"
    image: registry.datalab.tuwien.ac.at/dbrepo/metadata-service:1.6.2
    environment:
      AUTH_SERVICE_ADMIN: ${AUTH_SERVICE_ADMIN:-admin}
      AUTH_SERVICE_ADMIN_PASSWORD: ${AUTH_SERVICE_ADMIN_PASSWORD:-admin}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      METADATA_DB: "${METADATA_DB:-dbrepo}"
      METADATA_DB_PASSWORD: "${METADATA_DB_PASSWORD:-dbrepo}"
      METADATA_USERNAME: "root"
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
    depends_on:
      dbrepo-auth-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-metadata-service:
    restart: "no"
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    image: registry.datalab.tuwien.ac.at/dbrepo/metadata-service:1.6.2
    volumes:
      - "${SHARED_VOLUME:-/tmp}:/tmp"
    environment:
      ADMIN_EMAIL: "${ADMIN_EMAIL:-noreply@localhost}"
      ANALYSE_SERVICE_ENDPOINT: "${ANALYSE_SERVICE_ENDPOINT:-http://analyse-service:8080}"
      AUTH_SERVICE_ADMIN: ${AUTH_SERVICE_ADMIN:-admin}
      AUTH_SERVICE_ADMIN_PASSWORD: ${AUTH_SERVICE_ADMIN_PASSWORD:-admin}
      AUTH_SERVICE_CLIENT: ${AUTH_SERVICE_CLIENT:-dbrepo-client}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      BASE_URL: "${BASE_URL:-http://localhost}"
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME:-dbrepo}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-dbrepo}
      BROKER_HOST: "${BROKER_ENDPOINT:-broker-service}"
      BROKER_PASSWORD: ${BROKER_PASSWORD:-admin}
      BROKER_PORT: ${BROKER_PORT:-5672}
      BROKER_SERVICE_ENDPOINT: ${BROKER_SERVICE_ENDPOINT:-http://broker-service:15672}
      BROKER_USERNAME: ${BROKER_USERNAME:-admin}
      BROKER_VIRTUALHOST: "${BROKER_VIRTUALHOST:-dbrepo}"
      CROSSREF_ENDPOINT: "${CROSSREF_ENDPOINT:-http://data.crossref.org}"
      DATA_SERVICE_ENDPOINT: ${DATA_SERVICE_ENDPOINT:-http://data-service:8080}
      DELETED_RECORD: "${DELETED_RECORD:-persistent}"
      GRANULARITY: "${GRANULARITY:-YYYY-MM-DDThh:mm:ssZ}"
      JWT_PUBKEY: "${JWT_PUBKEY:-}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METADATA_DB: "${METADATA_DB:-dbrepo}"
      METADATA_DB_PASSWORD: "${METADATA_DB_PASSWORD:-dbrepo}"
      METADATA_HOST: "${METADATA_HOST:-metadata-db}"
      METADATA_JDBC_EXTRA_ARGS: "${METADATA_JDBC_EXTRA_ARGS:-}"
      METADATA_PORT: "${METADATA_PORT:-3306}"
      METADATA_USERNAME: root
      REPOSITORY_NAME: "${REPOSITORY_NAME:-Database Repository}"
      ROR_ENDPOINT: "${ROR_ENDPOINT:-https://api.ror.org}"
      SEARCH_SERVICE_ENDPOINT: "${SEARCH_SERVICE_ENDPOINT:-http://search-service:8080}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-seaweedfsadmin}"
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://storage-service:9000}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-seaweedfsadmin}"
      SPARQL_CONNECTION_TIMEOUT: "${SPARQL_CONNECTION_TIMEOUT:-10000}"
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/actuator/health/liveness | grep 'UP' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      dbrepo-auth-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-data-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-analyse-service:
    restart: "no"
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    image: registry.datalab.tuwien.ac.at/dbrepo/analyse-service:1.6.2
    environment:
      AUTH_SERVICE_CLIENT: ${AUTH_SERVICE_CLIENT:-dbrepo-client}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      JWT_PUBKEY: "${JWT_PUBKEY:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-seaweedfsadmin}"
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_ENDPOINT: "${S3_ENDPOINT:-storage-service:9000}"
      S3_PROTO: "${S3_PROTO:-http}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-seaweedfsadmin}"
      METADATA_SERVICE_ENDPOINT: ${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    volumes:
      - "${SHARED_FILESYSTEM:-/tmp}:/tmp"
    healthcheck:
      test: curl -sSL localhost:8080/health | grep 'UP' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-broker-service:
    restart: "no"
    container_name: dbrepo-broker-service
    hostname: broker-service
    image: docker.io/bitnami/rabbitmq:3.13.7-debian-12-r4
    ports:
      - 5672:5672
      - 1883:1883
    volumes:
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./config/advanced.config:/etc/rabbitmq/advanced.config
      - ./config/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./config/definitions.json:/app/definitions.json
      - broker-service-data:/bitnami/rabbitmq/mnesia
    environment:
      RABBITMQ_FEATURE_FLAGS: mqtt_v5
    depends_on:
      dbrepo-identity-service:
        condition: service_healthy
    healthcheck:
      test: rabbitmq-diagnostics -q is_running | grep 'is fully booted and running'
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-search-db:
    restart: "no"
    container_name: dbrepo-search-db
    hostname: search-db
    image: registry.datalab.tuwien.ac.at/dbrepo/search-db:1.6.2
    healthcheck:
      test: curl -sSL localhost:9200/_plugins/_security/health | jq .status | grep UP
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
      logger.level: "WARN"
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "9200:9200"
    volumes:
      - search-db-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  dbrepo-search-service:
    restart: "no"
    container_name: dbrepo-search-service
    hostname: search-service
    image: registry.datalab.tuwien.ac.at/dbrepo/search-service:1.6.2
    environment:
      AUTH_SERVICE_CLIENT: ${AUTH_SERVICE_CLIENT:-dbrepo-client}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      COLLECTION: ${COLLECTION:-['database','table','column','identifier','unit','concept','user','view']}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METADATA_SERVICE_ENDPOINT: ${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-search-db}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      OPENSEARCH_USERNAME: ${SEARCH_DB_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${SEARCH_DB_PASSWORD:-admin}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/health | grep 'UP' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

  dbrepo-ui:
    restart: "no"
    container_name: dbrepo-ui
    hostname: ui
    image: registry.datalab.tuwien.ac.at/dbrepo/ui:1.6.2
    environment:
      NUXT_PUBLIC_API_CLIENT: "${BASE_URL:-http://localhost}"
      NUXT_PUBLIC_API_SERVER: "${BASE_URL:-http://localhost}"
      NUXT_PUBLIC_UPLOAD_CLIENT: "${BASE_URL:-http://localhost}/api/upload/files"
    depends_on:
      dbrepo-search-service:
        condition: service_healthy
      dbrepo-upload-service:
        condition: service_healthy
    healthcheck:
      test: curl -fsSL http://127.0.0.1:3000 && curl -fsSL http://127.0.0.1:3000/health
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-gateway-service:
    restart: "no"
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: docker.io/nginx:1.27.3-alpine3.20-slim
    ports:
      - "80:8080"
    volumes:
      - ./config/dbrepo.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      dbrepo-analyse-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-dashboard-service:
        condition: service_healthy
      dbrepo-ui:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-identity-service:
    restart: "no"
    container_name: dbrepo-identity-service
    hostname: identity-service
    image: bitnami/openldap:2.6.8-debian-12-r1
    environment:
      LDAP_ADMIN_USERNAME: "${IDENTITY_SERVICE_ADMIN_USERNAME:-admin}"
      LDAP_ADMIN_PASSWORD: "${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin}"
      LDAP_USERS: "${SYSTEM_USERNAME:-admin}"
      LDAP_PASSWORDS: "${SYSTEM_PASSWORD:-admin}"
      LDAP_GROUP: "${ADMIN_GROUP:-system}"
      LDAP_ROOT: "${IDENTITY_SERVICE_ROOT:-dc=dbrepo,dc=at}"
      LDAP_ADMIN_DN: "${IDENTITY_SERVICE_ADMIN_DN:-cn=admin,dc=dbrepo,dc=at}"
    volumes:
      - identity-service-data:/bitnami/openldap
    healthcheck:
      test: "ldapwhoami -H ldap://localhost:1389 -D ${IDENTITY_SERVICE_ADMIN_DN:-cn=admin,dc=dbrepo,dc=at} -w ${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin} || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12

  dbrepo-search-service-init:
    restart: "no"
    init: true
    container_name: dbrepo-search-service-init
    hostname: search-service-init
    image: registry.datalab.tuwien.ac.at/dbrepo/search-service-init:1.6.2
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METADATA_SERVICE_ENDPOINT: ${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-search-db}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      OPENSEARCH_USERNAME: ${SEARCH_DB_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${SEARCH_DB_PASSWORD:-admin}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    depends_on:
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-storage-service:
    restart: "no"
    container_name: dbrepo-storage-service
    hostname: storage-service
    image: docker.io/bitnami/seaweedfs:3.71.0-debian-12-r4
    command: [ "server", "-s3", "-s3.port=9000", "-s3.config=/app/s3_config.json", "-metricsPort=9090" ]
    volumes:
      - ./config/s3_config.json:/app/s3_config.json
    ports:
      - "9000:9000"
      - "8888:8888"
    healthcheck:
      test: echo "cluster.check" | weed shell | grep "checking master.*ok" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-metric-db:
    restart: "no"
    container_name: dbrepo-metric-db
    hostname: metric-db
    image: docker.io/bitnami/prometheus:2.54.1-debian-12-r4
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - metric-db-data:/opt/bitnami/prometheus/data
    healthcheck:
      test: promtool check healthy
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-dashboard-service:
    restart: "no"
    container_name: dbrepo-dashboard-service
    hostname: dashboard-service
    image: registry.datalab.tuwien.ac.at/dbrepo/dashboard-service:1.6.2
    ports:
      - "3000:3000"
    volumes:
      - dashboard-service-data:/opt/bitnami/grafana/data
    environment:
      GF_SERVER_DOMAIN: "dashboard-service"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      LDAP_ADMIN_USERNAME: "${IDENTITY_SERVICE_ADMIN_USERNAME:-admin}"
      LDAP_ADMIN_PASSWORD: "${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin}"
      LDAP_ROOT: "${IDENTITY_SERVICE_ROOT:-dc=dbrepo,dc=at}"
    healthcheck:
      test: test -f /opt/bitnami/grafana/tmp/grafana.pid
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      dbrepo-metric-db:
        condition: service_started
    logging:
      driver: json-file

  dbrepo-storage-service-init:
    restart: "no"
    init: true
    container_name: dbrepo-storage-service-init
    hostname: storage-service-init
    image: registry.datalab.tuwien.ac.at/dbrepo/storage-service-init:1.6.2
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-seaweedfsadmin}
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-seaweedfsadmin}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage-service:9000}
    depends_on:
      dbrepo-storage-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-upload-service:
    restart: "no"
    container_name: dbrepo-upload-service
    hostname: upload-service
    image: docker.io/tusproject/tusd:v2.4.0
    volumes:
      - "./config/pre-create.sh:/srv/tusd-hooks/pre-create:ro"
    command:
      - "-behind-proxy"
      - "-max-size=2000000000"
      - "-base-path=/api/upload/files/"
      - "-hooks-dir=/srv/tusd-hooks/"
      - "-s3-endpoint=${STORAGE_ENDPOINT:-http://storage-service:9000}"
      - "-s3-bucket=dbrepo"
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-seaweedfsadmin}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-seaweedfsadmin}"
      AWS_REGION: "${STORAGE_REGION_NAME:-default}"
    depends_on:
      dbrepo-storage-service:
        condition: service_healthy
    healthcheck:
      test: wget -qO- localhost:8080/metrics | grep "tusd" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-data-service:
    restart: "no"
    container_name: dbrepo-data-service
    hostname: data-service
    image: registry.datalab.tuwien.ac.at/dbrepo/data-service:1.6.2
    volumes:
      - "${SHARED_VOLUME:-/tmp}:/tmp"
    environment:
      AUTH_SERVICE_ADMIN: "${AUTH_SERVICE_ADMIN:-admin}"
      AUTH_SERVICE_ADMIN_PASSWORD: "${AUTH_SERVICE_ADMIN_PASSWORD:-admin}"
      AUTH_SERVICE_CLIENT: "${AUTH_SERVICE_CLIENT:-dbrepo-client}"
      AUTH_SERVICE_CLIENT_SECRET: "${AUTH_SERVICE_CLIENT:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}"
      AUTH_SERVICE_ENDPOINT: "${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}"
      BROKER_EXCHANGE_NAME: "${BROKER_EXCHANGE_NAME:-dbrepo}"
      BROKER_QUEUE_NAME: "${BROKER_QUEUE_NAME:-dbrepo}"
      BROKER_HOST: "${BROKER_ENDPOINT:-broker-service}"
      BROKER_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
      BROKER_PORT: ${BROKER_PORT:-5672}
      BROKER_SERVICE_ENDPOINT: "${BROKER_SERVICE_ENDPOINT:-http://broker-service:15672}"
      BROKER_USERNAME: "${SYSTEM_USERNAME:-admin}"
      BROKER_VIRTUALHOST: "${BROKER_VIRTUALHOST:-dbrepo}"
      CONNECTION_TIMEOUT: ${CONNECTION_TIMEOUT:-60000}
      COMPUTE_SERVICE_ENDPOINT: "${COMPUTE_SERVICE_ENDPOINT:-local[2]}"
      EXCHANGE_NAME: "${EXCHANGE_NAME:-dbrepo}"
      METADATA_SERVICE_ENDPOINT: "${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}"
      GRANT_DEFAULT_READ: "${GRANT_DEFAULT_READ:-SELECT}"
      GRANT_DEFAULT_WRITE: "${GRANT_DEFAULT_WRITE:-SELECT, CREATE, CREATE VIEW, CREATE ROUTINE, CREATE TEMPORARY TABLES, LOCK TABLES, INDEX, TRIGGER, INSERT, UPDATE, DELETE}"
      JWT_PUBKEY: "${JWT_PUBKEY:-}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_CONCURRENT_CONSUMERS: ${MIN_CONCURRENT_CONSUMERS:-1}
      MAX_CONCURRENT_CONSUMERS: ${MAX_CONCURRENT_CONSUMERS:-5}
      QUEUE_NAME: ${QUEUE_NAME:-dbrepo}
      REQUEUE_REJECTED: ${REQUEUE_REJECTED:-false}
      ROUTING_KEY: "${ROUTING_KEY:-dbrepo.#}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-seaweedfsadmin}"
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://storage-service:9000}"
      S3_FILE_PATH: "${S3_FILE_PATH:-/tmp}"
      S3_IMPORT_BUCKET: "${S3_IMPORT_BUCKET:-dbrepo-upload}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-seaweedfsadmin}"
      SPARK_USER: "${COMPUTE_SERVICE_USERNAME:-spark}"
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/actuator/health/liveness | grep 'UP' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      dbrepo-data-db:
        condition: service_healthy
    logging:
      driver: json-file
