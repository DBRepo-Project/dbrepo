extra_css:
  - stylesheets/extra.css
theme:
  favicon: images/favicon.ico
  custom_dir: docs/overrides
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - content.code.annotate
    - content.code.copy
    - content.tooltips
  icon:
    logo: material/database-search
    repo: fontawesome/brands/git-alt
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      font:
        code: Roboto Mono
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      font:
        code: Roboto Mono
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  name: material
markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: True
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
      options:
        custom_icons:
          - docs/overrides/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - mike:
      alias_type: redirect
      deploy_prefix: infrastructures/dbrepo
      canonical_version: latest
extra:
  homepage: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/1.11/
  version:
    default: 1.11
    provider: mike
  social:
    - icon: simple/artifacthub
      link: https://artifacthub.io/packages/helm/dbrepo/dbrepo
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dbrepo/
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services
