tags:
  - database-endpoint
summary: Updates a database
operationId: update_database
description: Updates a database
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: "body"
    name: "body"
    required: true
    schema:
      $ref: '#/components/schemas/DatabaseDto'
security:
  - bearerAuth: [ ]
  - basicAuth: [ ]
responses:
  202:
    description: Updated database successfully
    content:
      application/json:
        schema:
          required:
            - id
          type: object
          properties:
            id:
              type: integer
              example: 1
              implementation: int64
  400:
    description: "Invalid schema"
    content:
      application/json:
        schema:
          required:
            - success
            - message
          type: object
          properties:
            success:
              type: boolean
              example: false
            message:
              type: string
              example: Message
  404:
    description: "Database not found"
    content:
      application/json:
        schema:
          required:
            - success
            - message
          type: object
          properties:
            success:
              type: boolean
              example: false
            message:
              type: string
              example: Message
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
