tags:
  - search-endpoint
summary: Gets the index
operationId: get_index
description: Gets the index
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: type
    schema:
      type: string
      enum: [ database, table, view, column, user, identifier, concept, unit ]
    required: true
    description: The search type.
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number. Pagination is optional for POST and fuzzy search.
  - in: query
    name: results_per_page
    schema:
      type: integer
      minimum: 1
      maximum: 500
      default: 50
    description: Page size. Omitted POST and fuzzy pagination returns all matches.
responses:
  200:
    description: An array of the requested result type, using current metadata permissions.
    headers:
      X-Count:
        description: Total authorized projected results before pagination.
        schema:
          type: integer
      X-Total-Pages:
        description: Number of pages when pagination is requested.
        schema:
          type: integer
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: Invalid search or pagination parameters.
  503:
    description: Current metadata or native matching could not be evaluated completely.
