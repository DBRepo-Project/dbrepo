tags:
  - search-endpoint
summary: Performs a general search
operationId: post_general_search
description: Performs a general search
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: type
    schema:
      type: string
      enum: [ database, table, view, column, user, identifier, concept, unit ]
    required: true
    description: The search type.
  - in: "query"
    name: "t1"
    schema:
      type: "number"
  - in: "query"
    name: "t2"
    schema:
      type: "number"
  - in: "body"
    name: "body"
    required: true
    schema:
      type: object
      additionalProperties: true
      description: Field paths and values to match. Semantic ranges also accept t1 and t2 here.
      example:
        tables.columns.concept.uri: http://www.wikidata.org/entity/Q11466
        tables.columns.unit.uri: http://www.ontology-of-units-of-measure.org/resource/om-2/degreeCelsius
        t1: 0
        t2: 100
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number. Pagination is optional for POST and fuzzy search.
  - in: query
    name: results_per_page
    schema:
      type: integer
      minimum: 1
      maximum: 500
      default: 50
    description: Page size. Omitted POST and fuzzy pagination returns all matches.
responses:
  200:
    description: An array of the requested result type, using current metadata permissions.
    headers:
      X-Count:
        description: Total authorized projected results before pagination.
        schema:
          type: integer
      X-Total-Pages:
        description: Number of pages when pagination is requested.
        schema:
          type: integer
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: Invalid search or pagination parameters.
  503:
    description: Current metadata or native matching could not be evaluated completely.
