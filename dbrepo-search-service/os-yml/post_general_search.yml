tags:
  - search-endpoint
summary: Performs a general search
operationId: post_general_search
description: Performs a general search
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: type
    schema:
      type: string
      enum: [ database, table, view, column, user, identifier, concept, unit ]
    required: true
    description: The search type.
  - in: "query"
    name: "t1"
    schema:
      type: "integer"
  - in: "query"
    name: "t2"
    schema:
      type: "integer"
  - in: "body"
    name: "body"
    required: true
    schema:
      $ref: '#/components/schemas/SearchRequestDto'
responses:
  200:
    description: OK, contains the elements formatted as an array of JSON arrays
    content:
      application/json:
        schema:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
            type:
              type: string
              enum: [ database, table, view, column, user, identifier, concept, unit ]
              description: "Same as the requested type"
