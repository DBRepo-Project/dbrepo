summary: Return a short information about all databases in the elastic search instance
description: |
  Return a short information about all databases in the elastic search instance
consumes:
  - application/json
produces:
  - application/json
definitions:
  Database:
    type: object
    properties:
      id:
        type: integer
        description: The id of the database
      name:
        type: string
        description: The name of the database
      public:
        type: boolean
        description: The public status of the database
responses:
  200:
    description: OK, contains the elements formatted as a JSON array
    schema:
      type: array
      items:
        $ref: '#/definitions/Database'
  404:
    description: No matching element found, no databases exist in the elastic search instance
tags:
  - get_databases_endpoint