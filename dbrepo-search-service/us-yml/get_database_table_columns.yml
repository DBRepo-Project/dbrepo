summary: Return a short information about all columns in the elastic search instance in a specific table in a specific database
description: |
  Return a short information about all columns in the elastic search instance in a specific table in a specific database
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: "path"
    type: "integer"
    name: "table_id"
    description: "The ID of the table to retrieve further information about"
    required: true
  - in: "path"
    type: "integer"
    name: "database_id"
    description: "The ID of the database to retrieve further information about"
    required: true
definitions:
  Column:
    type: object
    properties:
      id:
        type: integer
        description: The id of the column
      name:
        type: string
        description: The name of the column
      column_type:
        type: string
        description: The type of the column
responses:
  200:
    description: OK, contains the elements formatted as a JSON array
    schema:
      type: array
      items:
        $ref: '#/definitions/Column'
  404:
    description: No matching element found, no columns exist in the elastic search instance (in that table in that database)
tags:
  - get_database_table_columns_endpoint