summary: Return a detailed information about a specific identifier in the elastic search instance
description: |
    Return a detailed information about a specific identifier in the elastic search instance
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: "path"
    type: "integer"
    name: "identifier_id"
    description: "The ID of the identifier to retrieve further information about"
    required: true
definitions:
  Identifier:
    type: object
    properties:
      id:
        type: integer
        description: The id of the identifier
      name:
        type: string
        description: The name of the identifier
      description:
        type: string
        description: The description of the identifier
      type:
        type: string
        description: The type of object the identifier refers to
      visibility:
        type: string
        description: The visibility of the identifier
      publisher:
        type: string
        description: The publisher of the identifier
      publication_date:
        type: object
        description: The publication date of the identifier
        properties:
          year:
            type: integer
            description: The year of the publication date
          month:
            type: integer
            description: The month of the publication date
          day:
            type: integer
            description: The day of the publication date
responses:
  200:
    description: OK, contains the detailed information about the identifier
    schema:
      $ref: "#/definitions/Identifier"
  404:
    description: No identifier with such ID exists in the elastic search instance
tags:
  - get_identifier_endpoint