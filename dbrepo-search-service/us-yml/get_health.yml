summary: Return a healthcheck
description: |
    Return UP if the instance is ready to serve connections.
consumes:
  - application/json
produces:
  - application/json
parameters: []
definitions:
  Health:
    type: object
    properties:
      status:
        type: string
        description: UP
responses:
  200:
    description: OK, service is up and running
    schema:
      $ref: "#/definitions/Column"
  404:
    description: Service is not yet ready
tags:
  - actuator