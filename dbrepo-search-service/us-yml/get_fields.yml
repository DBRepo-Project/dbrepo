tags:
  - search-endpoint
summary: Get searchable fields
operationId: get_fields
parameters:
  - in: path
    name: type
    schema:
      type: string
      enum: [ database, table, view, column, user, identifier, concept, unit ]
    required: true
    description: The search type.
responses:
  "200":
    description: "List of fields"
    content:
      application/json:
        schema:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  attr_name:
                    type: "string"
                    example: "name"
                  attr_friendly_name:
                    type: "string"
                    example: "Name"
                  type:
                    type: "string"
                    example: "string"
                    description: OpenSearch data types.
  "404":
    description: Invalid type.
