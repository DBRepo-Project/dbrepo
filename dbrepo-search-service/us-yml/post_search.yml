summary: Return all tables, databases, columns, users and identifiers in the elastic search instance
description: |
  Return all tables, databases, columns, users and identifiers in the elastic search instance
consumes:
  - application/json
produces:
  - application/json
definitions:
  Table:
    type: object
    properties:
      id:
        type: integer
        description: The id of the table
      name:
        type: string
        description: The name of the table
      description:
        type: string
        description: The description of the table
      database_id:
        type: integer
        description: The id of the database the table belongs to
  Column:
    type: object
    properties:
      id:
        type: integer
        description: The id of the column
      name:
        type: string
        description: The name of the column
      column_type:
        type: string
        description: The type of the column
  Database:
    type: object
    properties:
      id:
        type: integer
        description: The id of the database
      name:
        type: string
        description: The name of the database
      public:
        type: boolean
        description: The public status of the database
  Identifier:
    type: object
    properties:
      id:
        type: integer
        description: The id of the identifier
      name:
        type: string
        description: The name of the identifier
      type:
        type: string
        description: The type of object the identifier refers to
  User:
    type: object
    properties:
      id:
        type: integer
        description: The id of the user
      username:
        type: string
        description: The username of the user
responses:
  200:
    description: OK, contains the elements formatted as an array of JSON arrays
    schema:
      type: array
      items:
        type: array
        items:
          oneOf:
            - $ref: '#/definitions/Table'
            - $ref: '#/definitions/Column'
            - $ref: '#/definitions/Database'
            - $ref: '#/definitions/Identifier'
            - $ref: '#/definitions/User'
tags:
  - search_endpoint