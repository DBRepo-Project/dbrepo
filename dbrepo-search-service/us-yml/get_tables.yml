summary: Return a short information about all tables in the elastic search instance
description: |
  Return a short information about all tables in the elastic search instance
consumes:
  - application/json
produces:
  - application/json
definitions:
  Table:
    type: object
    properties:
      id:
        type: integer
        description: The id of the table
      name:
        type: string
        description: The name of the table
      description:
        type: string
        description: The description of the table
      database_id:
        type: integer
        description: The id of the database the table belongs to
responses:
  200:
    description: OK, contains the elements formatted as a JSON array
    schema:
      type: array
      items:
        $ref: '#/definitions/Table'
  404:
    description: No matching element found, no tables exist in the elastic search instance
tags:
  - get_tables_endpoint