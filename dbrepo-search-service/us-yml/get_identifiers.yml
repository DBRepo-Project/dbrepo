summary: Return a short information about all identifiers in the elastic search instance
description: |
  Return a short information about all identifiers in the elastic search instance
consumes:
  - application/json
produces:
  - application/json
definitions:
  Identifier:
    type: object
    properties:
      id:
        type: integer
        description: The id of the identifier
      name:
        type: string
        description: The name of the identifier
      type:
        type: string
        description: The type of object the identifier refers to
responses:
  200:
    description: OK, contains the elements formatted as a JSON array
    schema:
      type: array
      items:
        $ref: '#/definitions/Identifier'
  404:
    description: No matching element found, no identifiers exist in the elastic search instance
tags:
  - get_identifiers_endpoint