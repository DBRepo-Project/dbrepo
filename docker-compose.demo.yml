# INFO: This compose file deploys the official Docker images from a stable, tested master branch
# MODIFIED: 2022-10-19
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  search-service-data:
  broker-service-data:
  prometheus-data:

networks:
  core:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  userdb:
    name: userdb
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  public:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

services:

  metadata-db:
    restart: on-failure
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    image: dbrepo/metadata-db:1.1
    networks:
      core:
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    logging:
      driver: json-file

  discovery-service:
    restart: on-failure
    container_name: dbrepo-discovery-service
    hostname: discovery-service
    image: dbrepo/discovery-service:1.1
    networks:
      core:
    ports:
      - "9090:9090"
    env_file:
      - .env
    logging:
      driver: json-file

  gateway-service:
    restart: on-failure
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: dbrepo/gateway-service:1.1
    networks:
      core:
    ports:
      - "9095:9095"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  database-service:
    restart: on-failure
    container_name: dbrepo-database-service
    hostname: database-service
    image: dbrepo/database-service:1.1
    networks:
      userdb:
      core:
    ports:
      - "9092:9092"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      container-service:
        condition: service_healthy
      broker-service:
        condition: service_started
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  container-service:
    restart: on-failure
    container_name: dbrepo-container-service
    hostname: container-service
    image: dbrepo/container-service:1.1
    networks:
      core:
    ports:
      - "9091:9091"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  authentication-service:
    restart: on-failure
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: dbrepo/authentication-service:1.1
    networks:
      core:
    ports:
      - "9097:9097"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
      broker-service:
        condition: service_started
      metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  query-service:
    restart: on-failure
    container_name: dbrepo-query-service
    hostname: query-service
    image: dbrepo/query-service:1.1
    networks:
      core:
      userdb:
    ports:
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      table-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  table-service:
    restart: on-failure
    container_name: dbrepo-table-service
    hostname: table-service
    image: dbrepo/table-service:1.1
    networks:
      core:
      userdb:
    ports:
      - "9094:9094"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      authentication-service:
        condition: service_healthy
      search-service:
        condition: service_started
      broker-service:
        condition: service_started
    logging:
      driver: json-file

  identifier-service:
    restart: on-failure
    container_name: dbrepo-identifier-service
    hostname: identifier-service
    image: dbrepo/identifier-service:1.1
    networks:
      core:
    ports:
      - "9096:9096"
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      query-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  analyse-service:
    restart: on-failure
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    image: dbrepo/analyse-service:1.1
    networks:
      core:
      userdb:
    command: sh -c "/wait && flask run" # docker-compose should not test the implementation
    ports:
      - "5000:5000"
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  units-service:
    restart: on-failure
    container_name: dbrepo-units-service
    hostname: units-service
    image: dbrepo/units-service:1.1
    networks:
      core:
    ports:
      - "5010:5010"
    volumes:
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  broker-service:
    restart: on-failure
    container_name: dbrepo-broker-service
    hostname: broker-service
    image: dbrepo/broker-service:1.1
    networks:
      core:
    ports:
      - "5672:5672"
      - "9098:9098"
      - "15672:15672"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: json-file

  search-service:
    restart: always
    container_name: dbrepo-search-service
    hostname: search-service
    image: elasticsearch:7.13.4
    command: [ "elasticsearch" ]
    networks:
      core:
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - logger.level=WARN
    depends_on:
      discovery-service:
        condition: service_healthy
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - search-service-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  ui:
    restart: on-failure
    container_name: dbrepo-ui
    hostname: ui
    image: dbrepo/ui:1.1
    networks:
      core:
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
      - /logos:/app/static/logos
    depends_on:
      identifier-service:
        condition: service_healthy
      database-service:
        condition: service_healthy
    environment:
      SANDBOX: 1
    logging:
      driver: json-file

  ui-proxy:
    restart: on-failure
    container_name: dbrepo-ui-proxy
    hostname: dbrepo-ui-proxy
    image: nginx:alpine
    networks:
      public:
      core:
    volumes:
      - ./fda-ui-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/dbrepo.ossdip.at/fullchain.pem:/etc/nginx/fullchain.pem:ro
      - /etc/letsencrypt/live/dbrepo.ossdip.at/privkey.pem:/etc/nginx/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      ui:
        condition: service_started
    logging:
      driver: json-file

  prometheus:
    image: prom/prometheus:v2.39.1
    restart: on-failure
    container_name: tuw-prometheus
    hostname: prometheus
    networks:
      public:
      core:
    env_file:
      - .env
    ports:
      - "4200:9090"
    volumes:
      - prometheus-data:/etc/prometheus
      - ./fda-prometheus/prometheus.yml:/etc/prometheus/prometheus.yml