tags:
  - analyse-endpoint
summary: Determine statistics
operationId: determinestat
requestBody:
  content:
    application/json:
      schema:
        required:
          - database_id
          - table_id
        type: object
        properties:
          database_id:
            type: "integer"
            example: 1
          table_id:
            type: "integer"
            example: 1
responses:
  "200":
    description: Determined statistics
    content:
      application/json:
        schema:
          required:
            - message
            - status
          type: object
          properties:
            message:
              type: "string"
              example: "Analysed statistical properties"
            status:
              type: "integer"
              example: "200"
  400:
    description: "Invalid input"
    ontent:
      application/json:
        schema:
          required:
            - message
            - status
          type: object
          properties:
            message:
              type: "string"
              example: "Analysed statistical properties"
            status:
              type: "integer"
              example: "200"
