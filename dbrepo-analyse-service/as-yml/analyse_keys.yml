tags:
  - analyse-endpoint
summary: "Determine primary keys"
operationId: analyse_keys
description: "This is a simple API which returns the primary keys + ranking of a (path) csv file"
consumes:
  - "application/json"
produces:
  - "application/json"
parameters:
  - name: filename
    in: query
    required: true
    example: filename_s3_key
    schema:
      type: string
  - name: separator
    in: query
    required: true
    example: ","
    schema:
      type: string
responses:
  202:
    description: Determined keys successfully
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeysDto'
  400:
    description: "Failed to determine keys"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorDto'
  404:
    description: "Failed to find file in Storage Service or is empty"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorDto'
  500:
    description: "Unexpected system error"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorDto'
components:
  schemas:
    KeysDto:
      required:
        - keys
      type: object
      properties:
        keys:
          type: array
          items:
            properties:
              column_name:
                type: integer
                format: int64
    DataTypesDto:
      type: object
      properties:
        columns:
          $ref: '#/components/schemas/SuggestedColumnDto'
        line_termination:
          type: string
          example: "\r\n"
        separator:
          type: string
          example: ","
    SuggestedColumnDto:
      type: object
      properties:
        column_name:
          type: string
    ErrorDto:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Message