tags:
  - analyse-endpoint
summary: "Determine datatypes"
description: "This is a simple API which returns the datatypes of a (path) csv file"
consumes:
  - "application/json"
produces:
  - "application/json"
parameters:
  - in: "body"
    name: "body"
    description: "to-do description"
    required: true
    schema:
      type: "object"
      $ref: '#/components/schemas/DetermineDataTypesDto'
responses:
  200:
    description: Determined data types successfully
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/DataTypesDto'
  405:
    description: "Invalid input"
components:
  schemas:
    DetermineDataTypesDto:
      type: object
      properties:
        enum:
          type: boolean
          example: false
        enum_tol:
          type: double
          example: 0.01
        filename:
          type: string
          example: s3-key-from-seaweedfs
        separator:
          type: string
          example: ","
    DataTypesDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedColumnDto'
        line_termination:
          type: string
          example: "\r\n"
        separator:
          type: string
          example: ","
    SuggestedColumnDto:
      type: object
      properties:
        column_name:
          type: string