tags:
  - analyse-endpoint
summary: Determine table statistics
operationId: analyse_table_stat
parameters:
  - name: database_id
    in: path
    required: true
    example: 1
    schema:
      type: integer
      format: int64
  - name: table_id
    in: path
    required: true
    example: 1
    schema:
      type: integer
      format: int64
security:
  - bearerAuth: [ ]
  - basicAuth: [ ]
responses:
  202:
    description: Determined statistics
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/TableStats'
  400:
    description: "Missing parameters"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorDto'
  404:
    description: "Table not found"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorDto'
