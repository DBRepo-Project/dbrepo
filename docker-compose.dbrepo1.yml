# INFO: This compose file deploys the official Docker images from a stable, tested master branch
# MODIFIED: 2022-10-31
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  search-service-data:
  broker-service-data:

networks:
  public:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  userdb:
    name: userdb
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  core:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

services:

  metadata-db:
    restart: on-failure
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    image: dbrepo/metadata-db:1.2
    networks:
      core:
    volumes:
      - metadata-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    env_file:
      - .env
    logging:
      driver: json-file

  discovery-service:
    restart: on-failure
    container_name: dbrepo-discovery-service
    hostname: discovery-service
    image: dbrepo/discovery-service:1.2
    networks:
      core:
    env_file:
      - .env
    logging:
      driver: json-file

  gateway-service:
    restart: on-failure
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: dbrepo/gateway-service:1.2
    networks:
      core:
    ports:
      - "9095:9095"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  database-service:
    restart: on-failure
    container_name: dbrepo-database-service
    hostname: database-service
    image: dbrepo/database-service:1.2
    networks:
      userdb:
      core:
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      container-service:
        condition: service_healthy
      broker-service:
        condition: service_started
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  container-service:
    restart: on-failure
    container_name: dbrepo-container-service
    hostname: container-service
    image: dbrepo/container-service:1.2
    networks:
      core:
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  authentication-service:
    restart: on-failure
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: dbrepo/authentication-service:1.2
    networks:
      core:
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
      broker-service:
        condition: service_started
      metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  query-service:
    restart: on-failure
    container_name: dbrepo-query-service
    hostname: query-service
    image: dbrepo/query-service:1.2
    networks:
      core:
      userdb:
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      table-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  table-service:
    restart: on-failure
    container_name: dbrepo-table-service
    hostname: table-service
    image: dbrepo/table-service:1.2
    networks:
      core:
      userdb:
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      authentication-service:
        condition: service_healthy
      search-service:
        condition: service_started
      broker-service:
        condition: service_started
    logging:
      driver: json-file

  identifier-service:
    restart: on-failure
    container_name: dbrepo-identifier-service
    hostname: identifier-service
    image: dbrepo/identifier-service:1.2
    networks:
      core:
    env_file:
      - .env
    depends_on:
      query-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    logging:
      driver: json-file

  fda-metadata-service:
    restart: on-failure
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    image: dbrepo/metadata-service:1.2
    networks:
      core:
    env_file:
      - .env
    depends_on:
      metadata-db:
        condition: service_started
    logging:
      driver: json-file

  analyse-service:
    restart: on-failure
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    image: dbrepo/analyse-service:1.2
    networks:
      core:
      userdb:
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  semantics-service:
    restart: on-failure
    container_name: dbrepo-semantics-service
    hostname: semantics-service
    image: dbrepo/semantics-service:1.2
    networks:
      core:
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      discovery-service:
        condition: service_healthy
      metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  broker-service:
    restart: on-failure
    container_name: dbrepo-broker-service
    hostname: broker-service
    image: dbrepo/broker-service:1.2
    networks:
      core:
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: json-file

  search-service:
    restart: always
    container_name: dbrepo-search-service
    hostname: search-service
    image: elasticsearch:7.13.4
    command: [ "elasticsearch" ]
    networks:
      core:
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - logger.level=WARN
    depends_on:
      discovery-service:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - search-service-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  ui:
    restart: on-failure
    container_name: dbrepo-ui
    hostname: ui
    image: dbrepo/ui:1.2
    networks:
      core:
      public:
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      identifier-service:
        condition: service_healthy
      database-service:
        condition: service_healthy
    logging:
      driver: json-file
