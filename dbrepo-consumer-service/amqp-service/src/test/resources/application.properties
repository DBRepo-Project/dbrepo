# profiles
spring.profiles.active=test
# disable discovery
spring.cloud.discovery.enabled=false
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
# redis settings (when explicitly enabled)
spring.data.redis.host=localhost
# disable cloud config and config discovery
spring.cloud.config.discovery.enabled=false
spring.cloud.config.enabled=false
# log
logging.level.at.ac.tuwien.ifs.dbrepo.=trace