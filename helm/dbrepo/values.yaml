## @section Metric Service

metricdb:
  ## @param metricdb.enabled Enable the Metric Service.
  enabled: true
  ## @skip metricdb.fullnameOverride
  fullnameOverride: metric-db
  ## @param metricdb.endpoint The endpoint for microservices.
  endpoint: http://metric-db-server
  alertmanager:
    ## @skip metricdb.alertmanager.enabled
    enabled: false
  server:
    rbac:
      ## @skip metricdb.server.rbac.create
      create: false
    updateStrategy:
      ## @skip metricdb.server.updateStrategy.type
      type: Recreate
    service:
      ## @skip metricdb.server.service.type
      type: ClusterIP
    persistence:
      ## @skip metricdb.server.persistence.enabled
      enabled: true
    ## @skip metricdb.server.extraScrapeConfigs
    extraScrapeConfigs:
      - job_name: 'actuator scrape'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - data-service
              - metadata-service
      - job_name: 'metrics scrape'
        metrics_path: '/metrics'
        static_configs:
          - targets:
              - analyse-service
              - auth-service-metrics:9000
              - broker-service:9419
              - dashboard-db-metrics:9187
              - dashboard-service
              - data-db-metrics:9104
              - metadata-db-metrics:9104
              - search-service
              - storage-service-master-metrics:9327
              - ui:3000
      - job_name: 'realm scrape'
        metrics_path: '/realms/dbrepo/metrics'
        static_configs:
          - targets:
              - auth-service-metrics:8080

## @section Gateway Service

gatewayservice:
  ## @param gatewayservice.enabled Enable the Gateway Service.
  enabled: true
  ## @skip gatewayservice.fullnameOverride
  fullnameOverride: gateway-service
  service:
    ## @param gatewayservice.service.type The service type.
    type: ClusterIP
  metrics:
    ## @param gatewayservice.metrics.enabled Enable the Prometheus metrics sidecar.
    enabled: false
  ## @param gatewayservice.existingServerBlockConfigmap The extra configuration for the reverse proxy
  existingServerBlockConfigmap: gateway-service-setup
  ## @skip gatewayservice.sidecars
  sidecars:
    - name: logging-agent
      image: docker.io/bitnami/fluent-bit:4.0.0
