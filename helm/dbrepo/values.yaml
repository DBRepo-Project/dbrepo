## @section Broker Service

brokerservice:
  ## @param brokerservice.enabled Enable the Broker Service.
  enabled: true
  ## @skip brokerservice.fullnameOverride
  fullnameOverride: broker-service
  image:
    ## @skip brokerservice.image.repository
    repository: bitnamilegacy/rabbitmq
  metrics:
    ## @skip brokerservice.metrics.enabled
    enabled: true
  ## @param brokerservice.endpoint The management api endpoint for the microservices.
  endpoint: http://broker-service:15672
  ## @param brokerservice.host The hostname for the microservices.
  host: broker-service
  ## @param brokerservice.port The port for the microservices.
  port: 5672
  ## @param brokerservice.virtualHost The default virtual host name.
  virtualHost: dbrepo
  ## @param brokerservice.queueName The default queue name.
  queueName: dbrepo
  ## @param brokerservice.exchangeName The default exchange name.
  exchangeName: dbrepo
  ## @param brokerservice.routingKey The default routing key binding from the default queue to the default exchange.
  routingKey: dbrepo.#
  ## @param brokerservice.connectionTimeout The connection timeout in ms.
  connectionTimeout: 60000
  ldap:
    ## @skip brokerservice.ldap.enabled
    enabled: true
    ## @skip brokerservice.ldap.authorisationEnabled
    authorisationEnabled: true
    ## @skip brokerservice.ldap.servers
    servers:
      - identity-service
    ## @skip brokerservice.ldap.port
    port: 1389
    ## @param brokerservice.ldap.binddn The domain name the broker service should bind to. In many cases this is the admin user from `identityservice.global.adminUser`.
    binddn: cn=admin,dc=dbrepo,dc=at
    ## @param brokerservice.ldap.bindpw The password to bind on the identity service. In many cases this value is equal to `identityservice.global.adminPassword`.
    bindpw: admin
    ## @param brokerservice.ldap.uidField The field containing the user id.
    uidField: uid
    ## @param brokerservice.ldap.basedn The base domain name containing the users.
    basedn: dc=dbrepo,dc=at
    ## @param brokerservice.ldap.userDnPattern The pattern to determine the user.
    userDnPattern: ${username}
  auth:
    ## @skip brokerservice.auth.username
    username: admin
    ## @skip brokerservice.auth.password
    password: admin
    ## @param brokerservice.auth.passwordHash
    ## ref https://www.rabbitmq.com/docs/passwords
    passwordHash: iKGI3TYZWTFemooqE1zwAu/fkbUB9AgVSiFGt3iwDZRNPpZc
    tls:
      ## @param brokerservice.auth.tls.enabled Enable TLS support
      enabled: false
      ## @param brokerservice.auth.tls.existingSecretFullChain If set to `true` the service uses the full chain in the certificate `tls.crt`, otherwise it attempts to read from `ca.crt`
      existingSecretFullChain: false
      ## @param brokerservice.auth.tls.existingSecret Existing secret with certificate content
      existingSecret: ingress-cert
  rbac:
    ## @skip brokerservice.rbac.create
    create: true
  ## @skip brokerservice.advancedConfigurationExistingSecret
  advancedConfigurationExistingSecret: broker-service-secret
  ## @skip brokerservice.loadDefinition
  loadDefinition:
    enabled: true
    existingSecret: broker-service-secret
  ## @param brokerservice.extraPlugins The list of plugins to be activated.
  extraPlugins: rabbitmq_prometheus rabbitmq_auth_backend_ldap rabbitmq_auth_mechanism_ssl rabbitmq_mqtt
  ## @skip brokerservice.extraContainerPorts The list of extra container ports to be exposed
  extraContainerPorts:
    - name: mqtt
      containerPort: 1883
  service:
    ## @skip brokerservice.service.extraPorts
    extraPorts:
      - name: mqtt
        port: 1883
        targetPort: 1883
    # loadBalancerIP:
  ## @skip brokerservice.logs
  logs: ""
  ## @param brokerservice.extraConfiguration The extra configuration for MQTT
  extraConfiguration: |
    # user
    default_vhost = dbrepo
    log.connection.level = warning
    # https://www.rabbitmq.com/docs/logging#log-message-categories
    log.console = true
    log.console.level = debug
    log.file = /opt/bitnami/rabbitmq/var/log/rabbitmq/app.log
    log.file.formatter = json
    log.file.level = info
    log.file.rotation.size = 10485760
    log.file.rotation.count = 5
    mqtt.vhost = dbrepo
    mqtt.exchange = dbrepo
    mqtt.prefetch = 10
  ## @skip brokerservice.resources
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ## @param brokerservice.replicaCount The number of replicas.
  replicaCount: 3

## @section Consumer Service

consumerservice:
  ## @param consumerservice.enabled Enable the Broker Service.
  enabled: true
  image:
    ## @skip consumerservice.image.name
    name: ghcr.io/dbrepo-project/dbrepo/consumer-service:1.14.1
  ## @param consumerservice.podAnnotations the pod annotations. Evaluated as a template
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: { }
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  podSecurityContext:
    ## @param consumerservice.podSecurityContext.enabled Enable pods' Security Context
    enabled: true
    ## @param consumerservice.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
    fsGroupChangePolicy: Always
    ## @param consumerservice.podSecurityContext.sysctls Set kernel settings using the sysctl interface
    sysctls: [ ]
    ## @param consumerservice.podSecurityContext.supplementalGroups Set filesystem extra groups
    supplementalGroups: [ ]
    ## @param consumerservice.podSecurityContext.fsGroup Set RabbitMQ pod's Security Context fsGroup
    fsGroup: 1001
  containerSecurityContext:
    ## @param consumerservice.containerSecurityContext.enabled Enable containers' Security Context
    enabled: true
    ## @param consumerservice.containerSecurityContext.seLinuxOptions Set SELinux options in container
    seLinuxOptions: { }
    ## @param consumerservice.containerSecurityContext.runAsUser Set RabbitMQ containers' Security Context runAsUser
    runAsUser: 1001
    ## @param consumerservice.containerSecurityContext.runAsGroup Set RabbitMQ containers' Security Context runAsGroup
    runAsGroup: 1001
    ## @param consumerservice.containerSecurityContext.runAsNonRoot Set RabbitMQ container's Security Context runAsNonRoot
    runAsNonRoot: true
    ## @param consumerservice.containerSecurityContext.allowPrivilegeEscalation Set container's privilege escalation
    allowPrivilegeEscalation: false
    ## @param consumerservice.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
    readOnlyRootFilesystem: false
    capabilities:
      ## @param consumerservice.containerSecurityContext.capabilities.drop Set container's Security Context runAsNonRoot
      drop: [ "ALL" ]
    seccompProfile:
      ## @param consumerservice.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
      type: "RuntimeDefault"
  ## @param consumerservice.resourcesPreset The container resource preset
  resourcesPreset: "small"
  ## @param consumerservice.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
  resources: { }
  ##   requests:
  ##     cpu: 250m
  ##     memory: 64Mi
  ##   limits:
  ##     cpu: 500m
  ##     memory: 1024Mi
  ## @param consumerservice.replicaCount The number of replicas.
  replicaCount: 2

