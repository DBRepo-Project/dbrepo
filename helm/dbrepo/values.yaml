      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: false
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seLinuxOptions: { }
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: logging-config
          mountPath: /opt/bitnami/fluent-bit/conf/fluent-bit.conf
          subPath: fluent-bit.conf
        - name: empty-dir
          mountPath: /var/log/nginx/
      livenessProbe:
        httpGet:
          port: 2021
        initialDelaySeconds: 150
        periodSeconds: 10
      readinessProbe:
        httpGet:
          port: 2021
        initialDelaySeconds: 30
        periodSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 50Mi
        limits:
          cpu: 150m
          memory: 192Mi
          ephemeral-storage: 2Gi
  ## @skip gatewayservice.extraVolumes
  extraVolumes:
    - name: logging-config
      configMap:
        name: gateway-service-config
  ## @skip gatewayservice.extraVolumeMounts
  extraVolumeMounts:
    - name: empty-dir
      mountPath: /var/log/nginx
  ## @param gatewayservice.replicaCount The number of replicas.
  replicaCount: 3

