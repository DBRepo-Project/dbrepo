  ##     cpu: 250m
  ##     memory: 64Mi
  ##   limits:
  ##     cpu: 500m
  ##     memory: 1024Mi
  ## @param identityservice.users The admin username for internal authentication.
  users: admin
  ## @param identityservice.userPasswords The admin user password for internal authentication.
  userPasswords: admin
