## @section Global parameters

global:
  ## Compatibility adaptations for Kubernetes platforms
  compatibility:
    ##  Compatibility adaptations for Openshift
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
      adaptSecurityContext: auto
  security:
    ## @param global.security.allowInsecureImages Allows skipping image verification, needed for bitnamilegacy
    allowInsecureImages: true
  ## @param global.storageClass Global StorageClass for Persistent Volume(s)
  storageClass: ""

## @section Common parameters

## @param hostname The hostname.
hostname: example.com
## @param strategyType The image pull
strategyType: RollingUpdate
## @param clusterDomain The cluster domain.
clusterDomain: cluster.local
## @param username The internal system username. This user is only used between the microservices and does not exist on paper.
username: admin
## @param password The internal system password. This user is only used between the microservices and does not exist on paper.
password: admin

## @section Metadata Database

metadatadb:
  ## @param metadatadb.enabled Enable the Metadata Database.
  enabled: true
  ## @param metadatadb.host The hostname for the microservices.
  host: metadata-db
  rootUser:
    ## @param metadatadb.rootUser.user The root username.
    user: root
    ## @param metadatadb.rootUser.password The root user password.
    password: dbrepo
  db:
    ## @param metadatadb.db.name The database name.
    name: dbrepo
  replication:
    ## @param metadatadb.replication.password The replication password
    password: backup
  ## @param metadatadb.jdbcExtraArgs The extra arguments for JDBC connections in the microservices.
  jdbcExtraArgs: ""
  metrics:
    image:
      ## @skip metadatadb.metrics.image.repository
      repository: bitnamilegacy/mysqld-exporter
    ## @skip metadatadb.metrics.enabled The Prometheus settings.
    enabled: true
  ## @param metadatadb.resourcesPreset The container resource preset
  resourcesPreset: "xlarge"
  persistence:
    ## @param metadatadb.persistence.enabled Enable persistent storage.
    enabled: true
    ## @param metadatadb.persistence.size Persistent storage size.
    size: 8Gi
  ## @param metadatadb.replicaCount The number of cluster nodes, should be uneven i.e. 2n+1
  replicaCount: 3

## @section Dashboard Database Enable the Dashboard Database.

dashboarddb:
  ## @param dashboarddb.enabled
  enabled: true
  ## @skip dashboarddb.fullnameOverride
  fullnameOverride: dashboard-db
  image:
    ## @skip dashboarddb.image.repository
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      ## @skip dashboarddb.volumePermissions.image.repository
      repository: bitnamilegacy/os-shell
  ## @param dashboarddb.host The hostname for the microservices.
  host: dashboard-db:5432
  metrics:
    image:
      ## @skip dashboarddb.metrics.image.repository
      repository: bitnamilegacy/postgres-exporter
    ## @skip dashboarddb.metrics.enabled
    enabled: true
  ## @skip dashboarddb.primary
  primary:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
