      secretAccessKey: seaweedfsadmin
    ## @param dataservice.s3.filePath The local location to download/upload files from/to S3-capable endpoint.
    filePath: /s3
  ## @param dataservice.replicaCount The number of replicas.
  replicaCount: 2

