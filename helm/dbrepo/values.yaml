namespace: dbrepo
hostname: example.com
gateway: https://example.com

strategyType: RollingUpdate

clusterDomain: cluster.local

admin:
  username: admin
  password: admin

metadatadb:
  enabled: true
  fullnameOverride: metadata-db
  image:
    debug: false
  host: metadata-db
  rootUser:
    user: root
    password: dbrepo
  jdbcExtraArgs: ""
  db:
    name: fda
  metrics:
    enabled: false
  galera:
    mariabackup:
      user: mariabackup
      password: mariabackup
  initdbScriptsConfigMap: metadata-db-setup
  service:
    type: ClusterIP
    annotations: { }
    loadBalancerIP: ""
    loadBalancerSourceRanges: [ ]
  persistence:
    enabled: true
  replicaCount: 1 # uneven 3,5,7

authservice:
  enabled: true
  fullnameOverride: auth-service
  image:
    debug: false
  endpoint: http://auth-service
  auth:
    adminUser: fda
    adminPassword: fda
  postgresql:
    enabled: false # not needed
  extraStartupArgs: "--import-realm"
  jwt:
    pubkey: ""
  tls:
    enabled: true
    existingSecret: ingress-cert
    usePem: true
  metrics:
    enabled: true
  externalDatabase:
    existingSecret: auth-service-secret
    existingSecretDatabaseKey: db-name
    existingSecretHostKey: db-host
    existingSecretPortKey: db-port
    existingSecretUserKey: db-username
    existingSecretPasswordKey: db-password
  client:
    id: dbrepo-client
    secret: MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG
  extraEnvVarsCM: auth-service-config
  extraVolumes:
    - name: config-map
      configMap:
        name: auth-service-config
  extraVolumeMounts:
    - name: config-map
      mountPath: /opt/bitnami/keycloak/data/import
  replicaCount: 1

authdb:
  enabled: true
  fullnameOverride: auth-db
  host: auth-db-pgpool
  port: 5432
  postgresql:
    postgresPassword: postgres
    username: metrics # implicit requirement for metrics container
    password: metrics # implicit requirement for metrics container
    repmgrPassword: repmgr # implicit requirement for rolling updates
    database: keycloak
    replicaCount: 1
  pgpool:
    adminUsername: admin
    adminPassword: admin
  metrics:
    enabled: true
  service:
    type: ClusterIP
    annotations: { }
    loadBalancerIP: ""
    loadBalancerSourceRanges: [ ]
  persistence:
    enabled: true
    size: 10Gi

datadb:
  enabled: true
  fullnameOverride: data-db
  image:
    debug: false
  extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
  rootUser:
    user: root
    password: dbrepo
  metrics:
    enabled: true
  galera:
    mariabackup:
      user: mariabackup
      password: mariabackup
  service:
    extraPorts:
      - name: "sidecar"
        port: 80
        targetPort: 8080
        protocol: TCP
  sidecars:
    - name: sidecar
      image: s210.dl.hpc.tuwien.ac.at/dbrepo/data-db-sidecar:1.4.3
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      ports:
        - name: "sidecar"
          containerPort: 8080
          protocol: TCP
      envFrom:
        - secretRef:
            name: data-service-secret
      livenessProbe:
        exec:
          command:
            - /bin/bash
            - -ec
            - "curl -sSL localhost:8080/health | grep 'UP' || exit 1"
        initialDelaySeconds: 120
        periodSeconds: 30
      readinessProbe:
        exec:
          command:
            - /bin/bash
            - -ec
            - "curl -sSL localhost:8080/health | grep 'UP' || exit 1"
        initialDelaySeconds: 30
        periodSeconds: 30
      volumeMounts:
        - name: s3
          mountPath: /tmp
  extraVolumeMounts:
    - name: s3
      mountPath: /tmp
  extraVolumes:
    - name: s3
      emptyDir: {}
  s3:
    enabled: true
  replicaCount: 1 # uneven

searchdb:
  enabled: true
  fullnameOverride: search-db
  host: search-db
  port: 9200
  protocol: http
  username: admin
  password: admin
  clusterName: search-db
  masterService: search-db
  replicas: 1
  image:
    debug: false
  sysctlInit:
    enabled: true
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    annotations: { }
    loadBalancerSourceRanges: [ ]
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
  extraVolumeMounts:
    - name: node-cert
      mountPath: /usr/share/opensearch/config/tls
      readOnly: true
  extraVolumes:
    - name: node-cert
      secret:
        secretName: search-db-secret
  config:
    opensearch.yml: |
      cluster.name: search-db
      network.host: 0.0.0.0
      plugins:
        security:
          ssl:
            transport:
              pemcert_filepath: tls/tls.crt
              pemkey_filepath: tls/tls.key
              pemtrustedcas_filepath: tls/ca.crt
              enforce_hostname_verification: false
            http:
              #enabled: true # uncomment to force ssl connections
              pemcert_filepath: tls/tls.crt
              pemkey_filepath: tls/tls.key
              pemtrustedcas_filepath: tls/ca.crt
          allow_unsafe_democertificates: false
          allow_default_init_securityindex: true
          authcz:
            admin_dn:
              - CN=search-db
          nodes_dn:
            - CN=search-db
          audit.type: internal_opensearch
          enable_snapshot_restore_privilege: true
          check_snapshot_restore_write_privileges: true
          restapi:
            roles_enabled: [ "all_access", "security_rest_api_access" ]
          system_indices:
            enabled: true
            indices:
              [
                ".opendistro-alerting-config",
                ".opendistro-alerting-alert*",
                ".opendistro-anomaly-results*",
                ".opendistro-anomaly-detector*",
                ".opendistro-anomaly-checkpoints",
                ".opendistro-anomaly-detection-state",
                ".opendistro-reports-*",
                ".opendistro-notifications-*",
                ".opendistro-notebooks",
                ".opendistro-asynchronous-search-response*",
              ]

uploadservice:
  enabled: true
  fullnameOverride: upload-service
  image:
    repository: tusproject/tusd
    tag: v1.12
  containerArgs:
    - "--base-path=/api/upload/files/"
    - "-s3-endpoint=http://storageservice-s3:9000"
    - "-s3-bucket=dbrepo-upload"
  envFrom:
    - secretRef:
        name: upload-service-secret
  replicaCount: 1

brokerservice:
  enabled: true
  fullnameOverride: broker-service
  image:
    debug: true
  endpoint: http://broker-service:15672
  host: broker-service
  port: 5672
  virtualHost: dbrepo
  queueName: dbrepo
  exchangeName: dbrepo
  routingKey: dbrepo.#
  connectionTimeout: 60000
  auth:
    tls:
      enabled: false
      sslOptionsVerify: true
      failIfNoPeerCert: true
      existingSecret: ingress-cert
    username: broker
    password: broker
  extraConfiguration: |-
    default_vhost = dbrepo
    default_user_tags.administrator = true
    default_permissions.configure = .*
    default_permissions.read = .*
    default_permissions.write = .*
    load_definitions = /app/load_definition.json
    log.console = true
    listeners.tcp.1 = 0.0.0.0:5672
    auth_backends.1 = rabbit_auth_backend_oauth2
    auth_backends.2 = rabbit_auth_backend_internal
    auth_oauth2.resource_server_id = rabbitmq
    auth_oauth2.preferred_username_claims.1 = client_id
    auth_oauth2.default_key = t2OCeCheJ9uwoBbNQjG_nN6WKiLcceTIAZmiTbGODFM
    auth_oauth2.signing_keys.t2OCeCheJ9uwoBbNQjG_nN6WKiLcceTIAZmiTbGODFM = /app/cert.pem
    auth_oauth2.signing_keys.id2 = /app/pubkey.pem
    auth_oauth2.algorithms.1 = HS256
    auth_oauth2.algorithms.2 = RS256
    management.oauth_enabled = true
    management.oauth_client_id = rabbitmq-client
    management.oauth_client_secret = JEC2FexxrX4N65fLeDGukAl6R3Lc9y0u
    management.oauth_scopes = openid
    management.oauth_provider_url = https://example.com/api/auth/realms/dbrepo
  loadDefinition:
    enabled: true
    existingSecret: broker-service-secret
  extraVolumes:
    - name: secret-map
      secret:
        secretName: broker-service-secret
  extraPlugins: rabbitmq_prometheus rabbitmq_auth_backend_oauth2 rabbitmq_auth_mechanism_ssl
  persistence:
    enabled: false
    size: 5Gi
  service:
    type: ClusterIP
    managerPortEnabled: true
    # loadBalancerIP:
  replicaCount: 1

analyseService:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/analyse-service:1.4.3
    pullPolicy: Always
    debug: false
  s3:
    endpoint: http://storageservice-s3:9000
  replicaCount: 1

metadataservice:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/metadata-service:1.4.3
    pullPolicy: Always
    debug: false
  admin:
    email: noreply@example.com
  deletedRecord: permanent
  repositoryName: Database Repository
  granularity: YYYY-MM-DDThh:mm:ssZ
  datacite:
    enabled: false
    url: https://api.datacite.org
    prefix: ""
    username: ""
    password: ""
  sparql:
    connectionTimeout: 10000
  s3:
    endpoint: http://storageservice-s3:9000
    bucket:
      import: dbrepo-upload
      export: dbrepo-download
    auth:
      username: seaweedfsadmin
      password: seaweedfsadmin
  replicaCount: 1

dataservice:
  enabled: true
  endpoint: http://data-service
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/data-service:1.4.3
    pullPolicy: Always
    debug: false
  grant:
    read: SELECT
    write: SELECT, CREATE, CREATE VIEW, CREATE ROUTINE, CREATE TEMPORARY TABLES, LOCK TABLES, INDEX, TRIGGER, INSERT, UPDATE, DELETE
  s3:
    endpoint: http://storageservice-s3:9000
    bucket:
      import: dbrepo-upload
      export: dbrepo-download
    auth:
      username: seaweedfsadmin
      password: seaweedfsadmin
  consumerConcurrentMin: 1
  consumerConcurrentMax: 5
  requeueRejected: false
  replicaCount: 1

searchservice:
  enabled: true
  endpoint: http://search-service
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/search-service:1.4.3
    pullPolicy: Always
    debug: false
  init:
    image:
      name: s210.dl.hpc.tuwien.ac.at/dbrepo/search-service-init:1.4.3
      pullPolicy: Always
  replicaCount: 1

storageservice:
  enabled: true
  master:
    enabled: true
  filer:
    enabled: true
    replicas: 1
    enablePVC: false
    storage: 25Gi
    s3:
      enabled: true
      allowEmptyFolder: true
      port: 9000
      enableAuth: true
      skipAuthSecretCreation: true
      existingConfigSecret: seaweedfs-s3-secret
  volume:
    enabled: true
    replicas: 1
  s3:
    enabled: true
    replicas: 2
    port: 9000
    metricsPort: 9091
    enableAuth: true
    skipAuthSecretCreation: true
    existingConfigSecret: seaweedfs-s3-secret
    bucket:
      import: dbrepo-upload
      export: dbrepo-download
    auth:
      username: seaweedfsadmin
      password: seaweedfsadmin
  init:
    image: s210.dl.hpc.tuwien.ac.at/dbrepo/storage-service-init:1.4.3
    pullPolicy: Always

ui:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/ui:1.4.3
    pullPolicy: Always
    debug: false
  public:
    api:
      client: ""
      server: ""
    title: "Database Repository"
    logo: "/logo.svg"
    icon: "/favicon.ico"
    touch: "/apple-touch-icon.png"
    broker:
      host: example.com
      port:
        5671: true
        5672: false
      extra: "128.130.0.0/15"
    database:
      extra: "128.130.0.0/15"
    links:
      rabbitmq:
        text: RabbitMQ Admin
        href: /api/broker/
      keycloak:
        text: Keycloak Admin
        href: /api/auth/
    pid:
      default:
        publisher: "Example University"
    doi:
      enabled: false
      endpoint: https://doi.org
  replicaCount: 1
  extraVolumes: [ ]
  #  - name: images-map
  #    configMap:
  #      name: ui-config
  extraVolumeMounts: [ ]
  #  - name: images-map
  #    mountPath: /static/logo.svg
  #    subPath: logo.svg

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: ingress-cert
  annotations:
    basic: {}
#      nginx.org/path-regex: "case_sensitive"
#      nginx.ingress.kubernetes.io/use-regex: "true"
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
    rewriteApi:
#      nginx.org/path-regex: "case_sensitive"
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /api/$1
    rewriteRoot:
#      nginx.org/path-regex: "case_sensitive"
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$1
    rewriteRootSecure:
#      nginx.org/path-regex: "case_sensitive"
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$1
    rewritePid:
#      nginx.org/path-regex: "case_sensitive"
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /api/identifier/$1
