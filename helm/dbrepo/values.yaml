## @section Upload Service

uploadservice:
  ## @param uploadservice.enabled Enable the Upload Service.
  enabled: true
  ## @skip uploadservice.image
  image:
    name: docker.io/tusproject/tusd:v1.12
  s3:
    ## @param uploadservice.s3.endpoint The S3-capable endpoint the microservice connects to.
    endpoint: http://storage-service-s3:8333
    ## @param uploadservice.s3.bucket The S3 bucket name.
    bucket: dbrepo
    ## @param uploadservice.s3.maxSize The maximum file size in bytes.
    maxSize: "2000000000"
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  podSecurityContext:
    ## @param uploadservice.podSecurityContext.enabled Enable pods' Security Context
    enabled: true
    ## @param uploadservice.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
    fsGroupChangePolicy: Always
    ## @param uploadservice.podSecurityContext.sysctls Set kernel settings using the sysctl interface
    sysctls: [ ]
    ## @param uploadservice.podSecurityContext.supplementalGroups Set filesystem extra groups
    supplementalGroups: [ ]
    ## @param uploadservice.podSecurityContext.fsGroup Set RabbitMQ pod's Security Context fsGroup
    fsGroup: 0
  containerSecurityContext:
    ## @param uploadservice.containerSecurityContext.enabled Enable containers' Security Context
    enabled: true
    ## @param uploadservice.containerSecurityContext.seLinuxOptions Set SELinux options in container
    seLinuxOptions: { }
    ## @param uploadservice.containerSecurityContext.runAsUser Set RabbitMQ containers' Security Context runAsUser
    runAsUser: 1000
    ## @param uploadservice.containerSecurityContext.runAsGroup Set RabbitMQ containers' Security Context runAsGroup
    runAsGroup: 1000
    ## @param uploadservice.containerSecurityContext.runAsNonRoot Set RabbitMQ container's Security Context runAsNonRoot
    runAsNonRoot: true
    ## @param uploadservice.containerSecurityContext.allowPrivilegeEscalation Set container's privilege escalation
    allowPrivilegeEscalation: false
    ## @param uploadservice.containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
    readOnlyRootFilesystem: false
    capabilities:
      ## @param uploadservice.containerSecurityContext.capabilities.drop Set container's Security Context runAsNonRoot
      drop: [ "ALL" ]
    seccompProfile:
      ## @param uploadservice.containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
      type: "RuntimeDefault"
  ## @param uploadservice.resourcesPreset The container resource preset
  resourcesPreset: "nano"
  ## @param uploadservice.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
  resources: { }
  ##   requests:
  ##     cpu: 250m
  ##     memory: 64Mi
  ##   limits:
  ##     cpu: 500m
  ##     memory: 1024Mi
  ## @skip uploadservice.containerArgs
  containerArgs:
    - "-behind-proxy"
    - "-max-size=2000000000"
    - "-base-path=/api/upload/files/"
    - "-hooks-dir=/srv/tusd-hooks/"
    - "-s3-endpoint=http://storage-service-s3:8333"
    - "-s3-bucket=dbrepo"
  ## @skip uploadservice.envFrom
  envFrom:
    - secretRef:
        name: upload-service-secret
  ## @skip uploadservice.volumes
  volumes:
    - name: config
      configMap:
        name: upload-service-setup
        defaultMode: 0777
  ## @skip uploadservice.volumeMounts
  volumeMounts:
    - name: config
      mountPath: /srv/tusd-hooks/pre-create
      subPath: pre-create
  ## @param uploadservice.replicaCount The number of replicas.
  replicaCount: 2

## @section Broker Service

brokerservice:
  ## @param brokerservice.enabled Enable the Broker Service.
  enabled: true
  ## @skip brokerservice.fullnameOverride
  fullnameOverride: broker-service
  image:
    ## @param brokerservice.image.debug Set the logging level to `trace`. Otherwise, set to `info`.
    debug: true
  metrics:
    ## @skip brokerservice.metrics.enabled
    enabled: true
  ## @param brokerservice.endpoint The management api endpoint for the microservices.
  endpoint: http://broker-service:15672
  ## @param brokerservice.host The hostname for the microservices.
  host: broker-service
  ## @param brokerservice.port The port for the microservices.
  port: 5672
  ## @param brokerservice.virtualHost The default virtual host name.
  virtualHost: dbrepo
  ## @param brokerservice.queueName The default queue name.
  queueName: dbrepo
  ## @param brokerservice.exchangeName The default exchange name.
  exchangeName: dbrepo
  ## @param brokerservice.routingKey The default routing key binding from the default queue to the default exchange.
  routingKey: dbrepo.#
  ## @param brokerservice.connectionTimeout The connection timeout in ms.
  connectionTimeout: 60000
  ldap:
    ## @skip brokerservice.ldap.enabled
    enabled: true
    ## @skip brokerservice.ldap.authorisationEnabled
    authorisationEnabled: true
    ## @skip brokerservice.ldap.servers
    servers:
      - identity-service
    ## @skip brokerservice.ldap.port
    port: 389
    ## @param brokerservice.ldap.binddn The domain name the broker service should bind to. In many cases this is the admin user from `identityservice.global.adminUser`.
    binddn: cn=admin,dc=dbrepo,dc=at
    ## @param brokerservice.ldap.bindpw The password to bind on the identity service. In many cases this value is equal to `identityservice.global.adminPassword`.
    bindpw: admin
    ## @param brokerservice.ldap.uidField The field containing the user id.
    uidField: uid
    ## @param brokerservice.ldap.basedn The base domain name containing the users.
    basedn: dc=dbrepo,dc=at
    ## @param brokerservice.ldap.userDnPattern The pattern to determine the user.
    userDnPattern: ${username}
  auth:
    tls:
      ## @param brokerservice.auth.tls.enabled Enable TLS support
      enabled: false
      ## @param brokerservice.auth.tls.existingSecretFullChain If set to `true` the service uses the full chain in the certificate `tls.crt`, otherwise it attempts to read from `ca.crt`
      existingSecretFullChain: false
      ## @param brokerservice.auth.tls.existingSecret Existing secret with certificate content
      existingSecret: ingress-cert
  rbac:
    ## @skip brokerservice.rbac.create
    create: false
  ## @skip brokerservice.advancedConfigurationExistingSecret
  advancedConfigurationExistingSecret: broker-service-secret
  ## @skip brokerservice.loadDefinition
  loadDefinition:
    enabled: true
    existingSecret: broker-service-secret
  ## @param brokerservice.extraPlugins The list of plugins to be activated.
  extraPlugins: rabbitmq_prometheus rabbitmq_auth_backend_ldap rabbitmq_auth_mechanism_ssl rabbitmq_mqtt
  persistence:
    ## @param brokerservice.persistence.enabled If set to true, a PVC will be created.
    enabled: false
  ## @skip brokerservice.service
  service:
    type: ClusterIP
    managerPortEnabled: true
    extraPorts:
      - name: mqtt
        port: 1883
        targetPort: 1883
    # loadBalancerIP:
  ## @param brokerservice.extraConfiguration The extra configuration for MQTT
  extraConfiguration: |
    mqtt.vhost = dbrepo
    mqtt.exchange = dbrepo
    mqtt.prefetch = 10
  ## @param brokerservice.replicaCount The number of replicas.
  replicaCount: 1

