## @section Auth Service

authservice:
  ## @param authservice.enabled Enable the Auth Service.
  enabled: true
  ## @skip authservice.fullnameOverride
  fullnameOverride: auth-service
  image:
    ## @skip authservice.image.registry
    registry: registry.datalab.tuwien.ac.at
    ## @skip authservice.image.repository
    repository: bitnami/keycloak
    ## @skip authservice.image.tag
    tag: 26.4.4
  ## @param authservice.endpoint The hostname for the microservices.
  endpoint: http://auth-service
  ## @skip authservice.extraStartupArgs
  extraStartupArgs: --import-realm
  ## @skip authservice.proxyHeaders
  proxyHeaders: xforwarded
  ## @param authservice.issuerUri Custom issuer URI, if empty a combination of `$hostname/realms/dbrepo` is used.
  issuerUri: ""
  ## @param authservice.jwkUri Custom JWK URI, if empty a combination of `$hostname/realms/dbrepo/protocol/openid-connect/certs` is used.
  jwkUri: ""
  auth:
    ## @skip authservice.auth.adminUser
    adminUser: admin
    ## @skip authservice.auth.adminPassword
    adminPassword: admin
  ## @skip authservice.postgresql
  postgresql:
    enabled: false
  externalDatabase:
    host: auth-db-rw
    port: 5432
    user: keycloak
    database: keycloak
    schema: public
    password: keycloak
    replicaCount: 3
    image: registry.datalab.tuwien.ac.at/dbrepo-nightly/postgresql:17.9-cloudnative-pg-rc.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  jwt:
    ## @param authservice.jwt.pubkey The JWT public key from the `dbrepo-client`.
    pubkey: ""
  metrics:
    ## @skip authservice.metrics.enabled
    enabled: true
  client:
    ## @param authservice.client.id The client id for the microservices.
    id: dbrepo-client
    ## @param authservice.client.secret The client secret for the microservices.
    secret: MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG
  ## @skip authservice.initdbScripts
  keycloakConfigCli:
    image:
      ## @skip authservice.keycloakConfigCli.image.repository
      repository: bitnamilegacy/keycloak-config-cli
    ## @skip authservice.keycloakConfigCli.existingConfigmap
    existingConfigmap: auth-service-config
  ## @skip authservice.extraEnvVarsSecret
  extraEnvVarsSecret: auth-service-secret
  ## @skip authservice.extraVolumes
  extraVolumes:
    - name: import
      configMap:
        name: auth-service-config
    - name: logging
      emptyDir: { }
  ## @skip authservice.extraVolumeMounts
  extraVolumeMounts:
    - name: import
      mountPath: /opt/bitnami/keycloak/data/import
    - name: logging
      mountPath: /var/log/app/service/auth
  ## @skip authservice.replicaCount The number of replicas.
  replicaCount: 1

## @sectionn Cache Database

cachedb:
  ## @param cachedb.enabled Enable the Cache Database.
  enabled: true
  ## @skip cachedb.fullnameOverride
  fullnameOverride: cache-db
  ## @skip cachedb.architecture
  architecture: standalone
  ## @param cachedb.flavor The provider flavor of the Cache Database for Redisson (as Java library)
  ## ref https://redisson.pro/docs/configuration/
  ## one of the following:
  ##   "redis" for Redis connection
  ##   "valkey" for Valkey connection
  ##   "valkeys" for Valkey SSL connection
  ##   "rediss" for Redis SSL connection
  flavor: valkey
  ## @param cachedb.endpoint The endpoint for the microservices
  endpoint: cache-db-primary
  image:
    ## @skip cachedb.image.repository
    repository: bitnamilegacy/valkey
  primary:
    ## @skip cachedb.primary.resources
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 1024Mi
  auth:
    ## @param cachedb.auth.password The Valkey password
    password: valkey

