## @section Auth Service

authservice:
  ## @param authservice.enabled Enable the Auth Service.
  enabled: true
  ## @skip authservice.fullnameOverride
  fullnameOverride: auth-service
  image:
    ## @param authservice.image.debug Set the logging level to `trace`. Otherwise, set to `info`.
    debug: false
  ## @param authservice.endpoint The hostname for the microservices.
  endpoint: http://auth-service
  ## @skip authservice.proxyHeaders
  proxyHeaders: xforwarded
  ## @skip authservice.postgresql
  postgresql:
    enabled: true
    fullnameOverride: auth-db
    auth:
      postgresPassword: postgres
  ## @param authservice.resourcesPreset The container resource presets
  resourcesPreset: "small"
  jwt:
    ## @param authservice.jwt.pubkey The JWT public key from the `dbrepo-client`.
    pubkey: ""
  metrics:
    ## @skip authservice.metrics.enabled
    enabled: true
  client:
    ## @param authservice.client.id The client id for the microservices.
    id: dbrepo-client
    ## @param authservice.client.secret The client secret for the microservices.
    secret: MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG
  ## @skip authservice.initdbScripts
  initdbScripts:
    import-realms.sh: |
      #!/bin/bash
      kc.sh import --file /opt/keycloak/data/import/master-realm.json
      kc.sh import --file /opt/keycloak/data/import/dbrepo-realm.json
  setupJob:
    image:
      ## @skip authservice.setupJob.image.name
      name: registry.datalab.tuwien.ac.at/dbrepo/auth-service-init:1.10.0
    ## @param authservice.setupJob.resourcesPreset The container resource preset
    resourcesPreset: "nano"
    ## @param authservice.setupJob.resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
    resources: { }
    ##   requests:
    ##     cpu: 250m
    ##     memory: 64Mi
    ##   limits:
    ##     cpu: 500m
    ##     memory: 1024Mi
  ## @skip authservice.extraEnvVarsSecret
  extraEnvVarsSecret: auth-service-secret
  ## @skip authservice.extraVolumes
  extraVolumes:
    - name: config
      configMap:
        name: auth-service-config
  ## @skip authservice.extraVolumeMounts
  extraVolumeMounts:
    - name: config
      mountPath: /opt/keycloak/data/import/dbrepo-realm.json
      subPath: dbrepo-realm.json
    - name: config
      mountPath: /opt/keycloak/data/import/master-realm.json
      subPath: master-realm.json
    - name: config
      mountPath: /opt/bitnami/keycloak/providers/create-event-listener.jar
      subPath: create-event-listener.jar
  ## @skip authservice.replicaCount The number of replicas.
  replicaCount: 2

