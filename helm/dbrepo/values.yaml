  ##   "redis" for Redis connection
  ##   "valkey" for Valkey connection
  ##   "valkeys" for Valkey SSL connection
  ##   "rediss" for Redis SSL connection
  flavor: valkey
  ## @param cachedb.endpoint The endpoint for the microservices
  endpoint: cache-db-primary
  ## @param cachedb.port The port for the microservices.
  port: 6379
  image:
    ## @skip cachedb.image.repository
    repository: bitnamilegacy/valkey
  auth:
    ## @param cachedb.auth.password The Valkey password
    password: valkey

