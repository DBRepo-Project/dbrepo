    - name: http
      containerPort: 8080
    - name: https
      containerPort: 8443

## @section Compute Service

computeservice:
  ## @param computeservice.enabled Enable the Compute Service.
  enabled: true
  ## @skip computeservice.fullnameOverride
  fullnameOverride: compute-service
  image:
    ## @skip computeservice.image.repository
    repository: bitnamilegacy/nginx
  ## @param computeservice.extraEnv The extra Nginx environment variable
  extraEnv: ""
  ## @param computeservice.extraEnvValue The extra Nginx environment value
  extraEnvValue: ""
  tls:
    ## @param computeservice.tls.enabled Enable TLS support
    enabled: false
    ## @param computeservice.tls.auto Generated certificates
    auto: false
    ## @param computeservice.tls.existingSecret Existing secret with certificate content
    existingSecret: ingress-cert
  ## @param computeservice.resourcesPreset The container resource preset
  resourcesPreset: "nano"
  ## @param computeservice.serverName The server name for the compute cluster.
  serverName: compute
  ## @param computeservice.replicaCount The number of replicas.
  replicaCount: 2
  ## @skip computeservice.containerPorts
  containerPorts:
    - name: http
      containerPort: 8081
