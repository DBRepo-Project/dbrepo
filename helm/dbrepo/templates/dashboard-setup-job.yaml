{{- if and .Values.dashboardservice.enabled .Values.dashboardservice.setupJob.enabled }}
{{- if not (and .Values.authservice.enabled .Values.dashboardui.enabled) }}
{{- fail "Dashboard setup requires bundled authservice and dashboardui; disable dashboardservice.setupJob.enabled and run documented setup explicitly for external services" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-service-setup-job-{{ .Release.Revision }}
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  backoffLimit: {{ .Values.dashboardservice.setupJob.backoffLimit | default "10" }}
  ttlSecondsAfterFinished: {{ .Values.dashboardservice.setupJob.ttlSecondsAfterFinished | default "100" }}
  template:
    metadata:
      name: auth-service-setup-job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.dashboardservice.setupJob.image.name }}
          imagePullPolicy: {{ .Values.dashboardservice.setupJob.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.dashboardservice.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.dashboardservice.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: AUTH_SERVICE_ADMIN
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: AUTH_SERVICE_ADMIN
            - name: AUTH_SERVICE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: AUTH_SERVICE_ADMIN_PASSWORD
            - name: DASHBOARD_OAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-ui-secret
                  key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
            - name: DASHBOARD_OAUTH_CLIENT_ID
              value: {{ .Values.dashboardui.oauthClientId | quote }}
            - name: DASHBOARD_DATA_ENDPOINT
              value: {{ .Values.dashboardui.dataEndpoint | quote }}
            - name: DASHBOARD_PUBLIC_URL
              value: {{ .Values.dashboardui.serverRootUrl | default (printf "https://%s/dashboard/" .Values.hostname) | quote }}
            - name: DASHBOARD_RESEARCH_ORG_NAME
              value: {{ .Values.dashboardui.researchOrganizationName | quote }}
            - name: DASHBOARD_MONITORING_ORG_NAME
              value: {{ .Values.dashboardui.monitoringOrganizationName | quote }}
            - name: DASHBOARD_MONITORING_ORG_ID
              value: {{ .Values.dashboardui.monitoringOrganizationId | quote }}
            - name: DASHBOARD_METRICS_URL
              value: "http://metric-db-server"
            {{- if .Values.dashboardui.migrationExportSecret }}
            - name: DASHBOARD_MIGRATION_EXPORT
              value: /app/migration/system-dashboards.json
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - secretRef:
                name: dashboard-service-secret
          volumeMounts:
            {{- if .Values.dashboardui.migrationExportSecret }}
            - name: migration-export
              mountPath: /app/migration
              readOnly: true
            {{- end }}
            - name: empty-dir
              mountPath: /var/log/app/service/dashboard
          {{- if .Values.dashboardservice.setupJob.resources }}
          resources: {{- toYaml .Values.dashboardservice.setupJob.resources | nindent 12 }}
          {{- else if ne .Values.dashboardservice.setupJob.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.dashboardservice.setupJob.resourcesPreset) | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.dashboardui.migrationExportSecret }}
        - name: migration-export
          secret:
            secretName: {{ .Values.dashboardui.migrationExportSecret | quote }}
        {{- end }}
        - name: empty-dir
          emptyDir: { }
{{- end }}
