{{- if .Values.metadatadb.enabled }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: metadata-db-appuser-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  username: "{{ .Values.metadatadb.appUser.user }}"
  password: "{{ .Values.metadatadb.appUser.password }}"
{{- end }}
