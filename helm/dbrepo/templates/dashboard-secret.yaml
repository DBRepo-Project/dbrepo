{{- if .Values.dashboardservice.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-service-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  AUTH_SERVICE_ENDPOINT: "{{ .Values.authservice.endpoint }}"
  BASE_URL: "https://{{ .Values.hostname }}"
  DASHBOARD_UI_ENDPOINT: "{{ .Values.dashboardui.endpoint }}"
  DASHBOARD_UI_PASSWORD: "{{ .Values.dashboardui.admin.password }}"
  DASHBOARD_UI_USERNAME: "{{ .Values.dashboardui.admin.user }}"
  {{- if .Values.dashboardservice.image.debug }}
  LOG_APPLICATION_LEVEL: "{{ ternary "DEBUG" "INFO" .Values.dashboardservice.image.debug }}"
  {{- else }}
  LOG_APPLICATION_LEVEL: "INFO"
  {{- end }}
  METADATA_SERVICE_ENDPOINT: "{{ .Values.metadataservice.endpoint }}"
  SYSTEM_USERNAME: "{{ .Values.username }}"
  SYSTEM_PASSWORD: "{{ .Values.password }}"
{{- end }}
