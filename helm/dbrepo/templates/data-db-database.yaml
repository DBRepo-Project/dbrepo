{{- if .Values.datadb.enabled }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: dbrepo
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  name: {{ .Values.datadb.db.name }}
  mariaDbRef:
    name: data-db
  characterSet: utf8
  collate: utf8_general_ci
{{- end }}