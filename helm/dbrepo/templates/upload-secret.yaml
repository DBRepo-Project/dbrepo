{{- if .Values.uploadservice.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: upload-service-secret
  namespace: {{ .Values.namespace }}
stringData:
  AWS_ACCESS_KEY_ID: "{{ .Values.storageservice.s3.auth.username }}"
  AWS_SECRET_ACCESS_KEY: "{{ .Values.storageservice.s3.auth.password }}"
  AWS_REGION: "default"
{{- end }}