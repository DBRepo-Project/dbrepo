{{- if .Values.dashboardui.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-ui-prov-datasources-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  infinity.yaml: |-
    apiVersion: 1
    datasources:
      - name: dbrepo-json
        uid: dbrepojson0
        type: yesoreyeram-infinity-datasource
        basicAuth: true
        basicAuthUser: {{ .Values.datadb.db.user }}
        url: {{ .Values.gateway }}
        jsonData:
          auth_method: 'basicAuth'
          httpHeaderName1: Accept
          allowedHosts:
            - '{{ .Values.gateway }}'
        secureJsonData:
          basicAuthPassword: {{ .Values.datadb.db.password }}
          httpHeaderValue1: application/json
  prometheus.yaml: |-
    apiVersion: 1
    datasources:
      - name: dbrepo-metrics
        type: prometheus
        uid: dbrepometrics0
        url: {{ .Values.metricdb.endpoint }}
{{- end }}
