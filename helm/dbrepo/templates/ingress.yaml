{{- if .Values.ingress.enabled }}
{{ $hostname := regexReplaceAll "https?://" .Values.hostname "" }}
{{- if .Values.authservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
{{- end }}
{{- if .Values.searchservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 80
{{- end }}
{{- if .Values.searchservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /api/v1/datasource
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80
          - path: /api/v1/dashboard
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80
{{- end }}
{{- if .Values.searchservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/table/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(data|statistic|history)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 80
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/view/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(data|statistic)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 80
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(subset|grant|analyse)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 80
{{- end }}
{{- if .Values.searchservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metadata
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/view
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
          - path: /api/v1/(database|concept|container|identifier|image|message|license|oai|ontology|unit|user)
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
          - path: /api/v1/identifier/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
{{- end }}
{{- if .Values.searchservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
{{- end }}
{{- if .Values.dataservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-upload
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2G
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /api/v1/upload
            pathType: Prefix
            backend:
              service:
                name: data-service
                port:
                  number: 80
{{- end }}
{{- if .Values.metadataservice.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metadata-pid
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/api/v1/identifier/$1"
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /pid/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
{{- end }}
{{- if .Values.dashboardui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ui
  namespace: {{ include "common.names.namespace" . | quote }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/$1"
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          - path: /dashboard/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dashboard-ui
                port:
                  number: 3000
{{- end }}
{{- end }}