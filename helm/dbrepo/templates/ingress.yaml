{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-routes-ingress
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.hostname }}
      secretName: ingress-cert
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 80
          - path: /api/v1/datasource
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80
          - path: /api/v1/dashboard
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/table/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(data|statistic|history)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 80
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/view/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(data|statistic)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 80
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/view
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
          - path: /api/v1/database/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/(subset|grant|analyse)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 80
          - path: /api/v1/(database|concept|container|identifier|image|message|license|oai|ontology|unit|user)
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
          - path: /api/v1/identifier/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upload-routes-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2G
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.hostname }}
      secretName: ingress-cert
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /api/v1/upload
            pathType: Prefix
            backend:
              service:
                name: data-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewrite-identifier-routes-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/api/v1/identifier/$1"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.hostname }}
      secretName: ingress-cert
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /pid/([0-9a-f]{8}-[0-9a-f]{4}-[4][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})
            pathType: ImplementationSpecific
            backend:
              service:
                name: metadata-service
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewrite-dashboard-routes-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/$1"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.hostname }}
      secretName: ingress-cert
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /dashboard/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dashboard-ui
                port:
                  number: 3000

{{- end }}