{{- if .Values.storageservice.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-service-setup-job-{{ .Release.Revision }}
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  backoffLimit: {{ .Values.storageservice.setupJob.backoffLimit | default "10" }}
  ttlSecondsAfterFinished: {{ .Values.storageservice.setupJob.ttlSecondsAfterFinished | default "100" }}
  template:
    metadata:
      name: storage-service-setup-job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.storageservice.setupJob.image.name }}
          imagePullPolicy: {{ .Values.storageservice.setupJob.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.storageservice.setupJob.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.storageservice.setupJob.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: storage-service-secret
                  key: admin_access_key_id
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: storage-service-secret
                  key: S3_BUCKET
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-service-secret
                  key: admin_secret_access_key
            - name: STORAGE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: storage-service-secret
                  key: STORAGE_ENDPOINT
          volumeMounts:
            - name: empty-dir
              mountPath: /app/config
          {{- if .Values.storageservice.setupJob.resources }}
          resources: {{- toYaml .Values.storageservice.setupJob.resources | nindent 12 }}
          {{- else if ne .Values.storageservice.setupJob.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.storageservice.setupJob.resourcesPreset) | nindent 12 }}
          {{- end }}
      volumes:
        - name: empty-dir
          emptyDir: { }
{{- end }}
