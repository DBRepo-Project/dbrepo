{{- if .Values.dashboardui.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-ui-datasources-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  infinity.yaml: |-
    apiVersion: 1
    datasources:
      - name: dbrepo-json
        uid: dbrepojson0
        type: yesoreyeram-infinity-datasource
        basicAuth: true
        basicAuthUser: user
        url: $BASE_URL
        jsonData:
          auth_method: 'basicAuth'
          httpHeaderName1: Accept
          allowedHosts:
            - '$BASE_URL'
        secureJsonData:
          basicAuthPassword: user
          httpHeaderValue1: application/json
  prometheus.yaml: |-
    apiVersion: 1
    datasources:
      - name: dbrepo-metrics
        type: prometheus
        uid: dbrepometrics0
        url: http://metric-db-server
{{- end }}
