{{- if .Values.dashboardui.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-ui-datasources-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  datasources.yaml: |-
    # Datasources are managed by the one-shot dashboard setup.
    apiVersion: 1
    datasources: []
{{- end }}
