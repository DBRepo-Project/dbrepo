{{- if .Values.searchservice.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-service
  namespace: {{ include "common.names.namespace" . | quote }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: search-service
      service: search-service
{{- end }}