{{- if .Values.brokerservice.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: broker-service-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  advanced.config: |
    [
      {
        rabbitmq_auth_backend_ldap,
        [
          {
            tag_queries, [
              {
                administrator, {in_group_nested, "cn=system,ou=users,{{ .Values.identityservice.global.ldapDomain }}", "member"}
              },
              {
                management, {constant, true}
              }
            ]
          }
        ]
      }
    ].
  load_definition.json: |
    {
      "bindings": [
        {
          "arguments": {},
          "destination": "dbrepo",
          "destination_type": "queue",
          "routing_key": "dbrepo.#",
          "source": "dbrepo",
          "vhost": "dbrepo"
        }
      ],
      "exchanges": [
        {
          "arguments": {},
          "auto_delete": false,
          "durable": true,
          "name": "dbrepo",
          "type": "topic",
          "vhost": "dbrepo"
        }
      ],
      "global_parameters": [],
      "parameters": [],
      "permissions": [],
      "policies": [],
      "queues": [
        {
          "arguments": {
            "x-queue-type": "quorum",
            "quorum_cluster_size": "2"
          },
          "auto_delete": false,
          "durable": true,
          "name": "dbrepo",
          "type": "quorum",
          "vhost": "dbrepo"
        }
      ],
      "rabbit_version": "3.10.25",
      "rabbitmq_version": "3.10.25",
      "topic_permissions": [],
      "users": [],
      "vhosts": [
        {
          "limits": [],
          "metadata": {
            "description": "Default virtual host",
            "tags": []
          },
          "name": "dbrepo"
        }
      ]
    }
{{- end }}
