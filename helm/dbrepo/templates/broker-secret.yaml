{{- if .Values.brokerservice.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: broker-service-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  advanced.config: |
    [
      {
        rabbit, [
          {forced_feature_flags_on_init, [quorum_queue]}
        ]
      },
      {
        rabbitmq_auth_backend_ldap,
        [
          {
            resource_access_query,
            {'not', {match, {string, "${name}"}, {string, "^dbrepo[.]consumer[.]errors($|[.])"}}}
          },
          {
            tag_queries, [
              {
                administrator, {in_group_nested, "cn=system,ou=users,{{ .Values.identityservice.global.ldapDomain }}", "member"}
              },
              {
                management, {constant, false}
              }
            ]
          }
        ]
      }
    ].
  load_definition.json: |
    {
      "bindings": [
        {
          "arguments": {},
          "destination": "dbrepo",
          "destination_type": "queue",
          "routing_key": "dbrepo.#",
          "source": "dbrepo",
          "vhost": "dbrepo"
        },
        {
          "source": "dbrepo.consumer.errors",
          "vhost": "dbrepo",
          "destination": "dbrepo.consumer.errors",
          "destination_type": "queue",
          "routing_key": "failed",
          "arguments": {}
        }
      ],
      "exchanges": [
        {
          "arguments": {},
          "auto_delete": false,
          "durable": true,
          "name": "dbrepo",
          "type": "topic",
          "vhost": "dbrepo"
        },
        {
          "name": "dbrepo.consumer.errors",
          "vhost": "dbrepo",
          "type": "direct",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ],
      "global_parameters": [],
      "parameters": [],
      "permissions": [
        {
          "user": "{{ .Values.brokerservice.auth.username }}",
          "vhost": "dbrepo",
          "configure": ".*",
          "read": ".*",
          "write": ".*"
        }
      ],
      "policies": [
        {
          "vhost": "dbrepo",
          "name": "dbrepo-consumer-errors",
          "pattern": "^dbrepo$",
          "apply-to": "queues",
          "priority": 100,
          "definition": {
            "dead-letter-exchange": "dbrepo.consumer.errors",
            "dead-letter-routing-key": "failed",
            "dead-letter-strategy": "at-least-once",
            "overflow": "reject-publish",
            "delivery-limit": 10
          }
        }
      ],
      "queues": [
        {
          "arguments": {
            "x-queue-type": "quorum"
          },
          "auto_delete": false,
          "durable": true,
          "name": "dbrepo",
          "type": "quorum",
          "vhost": "dbrepo"
        },
        {
          "name": "dbrepo.consumer.errors",
          "vhost": "dbrepo",
          "durable": true,
          "auto_delete": false,
          "type": "quorum",
          "arguments": {
            "x-queue-type": "quorum"
          }
        }
      ],
      "rabbit_version": "3.10.25",
      "rabbitmq_version": "3.10.25",
      "topic_permissions": [],
      "users": [
        {
          "name": "{{ .Values.brokerservice.auth.username }}",
          "password_hash": "{{ .Values.brokerservice.auth.passwordHash }}",
          "tags": [
            "administrator"
          ]
        }
      ],
      "vhosts": [
        {
          "limits": [],
          "metadata": {
            "description": "Default virtual host",
            "tags": []
          },
          "name": "dbrepo"
        }
      ]
    }
{{- end }}
