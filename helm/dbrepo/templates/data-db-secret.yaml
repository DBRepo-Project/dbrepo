{{- if .Values.datadb.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: data-db-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  DATA_DB_PASSWORD: "{{ .Values.datadb.rootUser.password }}"
  DATA_DB_REPL_PASSWORD: "{{ .Values.datadb.replication.password }}"
  READONLY_USER_PASSWORD: "{{ .Values.datadb.db.password }}"
  S3_ACCESS_KEY_ID: "{{ .Values.storageservice.s3.auth.adminAccessKeyId }}"
  S3_SECRET_ACCESS_KEY: "{{ .Values.storageservice.s3.auth.adminSecretAccessKey }}"
{{- end }}
