{{- if .Values.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    app: ui
    service: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    type: {{ .Values.strategyType }}
  selector:
    matchLabels:
      app: ui
      service: ui
  template:
    metadata:
      annotations:
        {{- if .Values.ui.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ui.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      labels:
        app: ui
        service: ui
    spec:
      {{- if .Values.ui.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.ui.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ .Values.ui.image.name }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.ui.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.ui.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: ui-storage-secret
            - secretRef:
                name: ui-auth-secret
            - secretRef:
                name: ui-metadata-secret
            - secretRef:
                name: ui-upload-secret
            - secretRef:
                name: ui-pid-secret
            - secretRef:
                name: ui-broker-secret
            - secretRef:
                name: ui-dashboard-secret
          volumeMounts:
            {{- if .Values.ui.extraVolumeMounts }}
            {{- .Values.ui.extraVolumeMounts | toYaml | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 150
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- if .Values.ui.resources }}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- else if ne .Values.ui.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.ui.resourcesPreset) | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.ui.extraVolumes }}
        {{- .Values.ui.extraVolumes | toYaml | nindent 8 }}
        {{- end }}
{{- end }}
