{{- if .Values.storageservice.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-service-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  S3_BUCKET: "{{ .Values.storageservice.s3.bucket }}"
  STORAGE_ENDPOINT: "{{ .Values.storageservice.setupJob.s3.endpoint }}"
  admin_access_key_id: "{{ .Values.storageservice.s3.auth.adminAccessKeyId }}"
  admin_secret_access_key: "{{ .Values.storageservice.s3.auth.adminSecretAccessKey }}"
  default_access_key_id: "{{ .Values.storageservice.s3.auth.defaultAccessKeyId }}"
  default_secret_access_key: "{{ .Values.storageservice.s3.auth.defaultSecretAccessKey }}"
  config.json: |
    {
      "identities": [
        {
          "name": "default",
          "credentials": [
            {
              "accessKey": "{{ .Values.storageservice.s3.auth.defaultAccessKeyId }}",
              "secretKey": "{{ .Values.storageservice.s3.auth.defaultSecretAccessKey }}"
            }
          ],
          "actions": [
            "Read",
            "Write",
            "List"
          ]
        },
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "{{ .Values.storageservice.s3.auth.adminAccessKeyId }}",
              "secretKey": "{{ .Values.storageservice.s3.auth.adminSecretAccessKey }}"
            }
          ],
          "actions": [
            "Read",
            "Write",
            "List",
            "Tagging",
            "Admin"
          ]
        }
      ]
    }
{{- end }}