{{- if .Values.dashboardui.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-ui-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  BASE_URL: "{{ .Values.gateway }}"
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
  GF_DATABASE_TYPE: "postgres"
  GF_DATABASE_HOST: "{{ .Values.dashboarddb.host }}"
  GF_DATABASE_NAME: "{{ .Values.dashboarddb.auth.database }}"
  GF_DATABASE_USER: "{{ .Values.dashboarddb.auth.username }}"
  GF_DATABASE_PASSWORD: "{{ .Values.dashboarddb.auth.password }}"
  GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource,grafana-opensearch-datasource"
  GF_SERVER_ROOT_URL: "http://dashboard-ui:3000/dashboard/"
{{- end }}
