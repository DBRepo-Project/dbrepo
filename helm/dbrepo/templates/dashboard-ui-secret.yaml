{{- if .Values.dashboardui.enabled }}
{{- $rootUrl := printf "https://%s/dashboard/" .Values.hostname }}
{{- $oauthSecret := .Values.dashboardui.oauthClientSecret }}
{{- if not $oauthSecret }}
{{- $existing := lookup "v1" "Secret" (include "common.names.namespace" .) "dashboard-ui-secret" }}
{{- if and $existing $existing.data (index $existing.data "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET") }}
{{- $oauthSecret = index $existing.data "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" | b64dec }}
{{- else }}
{{- $oauthSecret = randAlphaNum 64 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-ui-secret
  namespace: {{ include "common.names.namespace" . | quote }}
stringData:
  admin-user: "{{ .Values.dashboardui.admin.user }}"
  admin-password: "{{ .Values.dashboardui.admin.password }}"
  BASE_URL: "https://{{ .Values.hostname }}"
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
  GF_AUTH_ANONYMOUS_ORG_NAME: {{ .Values.dashboardui.researchOrganizationName | quote }}
  GF_USERS_AUTO_ASSIGN_ORG_ID: {{ .Values.dashboardui.organizationId | quote }}
  GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "DBRepo"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .Values.dashboardui.oauthClientId | quote }}
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ $oauthSecret | quote }}
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://{{ .Values.hostname }}/realms/dbrepo/protocol/openid-connect/auth"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ .Values.authservice.endpoint }}/realms/dbrepo/protocol/openid-connect/token"
  GF_AUTH_GENERIC_OAUTH_API_URL: "{{ .Values.authservice.endpoint }}/realms/dbrepo/protocol/openid-connect/userinfo"
  GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
  GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
  GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
  GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
  GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
  GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "false"
  GF_RBAC_PERMISSION_CACHE: "false"
  GF_DATABASE_TYPE: "postgres"
  GF_DATABASE_HOST: "{{ .Values.dashboarddb.host }}"
  GF_DATABASE_NAME: "{{ .Values.dashboarddb.auth.database }}"
  GF_DATABASE_USER: "{{ .Values.dashboarddb.auth.username }}"
  GF_DATABASE_PASSWORD: "{{ .Values.dashboarddb.auth.password }}"
  GF_SERVER_ROOT_URL: "{{ .Values.dashboardui.serverRootUrl | default $rootUrl }}"
{{- end }}
