{{- if .Values.authservice.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: {{ include "common.names.namespace" . | quote }}
data:
  dbrepo-realm.json: |-
    {{ .Files.Get "files/dbrepo-realm.json" | nindent 4 }}
  master-realm.json: |-
    {{ .Files.Get "files/master-realm.json" | nindent 4 }}
{{- end }}