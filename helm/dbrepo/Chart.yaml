apiVersion: v2
name: dbrepo
description: Helm Chart for installing DBRepo
sources:
  - https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services
type: application
version: "1.4.4"
appVersion: "1.4.4"
keywords:
  - dbrepo
maintainers:
  - name: Martin Weise
    email: martin.weise@tuwien.ac.a
home: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/
icon: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services/-/raw/master/dbrepo-ui/public/favicon.png
dependencies:
  - name: opensearch
    alias: searchdb
    version: 1.2.2
    repository: https://charts.bitnami.com/bitnami
    condition: searchdb.enabled
  - name: keycloak
    alias: authservice
    version: 17.3.3
    repository: https://charts.bitnami.com/bitnami
    condition: authservice.enabled
  - name: mariadb
    alias: datadb
    version: 14.1.4
    repository: https://charts.bitnami.com/bitnami
    condition: datadb.enabled
  - name: mariadb
    alias: metadatadb
    version: 14.1.4
    repository: https://charts.bitnami.com/bitnami
    condition: metadatadb.enabled
  - name: rabbitmq
    alias: brokerservice
    version: 14.0.0
    repository: https://charts.bitnami.com/bitnami
    condition: brokerservice.enabled
  - name: seaweedfs
    alias: storageservice
    version: 3.59.4
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: storageservice.enabled
  - name: tusd
    alias: uploadservice
    version: 0.1.2
    repository: https://charts.sagikazarmark.dev
    condition: uploadservice.enabled
  - name: openldap-stack-ha
    alias: identityservice
    version: 4.2.5
    repository: https://jp-gouin.github.io/helm-openldap/
    condition: identityservice.enabled