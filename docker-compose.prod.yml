  # INFO: This compose file deploys the official Docker images from a stable, tested master branch
# MODIFIED: 2023-06-01
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  data-db-data:
  upload-service-data:
  search-db-data:
  broker-service-data:
  authentication-service-data:

networks:
  public:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  core:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16

services:

  dbrepo-metadata-db:
    restart: "no"
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    image: dbrepo/metadata-db:1.3
    networks:
      core:
    volumes:
      - metadata-db-data:/var/lib/mysql
      - ./setup-schema_local.sql:/docker-entrypoint-initdb.d/setup-schema_local.sql
    ports:
      - "3306:3306"
    env_file:
      - .env
    logging:
      driver: json-file

  dbrepo-data-db:
    restart: "no"
    container_name: dbrepo-data-db
    hostname: data-db
    image: mariadb:10.5
    networks:
      core:
    volumes:
      - data-db-data:/var/lib/mysql
      - "${SHARED_FILESYSTEM}:/tmp"
    ports:
      - "3307:3306"
      - "9101:9100"
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=$USER_DB_PASSWORD
    healthcheck:
      test: mysqladmin ping --user="$USER_DB_USERNAME" --password="$USER_DB_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file

  dbrepo-upload-service:
    restart: "no"
    container_name: dbrepo-upload-service
    hostname: upload-service
    image: tusproject/tusd:v1.12
    networks:
      core:
    env_file:
      - .env
    volumes:
      - upload-service-data:/data
      - "${SHARED_FILESYSTEM}:/srv/tusd-data/data"
    ports:
      - "1080:1080"
    logging:
      driver: json-file

  dbrepo-authentication-service:
    restart: "no"
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: dbrepo/authentication-service:1.3
    networks:
      core:
    ports:
      - "8443:8443"
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - authentication-service-data:/opt/keycloak/data/
    depends_on:
      dbrepo-metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-metadata-service:
    restart: "no"
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    image: dbrepo/metadata-service:1.3
    networks:
      core:
    env_file:
      - .env
    ports:
      - "9099:9099"
    healthcheck:
      test: wget -qO- localhost:9099/actuator/health/readiness | grep -q "UP" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-analyse-service:
    restart: "no"
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    image: dbrepo/analyse-service:1.3
    networks:
      core:
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - "${SHARED_FILESYSTEM}:/tmp"
    logging:
      driver: json-file

  dbrepo-broker-service:
    restart: "no"
    container_name: dbrepo-broker-service
    hostname: broker-service
    image: dbrepo/broker-service:1.3
    networks:
      core:
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    depends_on:
      dbrepo-authentication-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: json-file

  dbrepo-search-db:
    restart: "no"
    container_name: dbrepo-search-db
    hostname: search-db
    image: opensearchproject/opensearch:2.8.0
    networks:
      core:
    ports:
      - 9200:9200
    env_file:
      - .env
    healthcheck:
      test: curl -s http://search-db:9200 > /dev/null || exit 1
    environment:
      discovery.type: "single-node"
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
      logger.level: "WARN"
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - search-db-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  dbrepo-ui:
    restart: "no"
    container_name: dbrepo-ui
    hostname: ui
    image: dbrepo/ui:1.3
    networks:
      core:
      public:
    env_file:
      - .env
    depends_on:
      dbrepo-upload-service:
        condition: service_started
    logging:
      driver: json-file

  dbrepo-gateway-service:
    restart: "no"
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: nginx:1.25-alpine-slim
    networks:
      core:
      public:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dbrepo.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      dbrepo-analyse-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-ui:
        condition: service_started
    logging:
      driver: json-file
