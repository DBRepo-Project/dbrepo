apiVersion: batch/v1
kind: Job
metadata:
  name: storage-service-create-buckets-job
  namespace: {{ .Values.namespace }}
spec:
  template:
    metadata:
      name: storage-service-create-buckets-job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: s210.dl.hpc.tuwien.ac.at/dbrepo/storage-service-init:latest
          env:
            - name: WEED_CLUSTER_DEFAULT
              value: "sw"
            - name: WEED_CLUSTER_SW_MASTER
              value: "storage-service-master.{{ .Release.Name }}:9333"
            - name: SEAWEEDFS_ENDPOINT
              value: "storage-service-master.{{ .Release.Name }}:9333"
            - name: WEED_CLUSTER_SW_FILER
              value: "storage-service-filer-client.{{ .Release.Name }}:8888"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SEAWEEDFS_FULLNAME
              value: "storage-service"
          volumeMounts:
            - name: config-users
              mountPath: /etc/sw
              readOnly: true
          ports:
            - containerPort: 9333
              name: swfs-master
            - containerPort: 19333
              #name: swfs-master-grpc
      volumes:
        - name: config-users
          secret:
            defaultMode: 420
            secretName: seaweedfs-s3-secret
