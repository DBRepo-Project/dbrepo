{{- if .Values.dataDb.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-db-shared
spec:
  {{- if .Values.dataDbSidecar.persistence.storageClass }}
  storageClassName: {{ .Values.dataDbSidecar.persistence.storageClass }}
  {{- end }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Gi
{{- end }}