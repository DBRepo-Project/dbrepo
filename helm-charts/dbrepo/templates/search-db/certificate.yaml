apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: search-db
  namespace: {{ .Values.namespace }}
spec:
  isCA: false
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  commonName: search-db
  secretName: search-db-cert
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
    - server auth
    - client auth
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io