{{- if .Values.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ $.Values.namespace }}
  labels:
    app: ui
    service: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  strategy:
    type: {{ $.Values.strategyType }}
  selector:
    matchLabels:
      app: ui
      service: ui
  template:
    metadata:
      labels:
        app: ui
        service: ui
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ui
          image: {{ printf "%s/%s:%s" .Values.ui.image.registry .Values.ui.image.repository .Values.ui.image.tag }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: API
              value: "https://{{ .Values.hostname }}"
          volumeMounts:
            - mountPath: /app/dbrepo.config.json
              subPath: dbrepo.config.json
              name: config
            {{- if .Values.ui.extraVolumeMounts }}
            {{- .Values.ui.extraVolumeMounts | toYaml | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ui-setup
        {{- if .Values.ui.extraVolumes }}
        {{- .Values.ui.extraVolumes | toYaml | nindent 8 }}
        {{- end }}
{{- end }}
