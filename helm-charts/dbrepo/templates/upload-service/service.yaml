{{- if .Values.uploadService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: {{ .Values.namespace }}
  labels:
    service: upload-service
spec:
  type: ClusterIP
  ports:
    - name: "http"
      port: 80
      targetPort: 1080
      protocol: TCP
  selector:
    service: upload-service
{{- end }}
