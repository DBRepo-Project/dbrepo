namespace: dbrepo

hostname: example.com

strategyType: RollingUpdate

clusterDomain: cluster.local

metadataDb:
  enabled: true
  fullnameOverride: metadata-db
  image:
    debug: false
  host: metadata-db
  rootUser:
    user: root
    password: dbrepo
  jdbcExtraArgs: ""
  db:
    name: fda
  metrics:
    enabled: false
  galera:
    mariabackup:
      user: mariabackup
      password: mariabackup
  initdbScriptsConfigMap: metadata-db-setup
  service:
    type: ClusterIP
    annotations: { }
    loadBalancerIP: ""
    loadBalancerSourceRanges: [ ]
  persistence:
    enabled: true
  replicaCount: 1 # uneven 3,5,7

authService:
  enabled: true
  fullnameOverride: auth-service
  image:
    debug: false
  auth:
    adminUser: fda
    adminPassword: fda
  postgresql:
    enabled: false # not needed
  extraStartupArgs: "--import-realm"
  tls:
    enabled: true
    existingSecret: ingress-cert
    usePem: true
  metrics:
    enabled: true
  externalDatabase:
    existingSecret: auth-service-secret
    existingSecretDatabaseKey: db-name
    existingSecretHostKey: db-host
    existingSecretPortKey: db-port
    existingSecretUserKey: db-username
    existingSecretPasswordKey: db-password
  client:
    id: dbrepo-client
    secret: MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG
  extraEnvVarsCM: auth-service-config
  extraVolumes:
    - name: config-map
      configMap:
        name: auth-service-setup
  extraVolumeMounts:
    - name: config-map
      mountPath: /opt/bitnami/keycloak/data/import
  replicaCount: 1

authDb:
  enabled: true
  fullnameOverride: auth-db
  host: auth-db-pgpool
  port: 5432
  postgresql:
    postgresPassword: postgres
    username: metrics # implicit requirement for metrics container
    password: metrics # implicit requirement for metrics container
    repmgrPassword: repmgr # implicit requirement for rolling updates
    database: keycloak
    replicaCount: 1
  pgpool:
    adminUsername: admin
    adminPassword: admin
  metrics:
    enabled: true
  service:
    type: ClusterIP
    annotations: { }
    loadBalancerIP: ""
    loadBalancerSourceRanges: [ ]
  persistence:
    enabled: true
    size: 10Gi

dataDb:
  enabled: true
  fullnameOverride: data-db
  image:
    debug: false
  extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
  rootUser:
    user: root
    password: dbrepo
  metrics:
    enabled: true
  galera:
    mariabackup:
      user: mariabackup
      password: mariabackup
  sidecars:
    - name: sidecar
      image: s210.dl.hpc.tuwien.ac.at/dbrepo/data-db-sidecar:1.4.2
      imagePullPolicy: Always
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      ports:
        - containerPort: 3305
          protocol: TCP
      env:
        - name: S3_STORAGE_ENDPOINT
          value: http://storageservice-s3:9000
        - name: S3_ACCESS_KEY_ID
          value: seaweedfsadmin
        - name: S3_SECRET_ACCESS_KEY
          value: seaweedfsadmin
      volumeMounts:
        - name: tmp # share between sidecar and galera container
          mountPath: /tmp
  service:
    type: ClusterIP
    annotations: { }
    #loadBalancerIP: 1.2.3.4
    loadBalancerSourceRanges: [ ]
    extraPorts:
      - name: "sidecar"
        port: 3305
        targetPort: 3305
        protocol: TCP
  extraVolumeMounts:
    - name: tmp # share between sidecar and galera container
      mountPath: /tmp
  extraVolumes:
    #    - name: tmp
    #      emptyDir: {}
    - name: tmp
      persistentVolumeClaim:
        claimName: data-db-shared
  persistence:
    enabled: true
    size: 10Gi
  replicaCount: 1 # uneven

dataDbSidecar:
  persistence:
    storageClass:

searchdb:
  enabled: true
  fullnameOverride: search-db
  host: search-db
  port: 9200
  protocol: http
  username: admin
  password: admin
  clusterName: search-db
  masterService: search-db
  replicas: 1
  image:
    debug: false
  sysctlInit:
    enabled: true
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    annotations: { }
    loadBalancerSourceRanges: [ ]
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
  extraVolumeMounts:
    - name: node-cert
      mountPath: /usr/share/opensearch/config/tls
      readOnly: true
  extraVolumes:
    - name: node-cert
      secret:
        secretName: search-db-cert
  config:
    opensearch.yml: |
      cluster.name: search-db
      network.host: 0.0.0.0
      plugins:
        security:
          ssl:
            transport:
              pemcert_filepath: tls/tls.crt
              pemkey_filepath: tls/tls.key
              pemtrustedcas_filepath: tls/ca.crt
              enforce_hostname_verification: false
            http:
              #enabled: true # uncomment to force ssl connections
              pemcert_filepath: tls/tls.crt
              pemkey_filepath: tls/tls.key
              pemtrustedcas_filepath: tls/ca.crt
          allow_unsafe_democertificates: false
          allow_default_init_securityindex: true
          authcz:
            admin_dn:
              - CN=search-db
          nodes_dn:
            - CN=search-db
          audit.type: internal_opensearch
          enable_snapshot_restore_privilege: true
          check_snapshot_restore_write_privileges: true
          restapi:
            roles_enabled: [ "all_access", "security_rest_api_access" ]
          system_indices:
            enabled: true
            indices:
              [
                ".opendistro-alerting-config",
                ".opendistro-alerting-alert*",
                ".opendistro-anomaly-results*",
                ".opendistro-anomaly-detector*",
                ".opendistro-anomaly-checkpoints",
                ".opendistro-anomaly-detection-state",
                ".opendistro-reports-*",
                ".opendistro-notifications-*",
                ".opendistro-notebooks",
                ".opendistro-asynchronous-search-response*",
              ]

searchDbDashboard:
  enabled: true
  fullnameOverride: search-db-dashboard
  opensearchHosts: http://search-db:9200
  extraInitContainers:
    - name: init
      image: s210.dl.hpc.tuwien.ac.at/dbrepo/search-db-init:1.4.2
      imagePullPolicy: Always
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      env:
        - name: OPENSEARCH_HOST
          value: http://search-db:9200
  extraVolumeMounts:
    - name: tls
      mountPath: /usr/share/opensearch-dashboards/tls
      readOnly: true
    - name: config
      mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
      subPath: opensearch_dashboards.yml
      readOnly: true
  extraVolumes:
    - name: tls
      secret:
        secretName: ingress-cert
    - name: config
      secret:
        secretName: search-db-dashboard-secret
  replicaCount: 1

uploadService:
  enabled: true
  image:
    registry: docker.io
    repository: tusproject/tusd
    tag: v1.12
  replicaCount: 1

brokerService:
  enabled: true
  fullnameOverride: broker-service
  image:
    debug: true
  url: http://broker-service:15672
  host: broker-service
  port: 5672
  virtualHost: dbrepo
  queueName: dbrepo
  exchangeName: dbrepo
  routingKey: dbrepo.#
  connectionTimeout: 60000
  auth:
    tls:
      enabled: false
      sslOptionsVerify: true
      failIfNoPeerCert: true
      existingSecret: ingress-cert
    username: broker
    password: broker
  extraConfiguration: |-
    default_vhost = dbrepo
    default_user_tags.administrator = true
    default_permissions.configure = .*
    default_permissions.read = .*
    default_permissions.write = .*
    load_definitions = /app/load_definition.json
    log.console = true
    listeners.tcp.1 = 0.0.0.0:5672
    auth_backends.1 = rabbit_auth_backend_oauth2
    auth_backends.2 = rabbit_auth_backend_internal
    auth_oauth2.resource_server_id = rabbitmq
    auth_oauth2.preferred_username_claims.1 = client_id
    auth_oauth2.default_key = t2OCeCheJ9uwoBbNQjG_nN6WKiLcceTIAZmiTbGODFM
    auth_oauth2.signing_keys.t2OCeCheJ9uwoBbNQjG_nN6WKiLcceTIAZmiTbGODFM = /app/cert.pem
    auth_oauth2.signing_keys.id2 = /app/pubkey.pem
    auth_oauth2.algorithms.1 = HS256
    auth_oauth2.algorithms.2 = RS256
  loadDefinition:
    enabled: true
    existingSecret: broker-service-secret
  extraVolumes:
    - name: secret-map
      secret:
        secretName: broker-service-secret
  extraPlugins: rabbitmq_prometheus rabbitmq_auth_backend_oauth2 rabbitmq_auth_mechanism_ssl
  persistence:
    enabled: false
    size: 5Gi
  service:
    type: ClusterIP
    managerPortEnabled: true
    # loadBalancerIP:
  replicaCount: 1

analyseService:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/analyse-service:1.4.2
    pullPolicy: Always
    debug: false
  replicaCount: 1

metadataService:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/metadata-service:1.4.2
    pullPolicy: Always
    debug: false
  adminEmail: noreply@example.com
  authService:
    url: http://auth-service
  website: http://example.com
  repositoryName: Database Repository
  datacite:
    enabled: false
    url: https://api.datacite.org
    prefix: ""
    username: ""
    password: ""
  rates:
    deleteStaleFiles: 60
    mirror: 60
    obtainMetadata: 60
    deleteStaleQueries: 60
  replicaCount: 1

dataService:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/data-service:1.4.2
    pullPolicy: Always
    debug: false
  jwt:
    pubkey: ""
  consumerConcurrentMin: 1
  consumerConcurrentMax: 5
  requeueRejected: false
  replicaCount: 1

searchService:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/search-service:1.4.2
    pullPolicy: Always
    debug: false
  replicaCount: 1

storageservice:
  enabled: true
  master:
    enabled: true
  filer:
    enabled: true
    replicas: 1
    enablePVC: false
    storage: 25Gi
    s3:
      enabled: true
      allowEmptyFolder: true
      port: 9000
      enableAuth: true
      skipAuthSecretCreation: true
      existingConfigSecret: seaweedfs-s3-secret
  volume:
    enabled: true
    replicas: 1
  s3:
    enabled: true
    replicas: 2
    port: 9000
    metricsPort: 9091
    enableAuth: true
    skipAuthSecretCreation: true
    existingConfigSecret: seaweedfs-s3-secret
    auth:
      username: seaweedfsadmin
      password: seaweedfsadmin

ui:
  enabled: true
  image:
    name: s210.dl.hpc.tuwien.ac.at/dbrepo/ui:1.4.2
    pullPolicy: Always
    debug: false
  public:
    api:
      client: {}
      server: {}
    title: "Database Repository"
    logo: "/logo.svg"
    icon: "/favicon.ico"
    touch: "/apple-touch-icon.png"
    broker:
      host: example.com
      port:
        5671: true
        5672: false
      extra: "128.130.0.0/15"
    database:
      extra: "128.130.0.0/15"
    pid:
      default:
        publisher: "Example University"
    doi:
      enabled: false
      endpoint: https://doi.org
  replicaCount: 1
  extraVolumes: [ ]
  #  - name: images-map
  #    configMap:
  #      name: ui-config
  extraVolumeMounts: [ ]
  #  - name: images-map
  #    mountPath: /static/logo.svg
  #    subPath: logo.svg

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: ingress-cert
  annotations:
    basic: {}
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
    secure:
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    upload:
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/proxy-body-size: 2G
    rewriteApi:
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /api/$1
    rewriteRoot:
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$1
    rewriteRootSecure:
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$1
    rewritePid:
#      cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /api/pid/$1
