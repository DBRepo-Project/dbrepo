summary: Retrieve label from URI
description: This is a simple API for retrieving label from concepts
consumes:
  - application/json
produces:
  - application/json
requestBody:
  content:
    application/json:
      schema:
        required:
          - uri
          - name
        type: object
        properties:
          uri:
            type: string
            example: http://www.wikidata.org/entity/Q35120
responses:
  200:
    description: OK
  400:
    description: Invalid URI
  500:
    description: Server error
tags:
  - concepts-endpoint
