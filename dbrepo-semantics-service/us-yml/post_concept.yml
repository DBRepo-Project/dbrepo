summary: Save concept to MDB
description: This is a simple API for saving concept
consumes:
  - application/json
produces:
  - application/json
requestBody:
  content:
    application/json:
      schema:
        required:
          - uri
          - name
        type: object
        properties:
          uri:
            type: string
            example: http://www.ontology-of-units-of-measure.org/resource/om-2/metre
          name:
            type: string
            example: metre
responses:
  200:
    description: OK
  201:
    description: Created
  405:
    description: Invalid input
  409:
    description: Concept already present
tags:
  - concepts-endpoint
