summary: Get ontology
description: This is a simple API for getting a certain ontologies (.nt, .ttl files) stored in DB-Repo.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: o_name
    required: true
    schema:
      type: string
      example: VOCAB_QUDT-UNITS-ALL-v2.1
responses:
  200:
    description: OK
  404:
    description: Not found
  405:
    description: Invalid input
tags:
  - ontologies-endpoint