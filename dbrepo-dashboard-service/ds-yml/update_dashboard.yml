tags:
  - dashboard-endpoint
summary: "Update dashboard"
description: "Synchronizes dashboard permissions and managed content. The /content route changes enabled managed content only. Requires role `system`."
consumes:
  - "application/json"
produces:
  - "application/json"
parameters:
  - name: uid
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: "body"
    in: "body"
    required: true
    schema:
      type: object
responses:
  400:
    description: Malformed request
  502:
    description: Dashboard backend request failed
  202:
    description: Updated dashboard successfully
    content:
      application/json:
        schema:
          type: object
  409:
    description: Dashboard is in an operator-managed folder
  404:
    description: "Dashboard or required owner account not found"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ApiError'
  500:
    description: "Unexpected system error"
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ApiError'
security:
  - bearerAuth: [ ]
  - basicAuth: [ ]
