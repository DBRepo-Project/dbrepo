app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:mariadb://localhost:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: dbrepo
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
      use-new-id-generator-mappings: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: user-service
  cloud:
    loadbalancer.ribbon.enabled: false
    gateway:
      httpclient:
        ssl:
          useInsecureTrustManager: true
management.endpoints.web.exposure.include: health,info,prometheus
server:
  port: 9098
  ssl:
    enabled: true
    key-alias: user-service
    key-store: "./server.keystore"
    key-store-type: jks
    key-store-password: password
    key-password: password
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance:
    hostname: user-service
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 9098
  client.serviceUrl.defaultZone: http://discovery-service:9090/eureka/
fda:
  ready.path: ./ready
  gateway.endpoint: https://gateway-service:9095
  keycloak:
    username: fda
    password: fda
  jwt:
    issuer: http://localhost:8080/realms/dbrepo
    public_key: 