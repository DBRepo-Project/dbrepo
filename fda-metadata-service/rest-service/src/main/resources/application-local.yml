app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:mariadb://localhost:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: dbrepo
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
      use-new-id-generator-mappings: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: metadata-service
  cloud:
    loadbalancer.ribbon.enabled: false
    gateway:
      httpclient:
        ssl:
          useInsecureTrustManager: true
management.endpoints.web.exposure.include: health,info,prometheus
server:
  port: 9099
  ssl:
    enabled: true
    key-alias: metadata-service
    key-store: ./server.keystore
    key-store-type: jks
    key-store-password: password
    key-password: password
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance:
    hostname: metadata-service
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 9099
  client.serviceUrl.defaultZone: http://localhost:9090/eureka/
fda:
  ready.path: ./ready
  pid.base: https://example.com/pid/
  gateway.endpoint: http://localhost:9095
dbrepo:
  repository-name: TU Wien Database Repository
  base-url: https://dbrepo.ossdip.at/api/oai
  admin-email: noreply@example.com
  earliest-datestamp: 2022-09-17T16:09:00Z
  deleted-record: persistent
  granularity: YYYY-MM-DDThh:mm:ssZ
