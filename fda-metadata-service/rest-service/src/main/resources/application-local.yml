app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/fda
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  application:
    name: metadata-service
  cloud:
    loadbalancer.ribbon.enabled: false
server.port: 9098
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: debug
    at.tuwien.mapper.: trace
    at.tuwien.service.: debug
    at.tuwien.config.: debug
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance.hostname: table-service
  client.serviceUrl.defaultZone: http://localhost:9090/eureka/
fda:
  ready.path: ./ready
  gateway.endpoint: http://localhost:9095
dbrepo:
  repository-name: TU Wien Database Repository
  base-url: https://dbrepo.ossdip.at
  admin-email: noreply@example.com
  earliest-datestamp: 2022-09-17T16:09:00Z
  deleted-record: persistent
  granularity: YYYY-MM-DDThh:mm:ssZ
