app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:mariadb://metadata-db:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${METADATA_USERNAME}"
    password: "${METADATA_PASSWORD}"
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  application:
    name: metadata-service
  cloud:
    loadbalancer.ribbon.enabled: false
server.port: 9099
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: "${LOG_LEVEL}"
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance.hostname: metadata-service
  client.serviceUrl.defaultZone: http://discovery-service:9090/eureka/
fda:
  ready.path: ./ready
  pid.base: "${PID_BASE}"
  gateway.endpoint: "${GATEWAY_ENDPOINT}"
dbrepo:
  repository-name: "${REPOSITORY_NAME}"
  base-url: "${BASE_URL}"
  admin-email: "${ADMIN_MAIL}"
  earliest-datestamp: "${EARLIEST_DATESTAMP}"
  deleted-record: "${DELETED_RECORD}"
  granularity: "${GRANULARITY}"
