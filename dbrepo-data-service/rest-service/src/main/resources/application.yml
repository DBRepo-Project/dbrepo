application:
  title: DBRepo
  version: '@project.version@'
spark:
  hadoop:
    version: '@project.properties.hadoop.version@'
  awsSdk:
    version: '@project.properties.aws-sdk.version@'
  mariadb:
    version: '@project.properties.mariadb.version@'
spring:
  data:
    redis:
      provider: "${CACHE_DB_PROVIDER:valkey}"
      host: "${CACHE_DB_HOST:cache-db}"
      port: "${CACHE_DB_PORT:6379}"
      timeout: 3000
      connectTimeout: 10000
      clientName: dbrepo
      password: "${CACHE_DB_PASSWORD:valkey}"
  datasource:
    url: "jdbc:h2:mem:dbrepo;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS dbrepo;NON_KEYWORDS=value"
    driver-class-name: org.h2.Driver
    username: "${H2_USERNAME:sa}"
    password: "${H2_PASSWORD:sa}"
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: "${METADATA_DB:dbrepo}"
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${OAUTH_ISSUER_URI:http://localhost/realms/dbrepo}"
          jwk-set-uri: "${OAUTH_JWK_SET_URI:http://auth-service:8080/realms/dbrepo/protocol/openid-connect/certs}"
  application:
    name: data-service
  servlet:
    multipart:
      max-file-size: "${MAX_UPLOAD_SIZE:2GB}"
      max-request-size: "${MAX_UPLOAD_SIZE:2GB}"
  main:
    banner-mode: off
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true
server:
  port: 8080
  tomcat:
    max-swallow-size: -1
duckdb:
  extension:
    directory: "/home/dbrepo/.duckdb/extensions"
  tmp:
    directory: /tmp/duckdb.tmp/
logging:
  file:
    name: /var/log/app/service/data/app.log
  level:
    root: warn
    at.ac.tuwien.ifs.dbrepo.: "${LOG_LEVEL:info}"
    org.springframework.security.oauth2.server.resource.authentication.JwtAuthenticationProvider: debug
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
  pattern:
    console: "%d %highlight(%-5level) %msg%n"
  structured:
    format:
      file: ecs
dbrepo:
  cache:
    ttl: "${CACHE_TTL:60}"
  endpoints:
    metadataService: "${METADATA_SERVICE_ENDPOINT:http://metadata-service:8080}"
    analyseService: "${ANALYSE_SERVICE_ENDPOINT:http://analyse-service:8080}"
    storageService: "${STORAGE_SERVICE_ENDPOINT:http://storage-service:9000}"
    authService: "${AUTH_SERVICE_ENDPOINT:http://auth-service:8080}"
    computeService: "${COMPUTE_SERVICE_ENDPOINT:local[*]}"
  s3:
    accessKeyId: "${S3_ACCESS_KEY_ID:seaweedfsadmin}"
    secretAccessKey: "${S3_SECRET_ACCESS_KEY:seaweedfsadmin}"
    bucket: "${S3_BUCKET:dbrepo}"
    region: "${S3_REGION:eu-west-1}"
    useSsl: "${S3_USE_SSL:false}"
    urlStyle: "${S3_URL_STYLE:path}"
  system:
    username: "${SYSTEM_USERNAME:admin}"
    password: "${SYSTEM_PASSWORD:admin}"
  keycloak:
    realm: "${REALM_NAME:dbrepo}"
    username: "${AUTH_SERVICE_ADMIN:admin}"
    password: "${AUTH_SERVICE_ADMIN_PASSWORD:admin}"
    client: "${AUTH_SERVICE_CLIENT:dbrepo-client}"
    clientSecret: "${AUTH_SERVICE_CLIENT_SECRET:MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}"
  grant:
    default:
      read: "${GRANT_DEFAULT_READ:SELECT, EXECUTE}"
      write: "${GRANT_DEFAULT_WRITE:SELECT, CREATE, CREATE VIEW, CREATE ROUTINE, CREATE TEMPORARY TABLES, EXECUTE, LOCK TABLES, INDEX, TRIGGER, INSERT, UPDATE, DELETE}"
  exchangeName: "${BROKER_EXCHANGE_NAME:dbrepo}"
  connectionTimeout: "${SPARQL_CONNECTION_TIMEOUT:10000}"
  baseUrl: "${BASE_URL:http://localhost}"
