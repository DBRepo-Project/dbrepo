app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:h2:mem:fda;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS FDA;NON_KEYWORDS=value
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  rabbitmq:
    host: localhost
    virtual-host: dbrepo
    password: guest
    username: guest
    port: 5672
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: data-service
  cloud:
    loadbalancer.ribbon.enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true
server:
  port: 19093
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
dbrepo:
  endpoints:
    gatewayService: http://localhost
    storageService: http://localhost:9000
    authService: http://localhost:8080
  s3:
    accessKeyId: seaweedfsadmin
    secretAccessKey: seaweedfsadmin
    importBucket: dbrepo-upload
    exportBucket: dbrepo-download
    filePath: /tmp
  admin:
    username: admin
    password: admin
  jwt:
    public_key: 
  keycloak:
    username: fda
    password: fda
    client: dbrepo-client
    clientSecret: MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG
