# enable local spring profile
spring.profiles.active=local,junit

# disable discovery
spring.cloud.discovery.enabled=false

# disable cloud config and config discovery
spring.cloud.config.discovery.enabled=false
spring.cloud.config.enabled=false

# very short for testing
dbrepo.credentialCacheTimeout=3

# internal datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS DBREPO;NON_KEYWORDS=value
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:init/schema.sql
spring.jpa.hibernate.ddl-auto=create

# log
logging.level.at.ac.tuwien.ac.at.ifs.dbrepo.=trace

# rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.virtual-host=dbrepo
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# s3
dbrepo.s3.accessKeyId=minioadmin
dbrepo.s3.secretAccessKey=minioadmin
dbrepo.s3.maxAge=3
