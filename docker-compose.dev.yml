# INFO: This compose file deploys the current local branch and a few official Docker images from a stable, tested master branch
# MODIFIED: 2022-10-19
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  search-service-data:
  broker-service-data:

networks:
  core:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  userdb:
    name: userdb
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  public:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

services:

  discovery-service:
    restart: on-failure
    container_name: dbrepo-discovery-service
    hostname: discovery-service
    image: fda-discovery-service
    build: ./fda-discovery-service
    networks:
      core:
    ports:
      - "9090:9090"
    env_file:
      - .env
    logging:
      driver: json-file

  gateway-service:
    restart: on-failure
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: fda-gateway-service
    build: ./fda-gateway-service
    networks:
      core:
    ports:
      - "9095:9095"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  database-service:
    restart: on-failure
    container_name: dbrepo-database-service
    hostname: database-service
    image: fda-database-service
    build: ./fda-database-service
    networks:
      userdb:
      core:
    ports:
      - "9092:9092"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      container-service:
        condition: service_healthy
      broker-service:
        condition: service_started
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  container-service:
    restart: on-failure
    container_name: dbrepo-container-service
    hostname: container-service
    image: fda-container-service
    build: ./fda-container-service
    networks:
      core:
    ports:
      - "9091:9091"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  authentication-service:
    restart: on-failure
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: fda-authentication-service
    build: ./fda-authentication-service
    networks:
      core:
    ports:
      - "9097:9097"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
      broker-service:
        condition: service_started
      metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  query-service:
    restart: on-failure
    container_name: dbrepo-query-service
    hostname: query-service
    image: fda-query-service
    build: ./fda-query-service
    networks:
      core:
      userdb:
    ports:
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      table-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  table-service:
    restart: on-failure
    container_name: dbrepo-table-service
    hostname: table-service
    image: fda-table-service
    build: ./fda-table-service
    networks:
      core:
      userdb:
    ports:
      - "9094:9094"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      authentication-service:
        condition: service_healthy
      search-service:
        condition: service_started
      broker-service:
        condition: service_started
    logging:
      driver: json-file

  identifier-service:
    restart: on-failure
    container_name: dbrepo-identifier-service
    hostname: identifier-service
    image: fda-identifier-service
    build: ./fda-identifier-service
    networks:
      core:
    ports:
      - "9096:9096"
    env_file:
      - .env
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    depends_on:
      query-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-metadata-service:
    restart: on-failure
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    build: ./fda-metadata-service
    image: fda-metadata-service
    networks:
      core:
    env_file:
      - .env
    ports:
      - "9100:9100"
    depends_on:
      metadata-db:
        condition: service_started
    logging:
      driver: json-file

  analyse-service:
    restart: on-failure
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    image: fda-analyse-service
    build: ./fda-analyse-service
    networks:
      core:
      userdb:
    command: sh -c "/wait && flask run" # docker-compose should not test the implementation
    ports:
      - "5000:5000"
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  units-service:
    restart: on-failure
    container_name: dbrepo-units-service
    hostname: units-service
    image: fda-units-service
    build: ./fda-units-service
    networks:
      core:
    ports:
      - "5010:5010"
    volumes:
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  broker-service:
    restart: on-failure
    container_name: dbrepo-broker-service
    hostname: broker-service
    image: fda-broker-service
    build: ./fda-broker-service
    networks:
      core:
    ports:
      - "5672:5672"
      - "9098:9098"
      - "15672:15672"
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: json-file

  search-service:
    restart: always
    container_name: dbrepo-search-service
    hostname: search-service
    image: elasticsearch:7.13.4
    command: [ "elasticsearch" ]
    networks:
      core:
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - logger.level=WARN
    depends_on:
      discovery-service:
        condition: service_healthy
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - search-service-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  ui:
    restart: on-failure
    container_name: dbrepo-ui
    hostname: ui
    image: fda-ui
    build: ./fda-ui
    networks:
      core:
    volumes:
      - ${SHARED_FILESYSTEM}:/tmp
    env_file:
      - .env
    depends_on:
      identifier-service:
        condition: service_healthy
      database-service:
        condition: service_healthy
    logging:
      driver: json-file
