openapi: 3.0.1
info:
  title: Database Repository Metadata Service API
  description: Service that manages the metadata
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.6.2
externalDocs:
  description: Sourcecode Documentation
  url: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/1.6.2/system-services-metadata/
servers:
- url: http://localhost
  description: Development instance
- url: https://test.dbrepo.tuwien.ac.at
  description: Staging instance
paths:
  /api/database:
    get:
      tags:
      - database-endpoint
      summary: List databases
      description: "Lists all databases in the metadata database. Requests with HTTP\
        \ method **GET** return the list of databases, requests with HTTP method **HEAD**\
        \ only the number in the `X-Count` header."
      operationId: list
      parameters:
      - name: internal_name
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: List of databases
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of databases
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseBriefDto"
    post:
      tags:
      - database-endpoint
      summary: Create database
      description: Creates a database in the container with id. Requires roles `create-database`.
      operationId: create_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDatabaseDto"
        required: true
      responses:
        "403":
          description: Database create permission is missing or grant permissions
            at broker service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "423":
          description: Database quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Database create query is malformed or image is not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to save in search service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to fin container/user/database in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "502":
          description: Connection to search service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "201":
          description: Created a new database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseBriefDto"
        "409":
          description: Query store could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    head:
      tags:
      - database-endpoint
      summary: List databases
      description: "Lists all databases in the metadata database. Requests with HTTP\
        \ method **GET** return the list of databases, requests with HTTP method **HEAD**\
        \ only the number in the `X-Count` header."
      operationId: list_1
      parameters:
      - name: internal_name
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: List of databases
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of databases
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseBriefDto"
  /api/database/{databaseId}/access/{userId}:
    get:
      tags:
      - access-endpoint
      summary: Find/Check access
      description: "Finds or checks access of a user with given id to a database with\
        \ given id. Requests with HTTP method **GET** return the access object, requests\
        \ with HTTP method **HEAD** only the status. When the user has at least *READ*\
        \ access, the status 200 is returned, 403 otherwise. Requires role `check-database-access`\
        \ or `check-foreign-database-access`."
      operationId: find
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Found database access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseAccessDto"
        "403":
          description: No access to this database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      tags:
      - access-endpoint
      summary: Modify access
      description: Modifies access of a user with given id to database with given
        id. Requires role `update-database-access`.
      operationId: update_5
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessDto"
        required: true
      responses:
        "403":
          description: Modify access not permitted when no access is granted in the
            first place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "502":
          description: Access could not be updated due to connection error in the
            data service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Access could not be updated in the data service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Modified access
        "404":
          description: Database or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Modify access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    post:
      tags:
      - access-endpoint
      summary: Give access
      description: Give a user with given id access to some database with given id.
        Requires role `create-database-access`.
      operationId: create_8
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessDto"
        required: true
      responses:
        "502":
          description: Access could not be created due to connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Access could not be created in the data service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Granting access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Failed giving access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Database or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Granting access succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseAccessDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - access-endpoint
      summary: Delete access
      description: Delete access of a user with id to a database with id. Requires
        role `delete-database-access`.
      operationId: revoke
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "502":
          description: Access could not be created due to connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Revoke of access not permitted as no access was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Deleted access
        "400":
          description: Modify access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: "User, database with access was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Access could not be revoked in the data service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    head:
      tags:
      - access-endpoint
      summary: Find/Check access
      description: "Finds or checks access of a user with given id to a database with\
        \ given id. Requests with HTTP method **GET** return the access object, requests\
        \ with HTTP method **HEAD** only the status. When the user has at least *READ*\
        \ access, the status 200 is returned, 403 otherwise. Requires role `check-database-access`\
        \ or `check-foreign-database-access`."
      operationId: find_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Found database access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseAccessDto"
        "403":
          description: No access to this database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/user/{userId}:
    get:
      tags:
      - user-endpoint
      summary: Get user
      description: Gets own user information from the metadata database. Requires
        authentication. Foreign user information can only be obtained if additional
        role `find-foreign-user` is present. Finding information about internal users
        results in a 404 error.
      operationId: find_2
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: User was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Found user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "403":
          description: Find user is not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      tags:
      - user-endpoint
      summary: Update user
      description: Updates user with id. Requires role `modify-user-information`.
      operationId: modify
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateDto"
        required: true
      responses:
        "202":
          description: Modified user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "403":
          description: Not allowed to modify user metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Modify user query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/user/{userId}/password:
    put:
      tags:
      - user-endpoint
      summary: Update user password
      description: Updates password of user with id. Requires authentication.
      operationId: password
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPasswordDto"
        required: true
      responses:
        "400":
          description: Invalid password payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Modified user password
        "403":
          description: Not allowed to change foreign user password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to get user in auth service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "502":
          description: Connection to auth service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/user/token:
    put:
      tags:
      - user-endpoint
      summary: Refresh token
      description: Refreshes user token by refresh token.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequestDto"
        required: true
      responses:
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Refreshed user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDto"
        "502":
          description: Connection to auth service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
    post:
      tags:
      - user-endpoint
      summary: Create token
      description: Creates a user token via the Auth Service.
      operationId: getToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
        required: true
      responses:
        "404":
          description: Failed to find user in auth database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "428":
          description: Account is not fully setup in auth service (requires password
            change?)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Obtained user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDto"
        "403":
          description: Not allowed to get token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to get user in auth service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "502":
          description: Connection to auth service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
  /api/ontology/{ontologyId}:
    get:
      tags:
      - ontology-endpoint
      summary: Find ontology
      description: Finds an ontology with id in the metadata database.
      operationId: find_3
      parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Find one ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyDto"
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
    put:
      tags:
      - ontology-endpoint
      summary: Update ontology
      description: Updates an ontology with id. Requires role `update-ontology`.
      operationId: update
      parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OntologyModifyDto"
        required: true
      responses:
        "202":
          description: Updated ontology successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyDto"
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - ontology-endpoint
      summary: Delete ontology
      description: Deletes an ontology with given id. Requires role `delete-ontology`.
      operationId: delete
      parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Deleted ontology successfully
          content:
            application/json: {}
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/message/{messageId}:
    put:
      tags:
      - message-endpoint
      summary: Update message
      description: Updates a message with id. Requires role `update-maintenance-message`.
      operationId: update_1
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerMessageUpdateDto"
        required: true
      responses:
        "202":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerMessageBriefDto"
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - message-endpoint
      summary: Delete message
      description: Deletes a message with id. Requires role `delete-maintenance-message`.
      operationId: delete_1
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Deleted message
          content:
            application/json: {}
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/image/{imageId}:
    get:
      tags:
      - image-endpoint
      summary: Find image
      description: Finds a container image in the metadata database.
      operationId: findById
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDto"
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
    put:
      tags:
      - image-endpoint
      summary: Update image
      description: Updates container image in the metadata database. Requires role
        `modify-image`.
      operationId: update_2
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageChangeDto"
        required: true
      responses:
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Updated image successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - image-endpoint
      summary: Delete image
      description: Deletes a container image in the metadata database. Requires role
        `delete-image`.
      operationId: delete_2
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Deleted image successfully
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/identifier/{identifierId}:
    get:
      tags:
      - identifier-endpoint
      summary: Find identifier
      description: Finds an identifier with id. The response format depends on the
        HTTP `Accept` header set on the request.
      operationId: find_6
      parameters:
      - name: identifierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      responses:
        "410":
          description: Failed to retrieve from S3 endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "502":
          description: Connection to data service failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to find in data service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Found identifier successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierDto"
            application/ld+json:
              schema:
                $ref: "#/components/schemas/LdDatasetDto"
            text/csv: {}
            text/xml: {}
            text/bibliography: {}
            text/bibliography; style=apa: {}
            text/bibliography; style=ieee: {}
            text/bibliography; style=bibtex: {}
        "400":
          description: "Identifier could not be exported, the requested style is not\
            \ known"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "409":
          description: Exported resource was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Identifier could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "406":
          description: Failed to find acceptable representation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
    put:
      tags:
      - identifier-endpoint
      summary: Save identifier
      description: Saves an identifier with id as a draft identifier. Identifiers
        can only be created for objects the user has at least *READ* access in the
        associated database (requires role `create-identifier`) or for any object
        in any database (requires role `create-foreign-identifier`).
      operationId: save
      parameters:
      - name: identifierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
