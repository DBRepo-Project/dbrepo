openapi: 3.0.1
info:
  title: Database Repository Data Service API
  description: Service that manages the data
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.6.2
externalDocs:
  description: Sourcecode Documentation
  url: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/1.6.2/system-services-metadata/
servers:
- url: http://localhost
  description: Development instance
- url: https://test.dbrepo.tuwien.ac.at
  description: Staging instance
paths:
  /api/database/{databaseId}/view/{viewId}/data:
    get:
      tags:
      - view-endpoint
      summary: Get view data
      description: "Gets data from a view of a database. For private databases, the\
        \ user needs at least *READ* access to the associated database. Requires role\
        \ `view-database-view-data`."
      operationId: getData
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: viewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "400":
          description: Request pagination is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Not allowed to retrieve view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Retrieved view data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        "409":
          description: View schema could not be mapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find view in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
    head:
      tags:
      - view-endpoint
      summary: Get view data
      description: "Gets data from a view of a database. For private databases, the\
        \ user needs at least *READ* access to the associated database. Requires role\
        \ `view-database-view-data`."
      operationId: getData_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: viewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "400":
          description: Request pagination is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Not allowed to retrieve view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Retrieved view data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        "409":
          description: View schema could not be mapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find view in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}/data:
    get:
      tags:
      - table-endpoint
      summary: Get table data
      description: "Gets data from a table with id. For a table in a private database,\
        \ the user needs to have at least *READ* access to the associated database.\
        \ Requests with HTTP method **GET** return the full dataset, requests with\
        \ HTTP method **HEAD** only the number of tuples in the `X-Count` header."
      operationId: getData_2
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Get table data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Not allowed to get table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
    put:
      tags:
      - table-endpoint
      summary: Update tuple
      description: "Updates a data tuple into a table, then the table statistics are\
        \ updated. The user needs to have at least *WRITE_OWN* access to the associated\
        \ database. Requires role `insert-table-data`."
      operationId: updateRawTuple
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TupleUpdateDto"
        required: true
      responses:
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Updated table data
        "403":
          description: Update table data not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      tags:
      - table-endpoint
      summary: Insert tuple
      description: "Inserts a data tuple into a table, then the table statistics are\
        \ updated. The user needs to have at least *WRITE_OWN* access to the associated\
        \ database. Requires role `insert-table-data`."
      operationId: insertRawTuple
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TupleDto"
        required: true
      responses:
        "503":
          description: Failed to establish connection with the metadata service or
            storage service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Create table data not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "201":
          description: Created table data
        "404":
          description: Failed to find table in metadata database or blob in storage
            service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
    delete:
      tags:
      - table-endpoint
      summary: Delete tuple
      description: "Deletes a data tuple into a table, then the table statistics are\
        \ updated. The user needs to have at least *WRITE_OWN* access to the associated\
        \ database. Requires role `delete-table-data`."
      operationId: deleteRawTuple
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TupleDeleteDto"
        required: true
      responses:
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Delete table data not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Deleted table data
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
    head:
      tags:
      - table-endpoint
      summary: Get table data
      description: "Gets data from a table with id. For a table in a private database,\
        \ the user needs to have at least *READ* access to the associated database.\
        \ Requests with HTTP method **GET** return the full dataset, requests with\
        \ HTTP method **HEAD** only the number of tuples in the `X-Count` header."
      operationId: getData_3
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Get table data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Not allowed to get table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/subset/{subsetId}/data:
    get:
      tags:
      - subset-endpoint
      summary: Get subset data
      description: "Gets data of subset with id. For private databases, the user needs\
        \ at least *READ* access to the associated database. Requests with HTTP method\
        \ **GET** return the subset dataset, requests with HTTP method **HEAD** only\
        \ the number of rows in the subset dataset in the `X-Count` header"
      operationId: getData_4
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subsetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Failed to find database in metadata database or query in query
            store of the data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Not allowed to retrieve subset data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Retrieved subset data
          headers:
            Access-Control-Expose-Headers:
              description: Reverse proxy exposing of custom headers
              required: true
              style: simple
            X-Count:
              description: Number of rows
              style: simple
            X-Id:
              description: The subset id
              required: true
              style: simple
            X-Headers:
              description: The list of headers separated by comma
              style: simple
          content:
            application/json:
              schema:
                type: string
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
    head:
      tags:
      - subset-endpoint
      summary: Get subset data
      description: "Gets data of subset with id. For private databases, the user needs\
        \ at least *READ* access to the associated database. Requests with HTTP method\
        \ **GET** return the subset dataset, requests with HTTP method **HEAD** only\
        \ the number of rows in the subset dataset in the `X-Count` header"
      operationId: getData_5
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subsetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Failed to find database in metadata database or query in query
            store of the data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Not allowed to retrieve subset data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Retrieved subset data
          headers:
            Access-Control-Expose-Headers:
              description: Reverse proxy exposing of custom headers
              required: true
              style: simple
            X-Count:
              description: Number of rows
              style: simple
            X-Id:
              description: The subset id
              required: true
              style: simple
            X-Headers:
              description: The list of headers separated by comma
              style: simple
          content:
            application/json:
              schema:
                type: string
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/database/{databaseId}/subset/{queryId}:
    put:
      tags:
      - subset-endpoint
      summary: Persist subset
      description: Persists a subset with id. Requires role `persist-query`.
      operationId: persist
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: queryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryPersistDto"
        required: true
      responses:
        "404":
          description: Failed to find database in metadata database or query in query
            store of the data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "202":
          description: Persisted subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryDto"
        "403":
          description: Not allowed to persist subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Malformed select query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "417":
          description: Failed to persist subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/database/{databaseId}/table/{tableId}/data/import:
    post:
      tags:
      - table-endpoint
      summary: Import dataset
      description: Imports a dataset in a table. Then update the table statistics.
        The user needs to have at least *WRITE_OWN* access to the associated database
        when importing into a owned table. Otherwise *WRITE_ALL* access in needed.
        Requires role `insert-table-data`.
      operationId: importDataset
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportDto"
        required: true
      responses:
        "202":
          description: Imported dataset successfully
        "403":
          description: Import table dataset not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Dataset and/or query are malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/subset:
    get:
      tags:
      - subset-endpoint
      summary: Find subsets
      description: "Finds subsets in the query store. When the database schema is\
        \ marked as hidden, the user needs to be authorized, have at least read-access\
        \ to the database. The result can be optionally filtered by setting `persisted`.\
        \ When set to *true*, only persisted queries are returned, otherwise only\
        \ non-persisted queries are returned."
      operationId: list
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: persisted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "403":
          description: Not allowed to find subsets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find database in metadata database or query in query
            store of the data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Found subsets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueryDto"
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      tags:
      - subset-endpoint
      summary: Create subset
      description: Creates a subset in the query store of the data database. Can also
        be used without authentication if (and only if) the database is marked as
        public (i.e. when `is_public` = `is_schema_public` is set to `true`). Otherwise
        at least read access is required.
      operationId: create
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteStatementDto"
        required: true
      responses:
        "404":
          description: Failed to find database in metadata database or query in query
            store of the data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Malformed select query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "501":
          description: Failed to execute query as it contains non-supported keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "417":
          description: Failed to insert query into query store of data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "201":
          description: Created subset
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Not allowed to find subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/view/{viewId}/export:
    get:
      tags:
      - view-endpoint
      summary: Get view data
      description: "Gets data from view with id as downloadable file. For tables in\
        \ private databases, the user needs to have at least *READ* access to the\
        \ associated database."
      operationId: exportDataset
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: viewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "403":
          description: Export view data not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Request pagination or view data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Exported view data
          content:
            application/json:
              schema:
                type: string
                format: binary
        "404":
          description: Failed to find view in metadata database or export dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}/history:
    get:
      tags:
      - table-endpoint
      summary: Get history
      description: "Gets the insert/delete operations history performed. For tables\
        \ in private databases, the user needs to have at least *READ* access to the\
        \ associated database."
      operationId: getHistory
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: "Invalid pagination size request, must be > 0"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Find table history not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Found table history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableHistoryDto"
        "404":
          description: Failed to find table history in data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}/export:
    get:
      tags:
      - table-endpoint
      summary: Get table data
      description: "Gets data from table with id as downloadable file. For tables\
        \ in private databases, the user needs to have at least *READ* access to the\
        \ associated database."
      operationId: exportDataset_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "403":
          description: Export table data not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "200":
          description: Exported table data
          content:
            application/json:
              schema:
                type: string
                format: binary
        "400":
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/subset/{subsetId}:
    get:
      tags:
      - subset-endpoint
      summary: Find subset
      description: "Finds a subset in the data database.  When the database schema\
        \ is marked as hidden, the user needs to be authorized, have at least read-access\
        \ to the database.  Requests with HTTP header `Accept=application/json` return\
        \ the metadata, requests with HTTP header `Accept=text/csv` return the data\
        \ as downloadable file."
      operationId: findById
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subsetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Found subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryDto"
            text/csv: {}
        "404":
          description: Failed to find database in metadata database or query in query
            store of the data database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "400":
          description: Malformed select query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "403":
          description: Not allowed to find subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "406":
          description: Failed to find acceptable representation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      security:
      - basicAuth: []
      - bearerAuth: []
