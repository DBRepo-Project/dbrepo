              schema:
                properties:
                  results:
                    items:
                      type: object
                    type: array
                  type:
                    description: Same as the requested type
                    enum:
                      - database
                      - table
                      - view
                      - column
                      - user
                      - identifier
                      - concept
                      - unit
                    type: string
                type: object
          description: 'OK, contains the elements formatted as an array of JSON arrays'
