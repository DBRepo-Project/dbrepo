      tags:
        - search-endpoint
components:
  securitySchemes:
    basicAuth:
      in: header
      scheme: basic
      type: http
    bearerAuth:
      bearerFormat: JWT
      in: header
      scheme: bearer
      type: http
  schemas:
    AnalysisDto:
      properties:
        columns:
          items:
            properties:
              column_name:
                $ref: '#/components/schemas/ColumnAnalysisDto'
          type: array
        line_termination:
          example: "\r\n"
          type: string
        separator:
          example: ','
          type: string
      type: object
    ColumnAnalysisDto:
      properties:
        d:
          example: 4
          type: integer
        dfid:
          example: null
          type: integer
        enums:
          example: null
          properties:
            type: string
          type: array
        null_allowed:
          type: boolean
        sets:
          example: null
          properties:
            type: string
          type: array
        size:
          example: 10
          type: integer
        type:
          example: decimal
          type: string
      type: object
    ErrorDto:
      properties:
        message:
          example: Message
          type: string
        success:
          example: false
          type: boolean
      type: object
    KeysDto:
      properties:
        keys:
          items:
            properties:
              column_name:
                format: int64
                type: integer
          type: array
      required:
        - keys
      type: object
    ApiErrorDto:
      required:
        - code
        - message
