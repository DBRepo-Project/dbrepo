      operationId: find_4
      parameters:
        - name: ontologyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: label
          in: query
          required: false
          schema:
            type: string
        - name: uri
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Found entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityDto'
        '400':
          description: Filter params are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '417':
          description: Generated query or uri is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '422':
          description: Ontology does not have rdf or sparql endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/oai:
    get:
      tags:
        - metadata-endpoint
      summary: Get record
      operationId: identify_1_1_1_1
      parameters:
        - name: verb
          in: query
        - name: parameters
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OaiListIdentifiersParameters'
      responses:
        '200':
          description: List containers
          content:
            text/xml: {}
  '/api/message/message/{messageId}':
    get:
      tags:
        - message-endpoint
      summary: Find message
      description: Finds a message with id in the metadata database.
      operationId: find_5
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Get messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageDto'
        '404':
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
  /api/license:
    get:
      tags:
        - license-endpoint
      summary: List licenses
      description: Lists licenses known to the metadata database.
      operationId: list_3
      responses:
        '200':
          description: List of licenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LicenseDto'
  /api/identifier/retrieve:
    get:
      tags:
        - identifier-endpoint
      summary: Retrieve PID metadata
      description: >-
        Retrieves Persistent Identifier (PID) metadata from external endpoints.
        Supported PIDs are: ORCID, ROR, DOI.
      operationId: retrieve
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retrieved metadata from identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
        '404':
          description: Failed to find metadata for identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
  '/api/database/{databaseId}':
    get:
      tags:
        - database-endpoint
      summary: Find database
      description: Finds a database with id.
      operationId: findById_1
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Database found successfully
          headers:
            X-Username:
              description: The authentication username
              style: simple
            Access-Control-Expose-Headers:
              description: Expose custom headers
              style: simple
            X-Password:
              description: The authentication password
              style: simple
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBriefDto'
        '403':
          description: Not allowed to view database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: 'Database, user or exchange could not be found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '502':
          description: Connection to the broker service could not be established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to find queue information in broker service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  '/api/database/{databaseId}/table/{tableId}/suggest':
    get:
      tags:
        - table-endpoint
      summary: Suggest semantics
      description: >-
        Suggests semantic concepts for a table. This action can only be
        performed by the table owner. Requires role `table-semantic-analyse`.
      operationId: analyseTable
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Suggested table semantics successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityDto'
        '400':
          description: Failed to parse statistic in search service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not the table owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find database/table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '417':
          description: Generated query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '422':
          description: Ontology does not have rdf or sparql endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  '/api/database/{databaseId}/table/{tableId}/column/{columnId}/suggest':
    get:
      tags:
        - table-endpoint
      summary: Suggest semantics
      description: Suggests column semantics. Requires role `table-semantic-analyse`.
      operationId: analyseTableColumn
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: columnId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Suggested table column semantics successfully
