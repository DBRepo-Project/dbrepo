  '/api/container/{containerId}':
    get:
      tags:
        - container-endpoint
      summary: Find container
      description: Finds a container in the metadata database.
      operationId: findById_3
      parameters:
        - name: containerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Found container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDto'
        '404':
          description: Container image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    delete:
      tags:
        - container-endpoint
      summary: Delete container
      description: >-
        Deletes a container in the metadata database. Requires role
        `delete-container`.
      operationId: delete_6
      parameters:
        - name: containerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '202':
