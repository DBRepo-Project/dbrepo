      tags:
        - search-endpoint
  '/api/search/{field_type}/fields':
    get:
      operationId: get_fields
      parameters:
        - description: The search type.
          in: path
          name: type
          required: true
          schema:
            enum:
              - database
              - table
              - view
              - column
              - user
              - identifier
              - concept
              - unit
