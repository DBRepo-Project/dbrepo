openapi: 3.0.3
info:
  contact:
    email: andreas.rauber@tuwien.ac.at
    name: Prof. Andreas Rauber
  description: >
    The merged REST API of DBRepo for users, developers and data stewards to be
    accessed publicly. Have a look at

    the [source
    code](https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services)
    for non-public endpoints

    that are used between the services themselves.
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  title: DBRepo REST API
  version: 1.6.1
servers:
  - description: Test Instance
    url: 'https://test.dbrepo.tuwien.ac.at'
  - description: Local Instance
    url: 'http://localhost'
externalDocs:
  description: Project Website
  url: 'https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/1.6/'
paths:
  /api/analyse/datatypes:
    get:
      consumes:
        - application/json
      description: >-
        Determines MySQL 8 datatypes of a given dataset. Requires role
        `table-semantic-analyse`.
      operationId: analyse_datatypes
      parameters:
        - example: filename_s3_key
          in: query
          name: filename
          required: true
          schema:
            type: string
        - example: ','
          in: query
          name: separator
          required: true
          schema:
            type: string
        - example: 'false'
          in: query
          name: enum
          required: false
          schema:
            type: boolean
        - example: '2.5'
          in: query
          name: enum_tol
          required: false
          schema:
            type: float
      produces:
        - application/json
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDto'
          description: Determined data types successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to determine data types
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to find file in Storage Service
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Unexpected system error
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Determine datatypes
      tags:
        - analyse-endpoint
  /api/analyse/keys:
    get:
      consumes:
        - application/json
      description: >-
        Determines primary keys of a given dataset. Requires role
        `table-semantic-analyse`.
      operationId: analyse_keys
      parameters:
        - example: filename_s3_key
          in: query
          name: filename
          required: true
          schema:
            type: string
        - example: ','
          in: query
          name: separator
          required: true
          schema:
            type: string
      produces:
        - application/json
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeysDto'
          description: Determined keys successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to determine keys
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to find file in Storage Service or is empty
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Unexpected system error
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Determine keys
      tags:
        - analyse-endpoint
  '/api/database/{databaseId}/view/{viewId}/data':
    get:
      tags:
        - view-endpoint
      summary: Get view data
      description: >-
        Gets data from a view of a database. For private databases, the user
        needs at least *READ* access to the associated database. Requires role
        `view-database-view-data`.
      operationId: getData
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: viewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Retrieved view data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Request pagination is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to retrieve view data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find view in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: View schema could not be mapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
    head:
      tags:
        - view-endpoint
      summary: Get view data
      description: >-
        Gets data from a view of a database. For private databases, the user
        needs at least *READ* access to the associated database. Requires role
        `view-database-view-data`.
      operationId: getData_1
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: viewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Retrieved view data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Request pagination is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to retrieve view data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find view in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '409':
          description: View schema could not be mapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
  '/api/database/{databaseId}/table/{tableId}/data':
    get:
      tags:
        - table-endpoint
      summary: Get table data
      description: >-
        Gets data from a table with id. For a table in a private database, the
        user needs to have at least *READ* access to the associated database.
        Requests with HTTP method **GET** return the full dataset, requests with
        HTTP method **HEAD** only the number of tuples in the `X-Count` header.
      operationId: getData_2
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Get table data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to get table data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
    put:
      tags:
        - table-endpoint
      summary: Update tuple
      description: >-
        Updates a data tuple into a table, then the table statistics are
        updated. The user needs to have at least *WRITE_OWN* access to the
        associated database. Requires role `insert-table-data`.
      operationId: updateRawTuple
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TupleUpdateDto'
        required: true
      responses:
        '202':
          description: Updated table data
        '400':
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Update table data not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
    post:
      tags:
        - table-endpoint
      summary: Insert tuple
      description: >-
        Inserts a data tuple into a table, then the table statistics are
        updated. The user needs to have at least *WRITE_OWN* access to the
        associated database. Requires role `insert-table-data`.
      operationId: insertRawTuple
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TupleDto'
        required: true
      responses:
        '201':
          description: Created table data
        '400':
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Create table data not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find table in metadata database or blob in storage service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: >-
            Failed to establish connection with the metadata service or storage
            service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
    delete:
      tags:
        - table-endpoint
      summary: Delete tuple
      description: >-
        Deletes a data tuple into a table, then the table statistics are
        updated. The user needs to have at least *WRITE_OWN* access to the
        associated database. Requires role `delete-table-data`.
      operationId: deleteRawTuple
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TupleDeleteDto'
        required: true
      responses:
        '202':
          description: Deleted table data
        '400':
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Delete table data not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
    head:
      tags:
        - table-endpoint
      summary: Get table data
      description: >-
        Gets data from a table with id. For a table in a private database, the
        user needs to have at least *READ* access to the associated database.
        Requests with HTTP method **GET** return the full dataset, requests with
        HTTP method **HEAD** only the number of tuples in the `X-Count` header.
      operationId: getData_3
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Get table data
          headers:
            Access-Control-Expose-Headers:
              description: Expose `X-Count` custom header
              required: true
              style: simple
            X-Count:
              description: Number of rows
              required: true
              style: simple
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Request pagination or table data select query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to get table data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
  '/api/database/{databaseId}/subset/{subsetId}/data':
    get:
      tags:
        - subset-endpoint
      summary: Get subset data
      description: >-
        Gets data of subset with id. For private databases, the user needs at
        least *READ* access to the associated database. Requests with HTTP
        method **GET** return the subset dataset, requests with HTTP method
        **HEAD** only the number of rows in the subset dataset in the `X-Count`
        header
      operationId: getData_4
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: subsetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Retrieved subset data
          headers:
            Access-Control-Expose-Headers:
              description: Reverse proxy exposing of custom headers
              required: true
              style: simple
            X-Count:
              description: Number of rows
              style: simple
            X-Id:
              description: The subset id
              required: true
              style: simple
            X-Headers:
              description: The list of headers separated by comma
              style: simple
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to retrieve subset data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: >-
            Failed to find database in metadata database or query in query store
            of the data database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
    head:
      tags:
        - subset-endpoint
      summary: Get subset data
      description: >-
        Gets data of subset with id. For private databases, the user needs at
        least *READ* access to the associated database. Requests with HTTP
        method **GET** return the subset dataset, requests with HTTP method
        **HEAD** only the number of rows in the subset dataset in the `X-Count`
        header
      operationId: getData_5
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: subsetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Retrieved subset data
          headers:
            Access-Control-Expose-Headers:
              description: Reverse proxy exposing of custom headers
              required: true
              style: simple
            X-Count:
              description: Number of rows
              style: simple
            X-Id:
              description: The subset id
              required: true
              style: simple
            X-Headers:
              description: The list of headers separated by comma
              style: simple
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to retrieve subset data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: >-
            Failed to find database in metadata database or query in query store
            of the data database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  '/api/database/{databaseId}/subset/{queryId}':
    put:
      tags:
        - subset-endpoint
      summary: Persist subset
      description: Persists a subset with id. Requires role `persist-query`.
      operationId: persist
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: queryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryPersistDto'
        required: true
      responses:
        '202':
          description: Persisted subset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryDto'
        '400':
          description: Malformed select query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Not allowed to persist subset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: >-
            Failed to find database in metadata database or query in query store
            of the data database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '417':
          description: Failed to persist subset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  '/api/database/{databaseId}/table/{tableId}/data/import':
    post:
      tags:
        - table-endpoint
      summary: Import dataset
      description: >-
        Imports a dataset in a table. Then update the table statistics. The user
        needs to have at least *WRITE_OWN* access to the associated database
        when importing into a owned table. Otherwise *WRITE_ALL* access in
        needed. Requires role `insert-table-data`.
      operationId: importDataset
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDto'
        required: true
      responses:
        '202':
          description: Imported dataset successfully
        '400':
          description: Dataset and/or query are malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '403':
          description: Import table dataset not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '404':
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        '503':
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
        - bearerAuth: []
  '/api/database/{databaseId}/subset':
    get:
      tags:
        - subset-endpoint
      summary: Find subsets
      description: >-
        Finds subsets in the query store. When the database schema is marked as
        hidden, the user needs to be authorized, have at least read-access to
        the database. The result can be optionally filtered by setting
        `persisted`. When set to *true*, only persisted queries are returned,
        otherwise only non-persisted queries are returned.
      operationId: list
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: persisted
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Found subsets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryDto'
        '403':
