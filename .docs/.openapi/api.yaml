        - documentation
        - is_buildable
        - is_quoted
        - value
      type: object
      properties:
        value:
          type: string
          example: time
        documentation:
          type: string
          example: 'https://mariadb.com/kb/en/time/'
        display_name:
          type: string
          example: TIME(fsp)
        size_min:
          type: integer
          format: int32
          example: 0
        size_max:
          type: integer
          format: int32
          example: 6
        size_default:
          type: integer
          format: int32
          example: 0
        size_required:
          type: boolean
          example: false
        d_min:
          type: integer
          format: int32
        d_max:
          type: integer
          format: int32
        d_default:
          type: integer
          format: int32
        d_required:
          type: boolean
        data_hint:
          type: string
          example: 'e.g. HH:MM:SS, HH:MM, HHMMSS, H:M:S'
        type_hint:
          type: string
          example: 'fsp=microsecond precision, min. 0, max. 6'
