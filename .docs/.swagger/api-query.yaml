openapi: 3.0.1
info:
  title: Database Repository Query Service API
  description: Service that manages the queries
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.2.0
externalDocs:
  description: Sourcecode Documentation
  url: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services
servers:
- url: http://localhost:9093
  description: Generated server url
- url: https://dbrepo2.tuwien.ac.at
  description: Sandbox
paths:
  /api/container/{id}/database/{databaseId}/table/{tableId}/history:
    get:
      tags:
      - table-history-endpoint
      summary: Find all history
      operationId: getAll
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "405":
          description: Find table history is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Find table history successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableHistoryDto'
        "404":
          description: "Table, database or user could not be found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "504":
          description: Query store failed to query table history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Connection to the database failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Table history query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
    head:
      tags:
      - table-history-endpoint
      summary: Find all history
      operationId: getAll_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "405":
          description: Find table history is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Find table history successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableHistoryDto'
        "404":
          description: "Table, database or user could not be found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "504":
          description: Query store failed to query table history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Connection to the database failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Table history query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
