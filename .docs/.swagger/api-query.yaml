  /api/container/{id}/database/{databaseId}/query/{queryId}:
    get:
      tags:
      - store-endpoint
      summary: Find some query
      operationId: find_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: queryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: List queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryDto'
        "404":
          description: "Database, query or user could not be found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Find query is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "501":
          description: Image is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "504":
          description: Query store failed to select query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Connection to the database failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
    put:
      tags:
      - store-endpoint
      summary: Persist some query
      operationId: persist
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: queryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: "Database, query or user could not be found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "501":
          description: Image is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Persist query successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryDto'
        "405":
          description: Persist query is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "504":
          description: Query store failed to persist query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Query is already persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
