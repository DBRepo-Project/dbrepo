      security:
      - bearerAuth: []
    post:
      tags:
      - query-endpoint
      summary: Execute query
      operationId: execute
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sortDirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: sortColumn
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteStatementDto'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - bearerAuth: []
