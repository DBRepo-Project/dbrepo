          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreateDto'
        required: true
      responses:
        "401":
          description: Credentials missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Database or user could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Create view is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Credentials missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "201":
          description: Create view successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewBriefDto'
        "423":
          description: Create view resulted in an invalid query statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
