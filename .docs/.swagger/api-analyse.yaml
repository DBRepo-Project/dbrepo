components:
  securitySchemes:
    basicAuth:
      in: header
      scheme: basic
      type: http
    bearerAuth:
      bearerFormat: JWT
      in: header
      scheme: bearer
      type: http
externalDocs:
  description: Sourcecode Documentation
  url: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/__APPVERSION__/
info:
  contact:
    email: andreas.rauber@tuwien.ac.at
    name: Prof. Andreas Rauber
  description: Service that analyses data structures
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Database Repository Analyse Service API
  version: __APPVERSION__
openapi: 3.0.0
paths:
  /api/analyse/database/{database_id}/table/{table_id}/statistics:
    get:
      operationId: analyse_table_stat
      parameters:
        - example: 1
          in: path
          name: database_id
          required: true
          schema:
            format: int64
            type: integer
        - example: 1
          in: path
          name: table_id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableStats'
          description: Determined statistics
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Missing parameters
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Table not found
      security:
        - bearerAuth: []
        - basicAuth: []
      summary: Determine table statistics
      tags:
        - analyse-endpoint
  /api/analyse/datatypes:
    get:
      consumes:
        - application/json
      description: This is a simple API which returns the datatypes of a (path) csv
        file
      operationId: analyse_datatypes
      parameters:
        - example: filename_s3_key
          in: query
          name: filename
          required: true
          schema:
            type: string
        - example: ','
          in: query
          name: separator
          required: true
          schema:
            type: string
        - example: 'false'
          in: query
          name: enum
          required: false
          schema:
            type: boolean
        - example: '2.5'
          in: query
          name: enum_tol
          required: false
          schema:
            type: float
      produces:
        - application/json
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataTypesDto'
          description: Determined data types successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to determine data types
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to find file in Storage Service
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Unexpected system error
      summary: Determine datatypes
      tags:
        - analyse-endpoint
  /api/analyse/keys:
    get:
      consumes:
        - application/json
      description: This is a simple API which returns the primary keys + ranking of
        a (path) csv file
      operationId: analyse_keys
      parameters:
        - example: filename_s3_key
          in: query
          name: filename
          required: true
          schema:
            type: string
        - example: ','
          in: query
          name: separator
          required: true
          schema:
            type: string
      produces:
        - application/json
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeysDto'
          description: Determined keys successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to determine keys
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Failed to find file in Storage Service or is empty
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
          description: Unexpected system error
      summary: Determine primary keys
      tags:
        - analyse-endpoint
  /health:
    get:
      consumes:
        - application/json
      description: This is a simple API which checks if the application is healthy
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            properties:
              status:
                example: UP
                type: string
            type: object
      summary: Check if application is running
      tags:
        - health-endpoint
servers:
  - description: Generated server url
    url: http://localhost:5000
  - description: Sandbox
    url: https://test.dbrepo.tuwien.ac.at
