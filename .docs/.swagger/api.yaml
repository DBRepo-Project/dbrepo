        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
