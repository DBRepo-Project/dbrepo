          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Identifier form contains invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: "Failed to find database, table or view"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Published identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
        "503":
          description: Failed to save in search service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/database/{databaseId}/visibility:
    put:
      tags:
        - database-endpoint
      summary: Update database visibility
      operationId: visibility
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseModifyVisibilityDto'
        required: true
      responses:
        "202":
          description: Visibility modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "403":
          description: Visibility modification is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Connection to search service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Failed to find database in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to save in search service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/database/{databaseId}/table/{tableId}:
    delete:
      tags:
        - table-endpoint
      summary: Delete table
      operationId: delete_1
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Failed to find table in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Deletion query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
  /api/database/{databaseId}/table/{tableId}/column/{columnId}:
