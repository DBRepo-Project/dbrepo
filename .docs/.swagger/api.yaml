components:
  securitySchemes:
    basicAuth:
      in: header
      scheme: basic
      type: http
    bearerAuth:
      bearerFormat: JWT
      in: header
      scheme: bearer
      type: http
externalDocs:
  description: Sourcecode Documentation
  url: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/
info:
  contact:
    email: andreas.rauber@tuwien.ac.at
    name: Prof. Andreas Rauber
  description: The REST API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: DBRepo REST API
  version: 1.4.4
openapi: 3.1.0
servers:
  - description: Test Instance
    url: https://test.dbrepo.tuwien.ac.at
  - description: Local Instance
    url: http://localhost
paths:
  /api/database:
    post:
      tags:
        - database-endpoint
      summary: Create database
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseDto'
        required: true
      responses:
        "201":
          description: Created a database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "400":
          description: Database create query is malformed or image is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "417":
          description: Failed to create query store in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to communicate with database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Failed to find container in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
  /api/database/{databaseId}/access/{userId}:
    put:
      tags:
        - access-endpoint
      summary: Update access to some database
      operationId: update_1
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseAccessDto'
        required: true
      responses:
        "400":
          description: Update access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "417":
          description: Failed to update access in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to establish connection with metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Not allowed to update access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Update access succeeded
      security:
        - basicAuth: []
    post:
      tags:
        - access-endpoint
      summary: Give access to some database
      operationId: create_4
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseAccessDto'
        required: true
      responses:
        "417":
          description: Failed to give access in the database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Granting access succeeded
          content:
            '*/*':
              schema:
                type: object
        "503":
          description: Failed to establish connection to metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Not allowed to give access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Granting access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - basicAuth: []
    delete:
      tags:
        - access-endpoint
      summary: Revoke access to some database
      operationId: revoke
      parameters:
        - name: databaseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          description: Revoke access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "417":
          description: Failed to revoke access in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Not allowed to revoke access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to establish connection with the metadata service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Revoked access successfully
          content:
            '*/*':
              schema:
                type: object
      security:
        - basicAuth: []
  /api/user/{userId}:
    get:
      tags:
        - user-endpoint
      summary: Get a user info
      operationId: find_2
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "403":
          description: Find user is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Found user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        "404":
          description: User was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
    put:
      tags:
        - user-endpoint
      summary: Modify user information
      operationId: modify
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDto'
        required: true
      responses:
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Not allowed to modify user metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Modify user query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Modified user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/user/{userId}/password:
    put:
      tags:
        - user-endpoint
      summary: Modify user password
      operationId: password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordDto'
        required: true
      responses:
        "403":
          description: Not allowed to change foreign user password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Failed to find database/user in metadata database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to get user in auth service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Modified user password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        "502":
          description: Connection to auth service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/user/token:
    put:
      tags:
        - user-endpoint
      summary: Refresh user token
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestDto'
        required: true
      responses:
        "202":
          description: Refreshed user token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
        "502":
          description: Connection to auth service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    post:
      tags:
        - user-endpoint
      summary: Obtain user token
      operationId: getToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
        required: true
      responses:
        "404":
          description: Failed to find user in auth database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to get user in auth service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Obtained user token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
        "403":
          description: Not allowed to get token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "428":
          description: Account is not fully setup in auth service (requires password change?)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Connection to auth service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
  /api/ontology/{ontologyId}:
    get:
      tags:
        - ontology-endpoint
      summary: Find one ontology
      operationId: find_3
      parameters:
        - name: ontologyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Find one ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyDto'
    put:
      tags:
        - ontology-endpoint
      summary: Update an ontology
      operationId: update
      parameters:
        - name: ontologyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyModifyDto'
        required: true
      responses:
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Updated ontology successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyDto'
      security:
        - bearerAuth: []
        - basicAuth: []
    delete:
      tags:
        - ontology-endpoint
      summary: Delete an ontology
      operationId: delete
      parameters:
        - name: ontologyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted ontology successfully
          content:
            application/json: {}
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/message/{messageId}:
    put:
      tags:
        - message-endpoint
      summary: Update maintenance message
      operationId: update_1
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerMessageUpdateDto'
        required: true
      responses:
        "202":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageBriefDto'
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
    delete:
      tags:
        - message-endpoint
      summary: Delete maintenance message
      operationId: delete_1
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: Deleted message
          content:
            application/json: {}
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/image/{imageId}:
    get:
      tags:
        - image-endpoint
      summary: Find some image
      operationId: findById
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Found image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
    put:
      tags:
        - image-endpoint
      summary: Update some image
      operationId: update_2
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageChangeDto'
        required: true
      responses:
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Updated image successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
      security:
        - bearerAuth: []
        - basicAuth: []
    delete:
      tags:
        - image-endpoint
      summary: Delete some image
      operationId: delete_2
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: Deleted image successfully
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/identifier/{identifierId}:
    get:
      tags:
        - identifier-endpoint
      summary: Find some identifier
      operationId: find_6
      parameters:
        - name: identifierId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Accept
          in: header
          required: true
          schema:
            type: string
      responses:
        "406":
          description: Failed to find acceptable representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "422":
          description: Failed to retrieve from database sidecar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to find in data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Found identifier successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/LdDatasetDto'
            text/csv: {}
            text/xml: {}
            text/bibliography: {}
            text/bibliography; style=apa: {}
            text/bibliography; style=ieee: {}
            text/bibliography; style=bibtex: {}
        "404":
          description: Identifier could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Connection to data service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: "Identifier could not be exported, the requested style is not known"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "410":
          description: Failed to retrieve from S3 endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Exported resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    put:
      tags:
        - identifier-endpoint
      summary: Save identifier
      operationId: save
      parameters:
        - name: identifierId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSaveDto'
        required: true
      responses:
        "403":
          description: Insufficient access rights or authorities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Connection to search service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Creating identifier not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Identifier form contains invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: "Failed to find database, table or view"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Saved identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
        "503":
          description: Failed to save in search service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
    delete:
      tags:
        - identifier-endpoint
      summary: Delete some identifier
      operationId: delete_3
      parameters:
        - name: identifierId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "502":
          description: Connection to search service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Deleting identifier not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Failed to delete in search service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted identifier
          content:
            '*/*':
              schema:
                type: object
        "404":
          description: Identifier or database could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
        - bearerAuth: []
        - basicAuth: []
  /api/identifier/{identifierId}/publish:
    put:
      tags:
        - identifier-endpoint
      summary: Publish identifier
