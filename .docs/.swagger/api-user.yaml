openapi: 3.0.1
info:
  title: Database Repository User Service API
  description: Service that manages the users
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.2.0
externalDocs:
  description: Wiki Documentation
  url: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services/-/wikis
servers:
- url: http://localhost:9098
  description: Generated server url
paths:
  /api/user/{id}:
    get:
      tags:
      - user-endpoint
      summary: Get a user info
      operationId: find
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: User was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Find user is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Found user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
      - bearerAuth: []
    put:
      tags:
      - user-endpoint
      summary: Modify user information
      operationId: modify
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDto'
        required: true
      responses:
        "202":
          description: Modified user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        "405":
          description: Modify user is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: User attribute was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
  /api/user/{id}/theme:
    put:
      tags:
      - user-endpoint
      summary: Modify user theme
      operationId: theme
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserThemeSetDto'
        required: true
      responses:
        "405":
          description: Modify user is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: User or user attribute was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Modified user theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
      - bearerAuth: []
  /api/user/{id}/password:
    put:
      tags:
      - user-endpoint
      summary: Modify user password
      operationId: password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordDto'
        required: true
      responses:
        "404":
          description: User was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Modify user is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Modified user password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
      - bearerAuth: []
  /api/maintenance/message/{id}:
    get:
      tags:
      - maintenance-endpoint
      summary: Find one maintenance message
      operationId: find_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Get messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageDto'
    put:
      tags:
      - maintenance-endpoint
      summary: Update maintenance message
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerMessageUpdateDto'
        required: true
      responses:
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageNotFoundException'
        "202":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageBriefDto'
    delete:
      tags:
      - maintenance-endpoint
      summary: Delete maintenance message
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: Deleted message
          content:
            application/json: {}
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageNotFoundException'
  /api/user:
    get:
      tags:
      - user-endpoint
      summary: Find all users
      operationId: findAll
      responses:
        "200":
          description: List users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBriefDto'
    post:
      tags:
      - user-endpoint
      summary: Create user
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestDto'
        required: true
      responses:
        "409":
          description: User with username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Realm or default role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBriefDto'
        "417":
          description: User with e-mail already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
  /api/maintenance/message:
    get:
      tags:
      - maintenance-endpoint
      summary: Find maintenance messages
      operationId: list
      responses:
        "200":
          description: List messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BannerMessageDto'
    post:
      tags:
      - maintenance-endpoint
      summary: Create maintenance message
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerMessageCreateDto'
        required: true
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageBriefDto'
  /api/maintenance/message/active:
    get:
      tags:
      - maintenance-endpoint
      summary: Find active maintenance messages
      operationId: active
      responses:
        "200":
          description: List messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BannerMessageBriefDto'
components:
  schemas:
    UserUpdateDto:
      type: object
      properties:
        firstname:
          type: string
          example: Josiah
        lastname:
          type: string
          example: Carberry
        affiliation:
          type: string
          example: Brown University
        orcid:
          type: string
          example: 0000-0002-1825-0097
    ColumnBriefDto:
      required:
      - column_type
      - database_id
      - id
      - internal_name
      - name
      - table_id
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: date
        database_id:
          type: integer
          format: int64
        table_id:
          type: integer
          format: int64
        internal_name:
          type: string
          example: mdb_date
        column_type:
          type: string
          example: date
          enum:
          - enum
          - number
          - decimal
          - string
          - text
          - boolean
          - date
          - timestamp
          - blob
    ContainerDto:
      required:
      - created
      - hash
      - id
      - internal_name
      - name
      - running
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
          example: f829dd8a884182d0da846f365dee1221fd16610a14c81b8f9f295ff162749e50
        name:
          type: string
          example: Air Quality
        state:
          type: string
          example: running
          enum:
          - created
          - restarting
          - running
          - paused
          - exited
          - dead
        database:
          $ref: '#/components/schemas/DatabaseDto'
        running:
          type: boolean
          example: true
        image:
          $ref: '#/components/schemas/ImageBriefDto'
        port:
          type: integer
          format: int32
        owner:
          $ref: '#/components/schemas/UserBriefDto'
        created:
          type: string
          format: date-time
          example: 2021-03-12T15:26:21.678396092Z
        internal_name:
          type: string
          example: air-quality
        ip_address:
          type: string
    CreatorDto:
      required:
      - firstname
      - id
      - lastname
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstname:
          type: string
          example: Josiah
        lastname:
          type: string
          example: Carberry
        affiliation:
          type: string
          example: Wesleyan University
        orcid:
          type: string
          example: 0000-0002-1825-0097
    DatabaseAccessDto:
      required:
      - type
      - user
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        type:
          type: string
          enum:
          - read
          - write_own
          - write_all
        created:
          type: string
          format: date-time
    DatabaseDto:
      required:
      - creator
      - exchange_name
      - id
      - internal_name
      - name
      - owner
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Air Quality
        identifier:
          $ref: '#/components/schemas/IdentifierDto'
        description:
          type: string
          example: Weather Australia 2009-2021
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableBriefDto'
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewBriefDto'
        image:
          $ref: '#/components/schemas/ImageDto'
        container:
          $ref: '#/components/schemas/ContainerDto'
        accesses:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseAccessDto'
        creator:
          $ref: '#/components/schemas/UserBriefDto'
        owner:
          $ref: '#/components/schemas/UserBriefDto'
        created:
          type: string
          format: date-time
        exchange_name:
          type: string
          example: dbrepo/air_quality
        internal_name:
          type: string
          example: weather_australia
        is_public:
          type: boolean
          example: true
    IdentifierDto:
      required:
      - container id
      - creators
      - database id
      - execution
      - publication_year
      - query
      - query_hash
      - query_normalized
      - result_hash
      - result_number
      - title
      - type
      - visibility
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - database
          - subset
        title:
          type: string
          example: "Airquality Stephansplatz, Vienna, Austria"
        description:
          type: string
          example: "Air quality reports at Stephansplatz, Vienna"
        query:
          type: string
          example: "SELECT `id`, `value`, `location` FROM `air_quality` WHERE `location`\
            \ = \"09:STEF\""
        execution:
          type: string
          format: date-time
        visibility:
          type: string
          example: everyone
          enum:
          - everyone
          - self
        doi:
          type: string
          example: 10.1038/nphys1170
        publisher:
          type: string
          example: TU Wien
        language:
          type: string
