        license:
          $ref: '#/components/schemas/LicenseDto'
        creators:
          type: array
          items:
            $ref: '#/components/schemas/CreatorDto'
        created:
          type: string
          format: date-time
        container id:
          type: integer
          format: int64
          example: 1
        database id:
          type: integer
          format: int64
          example: 1
        query id:
          type: integer
          format: int64
          example: 1
        query_normalized:
          type: string
          example: "SELECT `id`, `value`, `location` FROM `air_quality` WHERE `location`\
            \ = \"09:STEF\""
        related:
          type: array
          items:
            $ref: '#/components/schemas/RelatedIdentifierDto'
        query_hash:
          type: string
          description: query hash in sha512
        result_hash:
          type: string
        result_number:
          type: integer
          format: int64
          example: 1
        publication_day:
          type: integer
          format: int32
          example: 15
        publication_month:
          type: integer
          format: int32
          example: 12
        publication_year:
          type: integer
          format: int32
          example: 2022
        last_modified:
          type: string
          format: date-time
    ImageBriefDto:
      required:
      - id
      - registry
      - repository
      - tag
      type: object
      properties:
        id:
          type: integer
          format: int64
        registry:
          type: string
          example: docker.io/library
        repository:
          type: string
          example: mariadb
        tag:
          type: string
          example: "10.5"
    ImageDateDto:
      required:
      - database_format
      - example
      - has_time
      - id
      - unix_format
      type: object
      properties:
        id:
          type: integer
          format: int64
        example:
          type: string
          example: 30.01.2022
        database_format:
          type: string
          example: '%d.%c.%Y'
        unix_format:
          type: string
          example: dd.MM.YYYY
        has_time:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
    ImageDto:
      required:
      - default_port
      - dialect
      - driver_class
      - id
      - jdbc_method
      - registry
      - repository
      - tag
      type: object
      properties:
        id:
          type: integer
          format: int64
        registry:
          type: string
          example: docker.io/library
        repository:
          type: string
          example: mariadb
        tag:
          type: string
          example: "10.5"
        dialect:
          type: string
          example: org.hibernate.dialect.MariaDBDialect
        hash:
          type: string
          example: sha256:c5ec7353d87dfc35067e7bffeb25d6a0d52dad41e8b7357213e3b12d6e7ff78e
        compiled:
          type: string
          format: date-time
          example: 2021-03-12T15:26:21.678396092Z
        size:
          type: integer
          example: 314295447
        driver_class:
          type: string
          example: org.mariadb.jdbc.Driver
        date_formats:
          type: array
          items:
            $ref: '#/components/schemas/ImageDateDto'
        jdbc_method:
          type: string
          example: mariadb
        default_port:
          type: integer
          format: int32
          example: 3306
    LicenseDto:
      required:
      - identifier
      - uri
      type: object
      properties:
        identifier:
          type: string
          example: MIT
        uri:
          type: string
          example: https://opensource.org/licenses/MIT
    RelatedIdentifierDto:
      required:
      - created
      - id
      - value
      type: object
      properties:
        id:
          type: integer
          format: int64
        value:
          type: string
          example: 10.70124/dc4zh-9ce78
        type:
          type: string
          example: DOI
          enum:
          - DOI
          - URL
          - URN
          - ARK
          - arXiv
          - bibcode
          - EAN13
          - EISSN
          - Handle
          - IGSN
          - ISBN
          - ISTC
          - LISSN
          - LSID
          - PMID
          - PURL
          - UPC
          - w3id
        relation:
          type: string
          example: Cites
          enum:
          - IsCitedBy
          - Cites
          - IsSupplementTo
          - IsSupplementedBy
          - IsContinuedBy
          - Continues
          - IsDescribedBy
          - Describes
          - HasMetadata
          - IsMetadataFor
          - HasVersion
          - IsVersionOf
          - IsNewVersionOf
          - IsPreviousVersionOf
          - IsPartOf
          - HasPart
          - IsPublishedIn
          - IsReferencedBy
          - References
          - IsDocumentedBy
          - Documents
          - IsCompiledBy
          - Compiles
          - IsVariantFormOf
          - IsOriginalFormOf
          - IsIdenticalTo
          - IsReviewedBy
          - Reviews
          - IsDerivedFrom
          - IsSourceOf
          - IsRequiredBy
          - Requires
          - IsObsoletedBy
          - Obsoletes
        created:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
    TableBriefDto:
      required:
      - columns
      - description
      - id
      - internal_name
      - name
      - owner
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Air Quality
        description:
          type: string
          example: Air Quality in Austria
        owner:
          $ref: '#/components/schemas/UserBriefDto'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnBriefDto'
        internal_name:
          type: string
          example: air_quality
    UserAttributeDto:
      type: object
      properties:
        name:
          type: string
          example: theme_dark
        value:
          type: string
          example: "true"
    UserBriefDto:
      required:
      - id
      - username
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1ffc7b0e-9aeb-4e8b-b8f1-68f3936155b4
        username:
          type: string
          description: Only contains lowercase characters
          example: jcarberry
        name:
          type: string
          example: Josiah Carberry
        orcid:
          type: string
          example: 0000-0002-1825-0097
        given_name:
          type: string
          example: Josiah
        family_name:
          type: string
          example: Carberry
        email_verified:
          type: boolean
          example: true
    UserDto:
      required:
      - email
      - email_verified
      - id
      - username
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1ffc7b0e-9aeb-4e8b-b8f1-68f3936155b4
        username:
          type: string
          description: Only contains lowercase characters
          example: jcarberry
        name:
          type: string
          example: Josiah Carberry
        orcid:
          type: string
          example: 0000-0002-1825-0097
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/UserAttributeDto'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerDto'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/ContainerDto'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerDto'
        email:
          type: string
          example: jcarberry@brown.edu
        given_name:
          type: string
          example: Josiah
        family_name:
          type: string
          example: Carberry
        email_verified:
          type: boolean
          example: true
    ViewBriefDto:
      required:
      - created
      - creator
      - id
      - internal_name
      - name
      - query
      - vdbid
      type: object
      properties:
        id:
          type: integer
          format: int64
        vdbid:
          type: integer
          format: int64
        name:
          type: string
          example: Air Quality
        query:
          type: string
          example: SELECT `id` FROM `air_quality` ORDER BY `value` DESC
        created:
          type: string
          format: date-time
        creator:
          $ref: '#/components/schemas/UserDto'
        internal_name:
          type: string
          example: air_quality
        is_public:
          type: boolean
          example: true
        initial_view:
          type: boolean
          description: True if it is the default view for the database
          example: true
        last_modified:
          type: string
          format: date-time
    ApiErrorDto:
      required:
      - code
      - message
