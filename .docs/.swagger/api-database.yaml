        license:
          $ref: '#/components/schemas/LicenseDto'
        creators:
          type: array
          items:
            $ref: '#/components/schemas/CreatorDto'
        created:
          type: string
          format: date-time
        container id:
          type: integer
          format: int64
          example: 1
        database id:
          type: integer
          format: int64
          example: 1
        query id:
          type: integer
          format: int64
          example: 1
        query_normalized:
          type: string
          example: "SELECT `id`, `value`, `location` FROM `air_quality` WHERE `location`\
            \ = \"09:STEF\""
        related:
          type: array
          items:
            $ref: '#/components/schemas/RelatedIdentifierDto'
        query_hash:
          type: string
          description: query hash in sha512
        result_hash:
          type: string
        result_number:
          type: integer
          format: int64
          example: 1
        publication_day:
          type: integer
          format: int32
          example: 15
        publication_month:
          type: integer
          format: int32
          example: 12
        publication_year:
          type: integer
          format: int32
          example: 2022
        last_modified:
          type: string
          format: date-time
    ImageBriefDto:
      required:
      - id
      - registry
      - repository
      - tag
      type: object
      properties:
        id:
          type: integer
          format: int64
        registry:
          type: string
