components:
  schemas: {}
externalDocs:
  description: Sourcecode Documentation
  url: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services
info:
  contact:
    email: andreas.rauber@tuwien.ac.at
    name: Prof. Andreas Rauber
  description: Service that searches the search database
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Database Repository Search Service API
  version: $TAG
openapi: 3.0.0
paths:
  /api/search:
    post:
      consumes:
        - application/json
      description: Performs a fuzzy search
      operationId: post_fuzzy_search
      parameters:
        - in: body
          name: body
          required: true
          schema:
            properties:
              search_term:
                example: air quality
                type: string
            type: object
      produces:
        - application/json
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  results:
                    items:
                      type: object
                    type: array
                type: object
          description: OK, contains the elements formatted as an array of JSON arrays
      summary: Performs a fuzzy search
      tags:
        - search-endpoint
  /api/search/{type}:
    post:
      consumes:
        - application/json
      description: Performs a general search
      operationId: post_general_search
      parameters:
        - description: The search type.
          in: path
          name: type
          required: true
          schema:
            enum:
              - database
              - table
              - view
              - column
              - user
              - identifier
              - concept
              - unit
            type: string
        - in: body
          name: body
          required: true
          schema:
            properties:
              field_value_pairs:
                type: object
              search_term:
                example: air quality
                type: string
              t1:
                example: 0
                type: integer
              t2:
                example: 100
                type: integer
            type: object
      produces:
        - application/json
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  results:
                    items:
                      type: object
                    type: array
                  type:
                    description: Same as the requested type
                    enum:
                      - database
                      - table
                      - view
                      - column
                      - user
                      - identifier
                      - concept
                      - unit
                    type: string
                type: object
          description: OK, contains the elements formatted as an array of JSON arrays
      summary: Performs a general search
      tags:
        - search-endpoint
  /api/search/{type}/fields:
    get:
      operationId: get_fields
      parameters:
        - description: The search type.
          in: path
          name: type
          required: true
          schema:
            enum:
              - database
              - table
              - view
              - column
              - user
              - identifier
              - concept
              - unit
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  results:
                    items:
                      properties:
                        attr_friendly_name:
                          example: Name
                          type: string
                        attr_name:
                          example: name
                          type: string
                        type:
                          description: OpenSearch data types.
                          example: string
                          type: string
                      type: object
                    type: array
                type: object
          description: List of fields
        '404':
          description: Invalid type.
      summary: Get searchable fields
      tags:
        - search-endpoint
  /health:
    get:
      consumes:
        - application/json
      description: 'Return UP if the instance is ready to serve connections.

        '
      produces:
        - application/json
      responses:
        '200':
          description: OK, service is up and running
          schema:
            $ref: '#/definitions/Column'
        '404':
          description: Service is not yet ready
      summary: Return a healthcheck
      tags:
        - actuator
servers:
  - description: Generated server url
    url: http://localhost:4000
  - description: Sandbox
    url: https://test.dbrepo.tuwien.ac.at
