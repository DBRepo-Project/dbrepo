openapi: 3.0.1
info:
  title: Database Repository Container Service API
  description: Service that manages the containers
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.2.0
externalDocs:
  description: Sourcecode Documentation
  url: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services
servers:
- url: http://localhost:9092
  description: Generated server url
- url: https://dbrepo2.tuwien.ac.at
  description: Sandbox
paths:
  /api/image/{id}:
    get:
      tags:
      - image-endpoint
      summary: Find some image
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    put:
      tags:
      - image-endpoint
      summary: Update some image
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageChangeDto'
        required: true
      responses:
        "202":
          description: Updated image successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
    delete:
      tags:
      - image-endpoint
      summary: Delete some image
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: Deleted image successfully
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
  /api/container/{id}:
    get:
      tags:
      - container-endpoint
      summary: Find some container
      operationId: findById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "502":
          description: Docker client failed to connect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Found container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDto'
        "404":
          description: Container image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    put:
      tags:
      - container-endpoint
      summary: Modify some container
      operationId: modify
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerChangeDto'
        required: true
      responses:
        "409":
          description: Container is already started/stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Container or user could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Modification of container state is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Modified state of container successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerBriefDto'
      security:
      - bearerAuth: []
    delete:
      tags:
      - container-endpoint
      summary: Delete some container
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "410":
          description: Container is already removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Container is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted container successfully
      security:
      - bearerAuth: []
  /api/image:
    get:
      tags:
      - image-endpoint
      summary: Find all images
      operationId: findAll
      responses:
        "200":
          description: List images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerImage'
    post:
      tags:
      - image-endpoint
      summary: Create image
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateDto'
        required: true
      responses:
        "201":
          description: Created image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        "404":
          description: User could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Image specification is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Docker client failed to connect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Image already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
  /api/container:
    get:
      tags:
      - container-endpoint
      summary: Find all containers
      operationId: findAll_1
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: List containers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerBriefDto'
    post:
      tags:
      - container-endpoint
      summary: Create container
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerCreateRequestDto'
        required: true
      responses:
        "201":
          description: Created a new container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerBriefDto'
        "404":
          description: Container image or user could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Container name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Docker client failed to connect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
components:
  schemas:
    ImageChangeDto:
      required:
      - dialect
      - driver_class
      - jdbc_method
      - registry
      type: object
      properties:
        registry:
          type: string
          example: docker.io/library
        defaultPort:
          maximum: 65535
          minimum: 1024
          type: integer
          format: int32
          example: 5432
        environment:
          type: array
          items:
            $ref: '#/components/schemas/ImageEnvItemDto'
        dialect:
          type: string
          example: Postgres
        driver_class:
          type: string
          example: org.postgresql.Driver
        jdbc_method:
          type: string
          example: postgresql
    ImageEnvItemDto:
      required:
      - iid
      - key
      - type
      type: object
      properties:
        iid:
          type: integer
          format: int64
        key:
          type: string
          example: MARIADB_ROOT_PASSWORD
        type:
          type: string
          example: PRIVILEGED_PASSWORD
          enum:
          - username
          - password
          - privileged_username
          - privileged_password
    ImageDateDto:
      required:
      - database_format
      - example
      - has_time
      - id
      - unix_format
      type: object
      properties:
        id:
          type: integer
          format: int64
        example:
          type: string
          example: 30.01.2022
        database_format:
          type: string
          example: '%d.%c.%Y'
        unix_format:
          type: string
          example: dd.MM.YYYY
        has_time:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
    ImageDto:
      required:
      - default_port
      - dialect
      - driver_class
      - id
      - jdbc_method
      - registry
      - repository
      - tag
      type: object
      properties:
        id:
          type: integer
          format: int64
        registry:
          type: string
          example: docker.io/library
        repository:
          type: string
          example: mariadb
        tag:
          type: string
          example: "10.5"
        dialect:
          type: string
          example: org.hibernate.dialect.MariaDBDialect
        hash:
          type: string
          example: sha256:c5ec7353d87dfc35067e7bffeb25d6a0d52dad41e8b7357213e3b12d6e7ff78e
        compiled:
          type: string
          format: date-time
          example: 2021-03-12T15:26:21.678396092Z
        size:
          type: integer
          example: 314295447
        driver_class:
          type: string
          example: org.mariadb.jdbc.Driver
        date_formats:
          type: array
          items:
            $ref: '#/components/schemas/ImageDateDto'
        jdbc_method:
          type: string
          example: mariadb
        default_port:
          type: integer
          format: int32
          example: 3306
    ApiErrorDto:
      required:
      - code
      - message
      - status
      type: object
      properties:
        status:
          type: string
          example: STATUS
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 406 NOT_ACCEPTABLE
          - 407 PROXY_AUTHENTICATION_REQUIRED
          - 408 REQUEST_TIMEOUT
          - 409 CONFLICT
          - 410 GONE
          - 411 LENGTH_REQUIRED
          - 412 PRECONDITION_FAILED
          - 413 PAYLOAD_TOO_LARGE
          - 413 REQUEST_ENTITY_TOO_LARGE
          - 414 URI_TOO_LONG
          - 414 REQUEST_URI_TOO_LONG
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 416 REQUESTED_RANGE_NOT_SATISFIABLE
          - 417 EXPECTATION_FAILED
          - 418 I_AM_A_TEAPOT
          - 419 INSUFFICIENT_SPACE_ON_RESOURCE
          - 420 METHOD_FAILURE
          - 421 DESTINATION_LOCKED
          - 422 UNPROCESSABLE_ENTITY
          - 423 LOCKED
          - 424 FAILED_DEPENDENCY
          - 425 TOO_EARLY
          - 426 UPGRADE_REQUIRED
          - 428 PRECONDITION_REQUIRED
          - 429 TOO_MANY_REQUESTS
          - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
          - 451 UNAVAILABLE_FOR_LEGAL_REASONS
          - 500 INTERNAL_SERVER_ERROR
          - 501 NOT_IMPLEMENTED
          - 502 BAD_GATEWAY
          - 503 SERVICE_UNAVAILABLE
          - 504 GATEWAY_TIMEOUT
          - 505 HTTP_VERSION_NOT_SUPPORTED
          - 506 VARIANT_ALSO_NEGOTIATES
          - 507 INSUFFICIENT_STORAGE
          - 508 LOOP_DETECTED
          - 509 BANDWIDTH_LIMIT_EXCEEDED
          - 510 NOT_EXTENDED
          - 511 NETWORK_AUTHENTICATION_REQUIRED
        message:
          type: string
          example: Error message
        code:
          type: string
          example: error.service.code
    ContainerChangeDto:
      required:
      - action
      type: object
      properties:
        action:
          type: string
          enum:
          - start
          - stop
    ContainerBriefDto:
      required:
      - creator
      - hash
      - id
      - internal_name
      - name
      - running
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
          example: f829dd8a884182d0da846f365dee1221fd16610a14c81b8f9f295ff162749e50
        name:
          type: string
          example: Air Quality
        creator:
          $ref: '#/components/schemas/UserBriefDto'
        running:
          type: boolean
          example: true
        database:
          $ref: '#/components/schemas/DatabaseBriefDto'
        created:
          type: string
          format: date-time
        internal_name:
          type: string
          example: air-quality
    CreatorBriefDto:
      required:
      - firstname
      - lastname
      type: object
      properties:
        firstname:
          type: string
          example: Josiah
        lastname:
          type: string
          example: Carberry
        affiliation:
          type: string
          example: Wesleyan University
    DatabaseBriefDto:
      required:
      - id
      - name
      - owner
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Air Quality
        description:
          type: string
          example: Air Quality in Austria
        identifier:
          $ref: '#/components/schemas/IdentifierBriefDto'
        engine:
          type: string
          example: mariadb:10.5
        owner:
          $ref: '#/components/schemas/UserBriefDto'
        container:
          $ref: '#/components/schemas/ContainerBriefDto'
        creator:
          $ref: '#/components/schemas/UserBriefDto'
        created:
          type: string
          format: date-time
        is_public:
          type: boolean
          example: true
    IdentifierBriefDto:
      required:
      - container id
      - creators
      - database id
      - id
      - publication_year
      - title
      - type
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: "Airquality Stephansplatz, Vienna, Austria"
        type:
          type: string
          enum:
          - database
          - subset
        doi:
          type: string
          example: 10.1038/nphys1170
        publisher:
          type: string
          example: TU Wien
        creators:
          type: array
          items:
            $ref: '#/components/schemas/CreatorBriefDto'
        container id:
          type: integer
          format: int64
          example: 1
        database id:
          type: integer
          format: int64
          example: 1
        query id:
          type: integer
          format: int64
          example: 1
        publication_year:
          type: integer
          format: int32
          example: 2022
    UserBriefDto:
      required:
      - id
      - username
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1ffc7b0e-9aeb-4e8b-b8f1-68f3936155b4
        username:
          type: string
          description: Only contains lowercase characters
          example: jcarberry
        name:
          type: string
          example: Josiah Carberry
        orcid:
          type: string
          example: 0000-0002-1825-0097
        given_name:
          type: string
          example: Josiah
        family_name:
          type: string
          example: Carberry
        email_verified:
          type: boolean
          example: true
    ImageCreateDto:
      required:
      - default_port
      - dialect
      - driver_class
      - jdbc_method
      - registry
      - repository
      - tag
      type: object
      properties:
        registry:
          type: string
          example: docker.io/library
        repository:
          type: string
          example: mariadb
        tag:
          type: string
        dialect:
          type: string
        environment:
          type: array
          items:
            $ref: '#/components/schemas/ImageEnvItemDto'
        driver_class:
          type: string
        jdbc_method:
          type: string
        default_port:
          maximum: 65535
          minimum: 1024
          type: integer
          format: int32
    ContainerCreateRequestDto:
      required:
      - name
      - repository
      - tag
      type: object
      properties:
        name:
          type: string
          example: Air Quality
        repository:
          type: string
          example: mariadb
        tag:
          type: string
          example: "10.5"
    Constraints:
      type: object
      properties:
        uniques:
          type: array
          items:
            $ref: '#/components/schemas/Unique'
        foreignKeys:
          type: array
          items:
            $ref: '#/components/schemas/ForeignKey'
        checks:
          uniqueItems: true
          type: array
          items:
            type: string
    Container:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdBy:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/User'
        ownedBy:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/User'
        name:
          type: string
        internalName:
          type: string
        hash:
          type: string
        imageId:
          type: integer
          format: int64
        port:
          type: integer
          format: int32
        database:
          $ref: '#/components/schemas/Database'
        image:
          $ref: '#/components/schemas/ContainerImage'
        ipAddress:
          type: string
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    ContainerImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        repository:
          type: string
        registry:
          type: string
        tag:
          type: string
        driverClass:
          type: string
        dialect:
          type: string
        jdbcMethod:
          type: string
        hash:
          type: string
        compiled:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        defaultPort:
          type: integer
          format: int32
        environment:
          type: array
          items:
            $ref: '#/components/schemas/ContainerImageEnvironmentItem'
        dateFormats:
          type: array
          items:
            $ref: '#/components/schemas/ContainerImageDate'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    ContainerImageDate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        iid:
          type: integer
          format: int64
        image:
          $ref: '#/components/schemas/ContainerImage'
        example:
          type: string
        hasTime:
          type: boolean
        databaseFormat:
          type: string
        unixFormat:
          type: string
        createdAt:
          type: string
          format: date-time
    ContainerImageEnvironmentItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        iid:
          type: integer
          format: int64
        key:
          type: string
        value:
          type: string
        type:
          type: string
          enum:
          - USERNAME
          - PASSWORD
          - PRIVILEGED_USERNAME
          - PRIVILEGED_PASSWORD
        image:
          $ref: '#/components/schemas/ContainerImage'
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    Creator:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pid:
          type: integer
          format: int64
        firstname:
          type: string
        lastname:
          type: string
        affiliation:
          type: string
        orcid:
          type: string
        identifier:
          $ref: '#/components/schemas/Identifier'
        created:
          type: string
          format: date-time
        creator:
          $ref: '#/components/schemas/User'
        lastModified:
          type: string
          format: date-time
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        userId:
          type: string
          format: uuid
        createdDate:
          type: integer
          format: int64
        secretData:
          type: string
        credentialData:
          type: string
        priority:
          type: integer
          format: int32
        user:
          $ref: '#/components/schemas/User'
    Database:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdBy:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/User'
        ownedBy:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/User'
        container:
          $ref: '#/components/schemas/Container'
        name:
          type: string
        internalName:
          type: string
        exchangeName:
          type: string
        description:
          type: string
        contactPerson:
          type: string
          format: uuid
        contact:
          $ref: '#/components/schemas/User'
        identifier:
          $ref: '#/components/schemas/Identifier'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        views:
          type: array
          items:
            $ref: '#/components/schemas/View'
        isPublic:
          type: boolean
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    ForeignKey:
      type: object
      properties:
        fkid:
          type: integer
          format: int64
        tid:
          type: integer
          format: int64
        tdbid:
          type: integer
          format: int64
        table:
          $ref: '#/components/schemas/Table'
        rtid:
          type: integer
          format: int64
        rtdbid:
          type: integer
          format: int64
        referencedTable:
          $ref: '#/components/schemas/Table'
        references:
          type: array
          items:
            $ref: '#/components/schemas/ForeignKeyReference'
        onUpdate:
          type: string
          enum:
          - ReferenceType.RESTRICT
          - ReferenceType.CASCADE
          - ReferenceType.SET_NULL
          - ReferenceType.NO_ACTION
          - ReferenceType.SET_DEFAULT
        onDelete:
          type: string
          enum:
          - ReferenceType.RESTRICT
          - ReferenceType.CASCADE
          - ReferenceType.SET_NULL
          - ReferenceType.NO_ACTION
          - ReferenceType.SET_DEFAULT
    ForeignKeyReference:
      type: object
      properties:
        id:
          type: integer
          format: int64
        foreignKey:
          $ref: '#/components/schemas/ForeignKey'
        column:
          $ref: '#/components/schemas/TableColumn'
        referencedColumn:
          $ref: '#/components/schemas/TableColumn'
    Identifier:
      required:
      - publisher
      type: object
      properties:
        id:
          type: integer
          format: int64
        containerId:
          type: integer
          format: int64
        databaseId:
          type: integer
          format: int64
        queryId:
          type: integer
          format: int64
        creator:
          $ref: '#/components/schemas/User'
        title:
          type: string
        description:
          type: string
        publisher:
          type: string
        language:
          type: string
          enum:
          - LanguageType.AB
          - LanguageType.AA
          - LanguageType.AF
          - LanguageType.AK
