    UserAttributeDto:
      type: object
      properties:
        name:
          type: string
          example: theme_dark
        value:
          type: string
          example: "true"
    UserDto:
      required:
      - email
      - email_verified
      - id
      - username
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1ffc7b0e-9aeb-4e8b-b8f1-68f3936155b4
        username:
          type: string
          description: Only contains lowercase characters
          example: jcarberry
        name:
          type: string
          example: Josiah Carberry
        orcid:
          type: string
          example: 0000-0002-1825-0097
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/UserAttributeDto'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerDto'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/ContainerDto'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerDto'
        email:
          type: string
          example: jcarberry@brown.edu
        given_name:
          type: string
          example: Josiah
        family_name:
          type: string
          example: Carberry
        email_verified:
          type: boolean
          example: true
    ViewBriefDto:
      required:
      - created
      - creator
      - id
      - internal_name
      - name
      - query
      - vdbid
      type: object
      properties:
        id:
          type: integer
          format: int64
        vdbid:
          type: integer
          format: int64
        name:
          type: string
          example: Air Quality
        query:
          type: string
          example: SELECT `id` FROM `air_quality` ORDER BY `value` DESC
        created:
          type: string
          format: date-time
        creator:
          $ref: '#/components/schemas/UserDto'
        internal_name:
          type: string
          example: air_quality
        is_public:
          type: boolean
          example: true
        initial_view:
          type: boolean
          description: True if it is the default view for the database
          example: true
        last_modified:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
