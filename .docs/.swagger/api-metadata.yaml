openapi: 3.0.1
info:
  title: Database Repository Metadata Service API
  description: Service that manages the metadata
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.4.3
externalDocs:
  description: Sourcecode Documentation
  url: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/1.4.3/system-services-metadata/
servers:
- url: http://localhost
  description: Development instance
- url: https://test.dbrepo.tuwien.ac.at
  description: Staging instance
paths:
  /api/database:
    get:
      tags:
      - database-endpoint
      summary: List databases
      operationId: list
      parameters:
      - name: internal_name
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: List of databases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseDto'
    post:
      tags:
      - database-endpoint
      summary: Create database
      operationId: create_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseCreateDto'
        required: true
      responses:
        "503":
          description: Connection to the database failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Database create query is malformed or image is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Query store could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Database create permission is missing or grant permissions
            at broker service failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "201":
          description: Created a new database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "404":
          description: "Container, user or database could not be found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    head:
      tags:
      - database-endpoint
      summary: List databases
      operationId: list_1
      parameters:
      - name: internal_name
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: List of databases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseDto'
  /api/database/{databaseId}/access/{userId}:
    get:
      tags:
      - access-endpoint
      summary: Check access to some database
      operationId: find
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Found database access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseAccessDto'
        "403":
          description: No access to this database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      tags:
      - access-endpoint
      summary: Modify access to some database
      operationId: update_4
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseAccessDto'
        required: true
      responses:
        "202":
          description: Modify access succeeded
        "403":
          description: Modify access not permitted when no access is granted in the
            first place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Access could not be updated in the data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Access could not be updated due to connection error in the
            data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Database or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Modify access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    post:
      tags:
      - access-endpoint
      summary: Give access to some database
      operationId: create_8
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseAccessDto'
        required: true
      responses:
        "503":
          description: Access could not be created in the data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Granting access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Failed giving access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Granting access not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Granting access succeeded
        "404":
          description: Database or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Access could not be created due to connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - access-endpoint
      summary: Revoke access to some database
      operationId: revoke
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Revoked access successfully
        "403":
          description: Revoke of access not permitted as no access was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: "User, database with access was not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Access could not be revoked in the data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Modify access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "502":
          description: Access could not be created due to connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    head:
      tags:
      - access-endpoint
      summary: Check access to some database
      operationId: find_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Found database access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseAccessDto'
        "403":
          description: No access to this database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/user/{userId}:
    get:
      tags:
      - user-endpoint
      summary: Get a user info
      operationId: find_2
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Found user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        "403":
          description: Find user is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: User was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      tags:
      - user-endpoint
      summary: Modify user information
      operationId: modify
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDto'
        required: true
      responses:
        "202":
          description: Modified user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        "400":
          description: Modify user query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/user/{userId}/password:
    put:
      tags:
      - user-endpoint
      summary: Modify user password
      operationId: password
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordDto'
        required: true
      responses:
        "202":
          description: Modified user password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/user/token:
    put:
      tags:
      - user-endpoint
      summary: Refresh user token
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestDto'
        required: true
      responses:
        "202":
          description: Refreshed user token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
    post:
      tags:
      - user-endpoint
      summary: Obtain user token
      operationId: getToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
        required: true
      responses:
        "202":
          description: Obtained user token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
  /api/ontology/{ontologyId}:
    get:
      tags:
      - ontology-endpoint
      summary: Find one ontology
      operationId: find_3
      parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Find one ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyDto'
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    put:
      tags:
      - ontology-endpoint
      summary: Update an ontology
      operationId: update
      parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyModifyDto'
        required: true
      responses:
        "202":
          description: Updated ontology successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyDto'
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - ontology-endpoint
      summary: Delete an ontology
      operationId: delete
      parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: Deleted ontology successfully
          content:
            application/json: {}
        "404":
          description: Could not find ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/message/{messageId}:
    put:
      tags:
      - message-endpoint
      summary: Update maintenance message
      operationId: update_1
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerMessageUpdateDto'
        required: true
      responses:
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMessageBriefDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - message-endpoint
      summary: Delete maintenance message
      operationId: delete_1
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Could not find message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted message
          content:
            application/json: {}
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/image/{imageId}:
    get:
      tags:
      - image-endpoint
      summary: Find some image
      operationId: findById
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    put:
      tags:
      - image-endpoint
      summary: Update some image
      operationId: update_2
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageChangeDto'
        required: true
      responses:
        "202":
          description: Updated image successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - image-endpoint
      summary: Delete some image
      operationId: delete_2
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: Deleted image successfully
        "404":
          description: Image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/identifier/{identifierId}:
    get:
      tags:
      - identifier-endpoint
      summary: Find some identifier
      operationId: find_6
      parameters:
      - name: identifierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Identifier could not be found
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: "Identifier could not be exported, the requested style is not\
            \ known"
          content:
            text/bibliography:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "410":
          description: Failed to retrieve from S3 endpoint
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "409":
          description: Exported resource was not found
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Found identifier successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/LdDatasetDto'
            text/csv: {}
            text/xml: {}
            text/bibliography: {}
            text/bibliography; style=apa: {}
            text/bibliography; style=ieee: {}
            text/bibliography; style=bibtex: {}
        "422":
          description: Failed to retrieve from database sidecar
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Identifier could not exported from database as it is not reachable
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    put:
      tags:
      - identifier-endpoint
      summary: Save identifier
      operationId: save
      parameters:
      - name: identifierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSaveDto'
        required: true
      responses:
        "404":
          description: "Failed to find database, table or view"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Identifier form contains invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Saved identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
        "503":
          description: DataCite system did not respond
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Creating identifier not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Insufficient access rights or authorities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    delete:
      tags:
      - identifier-endpoint
      summary: Delete some identifier
      operationId: delete_3
      parameters:
      - name: identifierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Identifier or database could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted identifier
          content:
            '*/*':
              schema:
                type: object
        "403":
          description: Deleting identifier not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/identifier/{identifierId}/publish:
    put:
      tags:
      - identifier-endpoint
      summary: Publish identifier
      operationId: publish
      parameters:
      - name: identifierId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: "Failed to find database, table or view"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Identifier form contains invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: DataCite system did not respond
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Creating identifier not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Published identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierDto'
        "403":
          description: Insufficient access rights or authorities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/database/{databaseId}/visibility:
    put:
      tags:
      - database-endpoint
      summary: Update database visibility
      operationId: visibility
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseModifyVisibilityDto'
        required: true
      responses:
        "202":
          description: Visibility modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "403":
          description: Visibility modification is not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Database could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/database/{databaseId}/table/{tableId}:
    get:
      tags:
      - table-endpoint
      summary: Get information about table
      operationId: findById_2
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Find table successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
        "403":
          description: Access to the database is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: "Table, database or container could not be found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Could not communicate with the broker service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    put:
      tags:
      - table-endpoint
      summary: Update table statistics
      operationId: updateStatistic
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
