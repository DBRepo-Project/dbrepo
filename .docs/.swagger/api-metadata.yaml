      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: columnId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "417":
          description: Generated query is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: Could not find the table column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "200":
          description: Suggested table column semantics successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableColumnEntityDto'
        "422":
          description: Ontology does not have rdf or sparql endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/container/{containerId}:
    get:
      tags:
      - container-endpoint
      summary: Find some container
      operationId: findById_3
      parameters:
      - name: containerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDto'
        "404":
          description: Container image could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
    delete:
      tags:
      - container-endpoint
      summary: Delete some container
      operationId: delete_6
      parameters:
      - name: containerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Container not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Deleted container successfully
          content:
            '*/*':
              schema:
                type: object
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/concept:
    get:
      tags:
      - concept-endpoint
      summary: List semantic concepts
      operationId: findAll_7
      responses:
        "200":
          description: Find all semantic concepts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConceptDto'
