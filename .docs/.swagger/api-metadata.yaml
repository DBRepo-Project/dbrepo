openapi: 3.0.1
info:
  title: Database Repository Metadata Service API
  description: Service that manages the metadata
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.2.0
externalDocs:
  description: Sourcecode Documentation
  url: https://gitlab.phaidra.org/fair-data-austria-db-repository/fda-services
servers:
- url: http://localhost:9099
  description: Generated server url
- url: https://dbrepo2.tuwien.ac.at
  description: Sandbox
paths:
  /api/oai:
    get:
      tags:
      - metadata-endpoint
      summary: Get the record
      operationId: identify_1_1_1_1
      parameters:
      - name: verb
        in: query
      - name: parameters
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/OaiListIdentifiersParameters'
      responses:
        "200":
          description: List containers
          content:
            text/xml: {}
components:
  schemas:
    OaiListIdentifiersParameters:
      type: object
      properties:
        metadataPrefix:
          type: string
        from:
          type: string
        until:
          type: string
        set:
          type: string
        resumptionToken:
          type: string
        fromDate:
          type: string
          format: date-time
        untilDate:
          type: string
          format: date-time
        parametersString:
          type: string
