        column:
          $ref: '#/components/schemas/TableColumn'
    LdCreatorDto:
      required:
      - '@type'
      - name
      type: object
      properties:
        name:
          type: string
        sameAs:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        '@type':
          type: string
    LdDatasetDto:
      required:
      - '@context'
      - '@type'
      - citation
      - creator
      - description
      - hasPart
      - identifier
      - name
      - temporalCoverage
      - url
      - version
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
        identifier:
          type: array
          items:
            type: string
        license:
          type: string
        creator:
          type: array
          items:
            $ref: '#/components/schemas/LdCreatorDto'
        citation:
          type: string
        hasPart:
          type: array
          items:
            $ref: '#/components/schemas/LdDatasetDto'
        temporalCoverage:
          type: string
        version:
          type: string
          format: date-time
        '@context':
          type: string
        '@type':
          type: string
    TableColumnEntityDto:
      required:
      - column_id
      - database_id
      - table_id
      - uri
      type: object
      properties:
        uri:
          type: string
          example: https://www.wikidata.org/entity/Q1686799
        label:
          type: string
          example: Apache Jena
        description:
          type: string
          example: open source semantic web framework for Java
        database_id:
          type: integer
          format: int64
          example: 1
        table_id:
          type: integer
          format: int64
          example: 1
        column_id:
          type: integer
          format: int64
          example: 1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
