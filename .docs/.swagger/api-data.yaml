openapi: 3.0.1
info:
  title: Database Repository Data Service API
  description: Service that manages the data
  contact:
    name: Prof. Andreas Rauber
    email: andreas.rauber@tuwien.ac.at
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.4.3
externalDocs:
  description: Sourcecode Documentation
  url: https://www.ifs.tuwien.ac.at/infrastructures/dbrepo/1.4.3/system-services-metadata/
servers:
- url: http://localhost
  description: Development instance
- url: https://test.dbrepo.tuwien.ac.at
  description: Staging instance
paths:
  /api/database/{databaseId}/view/{viewId}/data:
    get:
      tags:
      - view-endpoint
      summary: Get view data
      operationId: getData
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: viewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Returned view data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - basicAuth: []
      - bearerAuth: []
    head:
      tags:
      - view-endpoint
      summary: Get view data
      operationId: getData_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: viewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Returned view data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}/data:
    get:
      tags:
      - table-endpoint
      summary: Find table data
      operationId: getData_2
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found table data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - basicAuth: []
      - bearerAuth: []
    put:
      tags:
      - table-endpoint
      summary: Update table data
      operationId: updateTuple
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TupleUpdateDto'
        required: true
      responses:
        "202":
          description: Updated table data
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      tags:
      - table-endpoint
      summary: Create table data
      operationId: createTuple
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TupleDto'
        required: true
      responses:
        "201":
          description: Created table data
      security:
      - basicAuth: []
      - bearerAuth: []
    delete:
      tags:
      - table-endpoint
      summary: Delete table data
      operationId: deleteTuple
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TupleDeleteDto'
        required: true
      responses:
        "202":
          description: Deleted table data
      security:
      - basicAuth: []
      - bearerAuth: []
    head:
      tags:
      - table-endpoint
      summary: Find table data
      operationId: getData_3
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found table data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/subset/{subsetId}/data:
    get:
      tags:
      - subset-endpoint
      summary: Re-execute some query
      operationId: getData_4
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subsetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Get subset data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - bearerAuth: []
      - basicAuth: []
    head:
      tags:
      - subset-endpoint
      summary: Re-execute some query
      operationId: getData_5
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subsetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Get subset data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/database/{databaseId}:
    put:
      tags:
      - database-endpoint
      summary: Update user password in database
      operationId: update
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPasswordDto'
        required: true
      responses:
        "202":
          description: Created a new database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "400":
          description: Database create query is malformed or image is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - basicAuth: []
  /api/database/{databaseId}/subset/{queryId}:
    put:
      tags:
      - subset-endpoint
      summary: Persist some query
      operationId: persist
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: queryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryPersistDto'
        required: true
      responses:
        "202":
          description: Persist query successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryDto'
      security:
      - bearerAuth: []
      - basicAuth: []
  /api/database/{databaseId}/access/{userId}:
    put:
      tags:
      - access-endpoint
      summary: Modify access to some database
      operationId: update_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseAccessDto'
        required: true
      responses:
        "404":
          description: Database or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Modify access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Access could not be updated in the data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Modify access not permitted when no access is granted in the
            first place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "202":
          description: Modify access succeeded
      security:
      - basicAuth: []
    post:
      tags:
      - access-endpoint
      summary: Give access to some database
      operationId: create_4
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseAccessDto'
        required: true
      responses:
        "202":
          description: Granting access succeeded
        "404":
          description: Database or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "405":
          description: Granting access not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Failed giving access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "400":
          description: Granting access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Access could not be created in the data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - basicAuth: []
    delete:
      tags:
      - access-endpoint
      summary: Revoke access to some database
      operationId: revoke
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: Revoked access successfully
        "400":
          description: Modify access query or database connection is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "404":
          description: "User, database with access was not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "503":
          description: Access could not be revoked in the data service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
        "403":
          description: Revoke of access not permitted as no access was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - basicAuth: []
  /api/database:
    post:
      tags:
      - database-endpoint
      summary: Create database
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseDto'
        required: true
      responses:
        "201":
          description: Created a new database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
        "400":
          description: Database create query is malformed or image is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
      security:
      - basicAuth: []
  /api/database/{databaseId}/view:
    post:
      tags:
      - view-endpoint
      summary: Create view
      operationId: create_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreateDto'
        required: true
      responses:
        "202":
          description: Created a new view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table:
    post:
      tags:
      - table-endpoint
      summary: Create table
      operationId: create_2
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreateDto'
        required: true
      responses:
        "202":
          description: Created a new table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
      security:
      - basicAuth: []
  /api/database/{databaseId}/table/{tableId}/data/import:
    post:
      tags:
      - table-endpoint
      summary: Insert data from csv
      operationId: importData
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCsvDto'
        required: true
      responses:
        "202":
          description: Import  successfully
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/subset:
    get:
      tags:
      - subset-endpoint
      summary: Find subsets
      operationId: findAllById
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: persisted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Found subsets
          content:
            application/json:
              schema:
                type: string
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      tags:
      - subset-endpoint
      summary: Create subset
      operationId: create_3
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteStatementDto'
        required: true
      responses:
        "201":
          description: Created subset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}/history:
    get:
      tags:
      - table-endpoint
      summary: Find table history
      operationId: getHistory
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Found table history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}/export:
    get:
      tags:
      - table-endpoint
      summary: Export table data
      operationId: exportData
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Exported table data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/subset/{subsetId}:
    get:
      tags:
      - subset-endpoint
      summary: Find subset
      operationId: findById
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: subsetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Found subset
          content:
            '*/*':
              schema:
                type: object
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/view/{viewId}:
    delete:
      tags:
      - view-endpoint
      summary: Delete view in database
      operationId: delete
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: viewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          description: Deleted table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
      security:
      - basicAuth: []
      - bearerAuth: []
  /api/database/{databaseId}/table/{tableId}:
    delete:
      tags:
      - table-endpoint
      summary: Delete table in database
      operationId: delete_1
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          description: Deleted table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseDto'
      security:
      - basicAuth: []
components:
  schemas:
    QueryResultDto:
      required:
      - headers
      - id
      - result
      type: object
      properties:
        result:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        headers:
          type: array
          items:
            type: object
            additionalProperties:
              type: integer
              format: int32
        id:
          type: integer
          format: int64
    UpdateUserPasswordDto:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    ColumnBriefDto:
      required:
      - column_type
      - database_id
      - id
      - internal_name
      - name
      - table_id
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: date
        alias:
          type: string
        database_id:
          type: integer
          format: int64
        table_id:
          type: integer
          format: int64
        internal_name:
          type: string
          example: mdb_date
        column_type:
          type: string
          example: date
          enum:
          - char
          - varchar
          - binary
          - varbinary
          - tinyblob
          - tinytext
          - text
          - blob
          - mediumtext
          - mediumblob
          - longtext
          - longblob
          - enum
          - set
          - bit
          - tinyint
          - bool
          - smallint
          - mediumint
          - int
          - bigint
          - float
          - double
          - decimal
          - date
          - datetime
          - timestamp
          - time
          - year
    ColumnDto:
      required:
      - auto_generated
      - column_type
      - database_id
      - id
      - internal_name
      - is_null_allowed
      - is_public
      - name
      - ordinal_position
      - table_id
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Date
        alias:
          type: string
        size:
          type: integer
          format: int64
          example: 255
        d:
          type: integer
          format: int64
          example: 0
        mean:
          type: number
          example: 45.4
        median:
          type: number
          example: 51
        concept:
          $ref: '#/components/schemas/ConceptDto'
        unit:
          $ref: '#/components/schemas/UnitDto'
        table:
          $ref: '#/components/schemas/TableDto'
        views:
          type: array
          items:
            $ref: '#/components/schemas/ViewDto'
        enums:
          type: array
          items:
            type: string
        sets:
          type: array
          items:
            type: string
        database_id:
          type: integer
          format: int64
        table_id:
          type: integer
          format: int64
        ordinal_position:
          type: integer
          format: int32
          example: 0
        internal_name:
          type: string
          example: mdb_date
        date_format:
          $ref: '#/components/schemas/ImageDateDto'
        auto_generated:
          type: boolean
          example: false
        index_length:
          type: integer
          format: int64
        length:
          type: integer
          format: int64
        column_type:
          type: string
          example: string
          enum:
          - char
          - varchar
          - binary
          - varbinary
          - tinyblob
          - tinytext
          - text
          - blob
          - mediumtext
          - mediumblob
          - longtext
          - longblob
          - enum
          - set
          - bit
          - tinyint
          - bool
          - smallint
          - mediumint
          - int
          - bigint
          - float
          - double
          - decimal
          - date
          - datetime
          - timestamp
          - time
          - year
        data_length:
          type: integer
          format: int64
          example: 34300
        max_data_length:
          type: integer
          format: int64
          example: 34300
        num_rows:
          type: integer
          format: int64
          example: 32
        val_min:
          type: number
          example: 0
