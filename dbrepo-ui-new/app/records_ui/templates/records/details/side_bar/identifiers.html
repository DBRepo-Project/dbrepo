<section id="identifiers_info" aria-label="identifier_info" class="info-box">
    <h3 class="ui medium top attached header mt-0">Identifiers</h3>
    <div id="identifiers_list_div">
    <ul id="identifiers_list">
        {%- for ident in  database.identifiers -%}
            <li id="identifiers_list_item">
                <div class="left floated content">
                      <span>{{ident.titles[0].title}}</span>
            <br>
                <span>
                    <a class="text-muted-darken" href="{{database.id}}?doi={{ident.doi}}">DOI: {{ident.doi}}</a>
                </span>
                    {{ident.publication_day}}.{{ident.publication_month}}.{{ident.publication_year}}
                </div>

            </li>
        {%- endfor -%}

    </ul>
    </div>
</section>
