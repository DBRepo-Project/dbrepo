<section id="database_info" aria-label="database_info" class="info-box">
    <h3>Container</h3>
    <div class="label">Name</div>
    <div class="value">{{ database.container.name }}</div>
    <br>

    <div class="label">Internal Name</div>
    <div class="value">{{ database.container.internal_name }}</div>
    <br>

    <div class="label">Image</div>
    <div class="value">{{ database.container.image.name }}</div>
    <br>

    <div class="label">Version</div>
    <div class="value">{{ database.container.image.version }}</div>
</section>
