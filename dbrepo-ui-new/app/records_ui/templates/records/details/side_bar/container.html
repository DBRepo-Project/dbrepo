<section id="database_info" aria-label="database_info" class="info-box">
    <h3 class="ui medium top attached header mt-0">Container</h3>

    <div class="ui segment bottom attached rdm-sidebar">
    <dl class="details-list">
    <dt class="ui tiny header">Name</dt>
    <dd>{{ database.container.name }}</dd>

    <dt class="ui tiny header">Internal Name</dt>
    <dd>{{ database.container.internal_name }}</dd>

    <dt class="ui tiny header">Image</dt>
    <dd>{{ database.container.image.name }}</dd>

    <dt class="ui tiny header">Version</dt>
    <dd>{{ database.container.image.version }}</dd>
    </dl>
    </div>
</section>
