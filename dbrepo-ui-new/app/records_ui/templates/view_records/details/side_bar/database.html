<section id="database_info" aria-label="database_info" class="info-box">
    <h3 class="ui medium top attached header mt-0">Database</h3>
    <div class="ui segment bottom attached rdm-sidebar">
    <dl class="details-list">
        <dt class="ui tiny header">Name</dt>
        <a role="button" class="ui compact mini button preview-link right floated" href="/database/{{ database.id }}">
          <i class="info icon" aria-hidden="true"></i>View Database
        </a>
        <div class="value">{{ database.name }}</div>

        <dt class="label">Creation</dt>
        <dd class="value">{{ database.identifiers[0].publication_day }}.{{ database.identifiers[0].publication_month }}.{{ database.identifiers[0].publication_year }}</dd>
    </dl>

    </div>
</section>
