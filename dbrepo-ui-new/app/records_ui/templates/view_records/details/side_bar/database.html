<section id="database_info" aria-label="database_info" class="info-box">
    <h3>Database</h3>
    <div class="label">Name</div>
    <a role="button" class="ui compact mini button preview-link right floated" href="/database/{{ database.id }}">
      <i class="info icon" aria-hidden="true"></i>View Database
    </a>
    <div class="value">{{ database.name }}</div>
    <br>

    <div class="label">Creation</div>
    <div class="value">{{ database.identifiers[0].publication_day }}.{{ database.identifiers[0].publication_month }}.{{ database.identifiers[0].publication_year }}</div>


</section>
