# INFO: This compose file builds the local branch and deploys them as a small, local test instance
# MODIFIED: 2022-10-19
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  search-service-data:
  broker-service-data:

networks:
  public:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  userdb:
    name: userdb
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  core:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

services:

  fda-metadata-db:
    restart: on-failure
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    build: ./fda-metadata-db
    image: fda-metadata-db
    networks:
      core:
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging:
      driver: json-file

  fda-discovery-service:
    restart: on-failure
    container_name: dbrepo-discovery-service
    hostname: discovery-service
    build: ./fda-discovery-service
    image: fda-discovery-service
    networks:
      core:
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    logging:
      driver: json-file

  fda-gateway-service:
    restart: on-failure
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    build: ./fda-gateway-service
    image: fda-gateway-service
    networks:
      core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9095:9095"
    depends_on:
      fda-discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-database-service:
    restart: on-failure
    container_name: dbrepo-database-service
    hostname: database-service
    build: ./fda-database-service
    image: fda-database-service
    networks:
      userdb:
      core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9092:9092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      fda-container-service:
        condition: service_healthy
      fda-broker-service:
        condition: service_started
      fda-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-container-service:
    restart: on-failure
    container_name: dbrepo-container-service
    hostname: container-service
    build: ./fda-container-service
    image: fda-container-service
    networks:
      core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9091:9091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      fda-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-authentication-service:
    restart: on-failure
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: fda-authentication-service
    build: ./fda-authentication-service
    networks:
      core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9097:9097"
    depends_on:
      fda-discovery-service:
        condition: service_healthy
      fda-broker-service:
        condition: service_started
      fda-metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  fda-query-service:
    restart: on-failure
    container_name: dbrepo-query-service
    hostname: query-service
    build: ./fda-query-service
    image: fda-query-service
    networks:
      core:
      userdb:
    ports:
      - "9093:9093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - "/tmp:/tmp"
    depends_on:
      fda-table-service:
        condition: service_healthy
      fda-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-table-service:
    restart: on-failure
    container_name: dbrepo-table-service
    hostname: table-service
    build: ./fda-table-service
    image: fda-table-service
    networks:
      core:
      userdb:
    environment:
      GATEWAY_ENDPOINT: http://gateway-service:9095
      SEARCH_ENDPOINT: search-service:9200
      SPRING_PROFILES_ACTIVE: docker
      multipart.location: /tmp
    ports:
      - "9094:9094"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "/tmp:/tmp"
    depends_on:
      fda-authentication-service:
        condition: service_healthy
      fda-search-service:
        condition: service_started
      fda-broker-service:
        condition: service_started
    logging:
      driver: json-file

  fda-identifier-service:
    restart: on-failure
    container_name: dbrepo-identifier-service
    hostname: identifier-service
    build: ./fda-identifier-service
    image: fda-identifier-service
    networks:
      core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9096:9096"
    volumes:
      - "/tmp:/tmp"
    depends_on:
      fda-query-service:
        condition: service_healthy
      fda-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-metadata-service:
    restart: on-failure
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    build: ./fda-metadata-service
    image: fda-metadata-service
    networks:
      core:
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9100:9100"
    depends_on:
      fda-metadata-db:
        condition: service_started
    logging:
      driver: json-file

  fda-analyse-service:
    restart: on-failure
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    build: ./fda-analyse-service
    image: fda-analyse-service
    networks:
      core:
      userdb:
    command: sh -c "/wait && flask run" # docker-compose should not test the implementation
    environment:
      hostname: analyse-service
    ports:
      - "5000:5000"
    volumes:
      - "/tmp:/tmp"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      fda-discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-units-service:
    restart: on-failure
    container_name: dbrepo-units-service
    hostname: units-service
    build: ./fda-units-service
    image: fda-units-service
    networks:
      core:
    environment:
      EUREKA_SERVER: http://fda-discovery-service:9090/eureka/
    ports:
      - "9099:9099"
    volumes:
      - "/tmp:/tmp"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      fda-discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  fda-broker-service:
    restart: on-failure
    container_name: dbrepo-broker-service
    hostname: broker-service
    build: ./fda-broker-service
    image: fda-broker-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      core:
    ports:
      - "5672:5672"
      - "15672:15672"
    depends_on:
      fda-discovery-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: json-file

  fda-search-service:
    restart: always
    container_name: dbrepo-search-service
    hostname: search-service
    image: elasticsearch:7.13.4
    command: [ "elasticsearch" ]
    networks:
      core:
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=elastic
      - logger.level=WARN
    depends_on:
      fda-discovery-service:
        condition: service_healthy
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - search-service-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  fda-ui:
    restart: on-failure
    container_name: dbrepo-ui
    hostname: ui
    build: ./fda-ui
    image: fda-ui
    networks:
      core:
    ports:
      - "3000:3000"
    volumes:
      - "/tmp:/tmp"
    depends_on:
      fda-identifier-service:
        condition: service_healthy
      fda-database-service:
        condition: service_healthy
    logging:
      driver: json-file
