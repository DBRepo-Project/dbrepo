# INFO: This compose file builds the local branch and deploys them as a small, local test instance
# MODIFIED: 2022-10-19
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  search-service-data:
  broker-service-data:

networks:
  public:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  userdb:
    name: userdb
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  core:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

services:

  dbrepo-metadata-db:
    restart: on-failure
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    build: ./dbrepo-metadata-db
    image: dbrepo-metadata-db
    networks:
      core:
    volumes:
      - metadata-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
      - "9100:9100"
    env_file:
      - .env
    logging:
      driver: json-file

  dbrepo-discovery-service:
    restart: on-failure
    container_name: dbrepo-discovery-service
    hostname: discovery-service
    build: ./dbrepo-discovery-service
    image: dbrepo-discovery-service
    networks:
      core:
    ports:
      - "9090:9090"
    env_file:
      - .env
    logging:
      driver: json-file

  dbrepo-gateway-service:
    restart: on-failure
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    build: ./dbrepo-gateway-service
    image: dbrepo-gateway-service
    networks:
      core:
    ports:
      - "9095:9095"
    env_file:
      - .env
    depends_on:
      dbrepo-discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-database-service:
    restart: on-failure
    container_name: dbrepo-database-service
    hostname: database-service
    build: ./dbrepo-database-service
    image: dbrepo-database-service
    networks:
      userdb:
      core:
    ports:
      - "9092:9092"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-container-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_started
      dbrepo-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-container-service:
    restart: on-failure
    container_name: dbrepo-container-service
    hostname: container-service
    build: ./dbrepo-container-service
    image: dbrepo-container-service
    networks:
      core:
    ports:
      - "9091:9091"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-authentication-service:
    restart: on-failure
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: dbrepo-authentication-service
    build: ./dbrepo-authentication-service
    networks:
      core:
    ports:
      - "9097:9097"
    env_file:
      - .env
    depends_on:
      dbrepo-discovery-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_started
      dbrepo-metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-query-service:
    restart: on-failure
    container_name: dbrepo-query-service
    hostname: query-service
    build: ./dbrepo-query-service
    image: dbrepo-query-service
    networks:
      core:
      userdb:
    ports:
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
    depends_on:
      dbrepo-table-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-table-service:
    restart: on-failure
    container_name: dbrepo-table-service
    hostname: table-service
    build: ./dbrepo-table-service
    image: dbrepo-table-service
    networks:
      core:
      userdb:
    ports:
      - "9094:9094"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "/tmp:/tmp"
    depends_on:
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-service:
        condition: service_started
      dbrepo-broker-service:
        condition: service_started
    logging:
      driver: json-file

  dbrepo-identifier-service:
    restart: on-failure
    container_name: dbrepo-identifier-service
    hostname: identifier-service
    build: ./dbrepo-identifier-service
    image: dbrepo-identifier-service
    networks:
      core:
    ports:
      - "9096:9096"
    env_file:
      - .env
    depends_on:
      dbrepo-query-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
    volumes:
      - /tmp:/tmp
    logging:
      driver: json-file

  dbrepo-metadata-service:
    restart: on-failure
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    build: ./dbrepo-metadata-service
    image: dbrepo-metadata-service
    networks:
      core:
    env_file:
      - .env
    ports:
      - "9099:9099"
    depends_on:
      dbrepo-metadata-db:
        condition: service_started
    logging:
      driver: json-file

  dbrepo-analyse-service:
    restart: on-failure
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    build: ./dbrepo-analyse-service
    image: dbrepo-analyse-service
    networks:
      core:
      userdb:
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-discovery-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-semantics-service:
    restart: on-failure
    container_name: dbrepo-semantics-service
    hostname: semantics-service
    build: ./dbrepo-semantics-service
    image: dbrepo-semantics-service
    networks:
      core:
    ports:
      - "5010:5010"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-discovery-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-broker-service:
    restart: on-failure
    container_name: dbrepo-broker-service
    hostname: broker-service
    build: ./dbrepo-broker-service
    image: dbrepo-broker-service
    networks:
      core:
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    depends_on:
      dbrepo-discovery-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: json-file

  dbrepo-search-service:
    restart: always
    container_name: dbrepo-search-service
    hostname: search-service
    build: ./dbrepo-search-service
    image: dbrepo-search-service
    networks:
      core:
    depends_on:
      dbrepo-discovery-service:
        condition: service_healthy
    ports:
      - 9200:9200
      - 9600:9600
    env_file:
      - .env
    volumes:
      - search-service-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  dbrepo-ui:
    restart: on-failure
    container_name: dbrepo-ui
    hostname: ui
    build: ./dbrepo-ui
    image: dbrepo-ui
    networks:
      core:
      public:
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
    depends_on:
      dbrepo-identifier-service:
        condition: service_healthy
      dbrepo-database-service:
        condition: service_healthy
    logging:
      driver: json-file
