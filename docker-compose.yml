x-healthcheck-params: &healthcheck-params
  interval: 30s
  timeout: 10s
  retries: 15

volumes:
  metadata-db-data:
  data-db-data:
  auth-db-data:
  broker-service-data:
  search-db-data:
  identity-service-data:
  dashboard-ui-data:
  dashboard-db-data:
  metric-db-data:

services:
  dbrepo-metadata-db:
    restart: "no"
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    image: docker.io/bitnamilegacy/mariadb-galera:11.3.2
    volumes:
      - metadata-db-data:/bitnami/mariadb
      - ./dbrepo-metadata-db/1_setup-schema.sql:/docker-entrypoint-initdb.d/1_setup-schema.sql
      - ./dbrepo-metadata-db/2_setup-data.sql:/docker-entrypoint-initdb.d/2_setup-data.sql
    ports:
      - "3306:3306"
    environment:
      MARIADB_GALERA_MARIABACKUP_PASSWORD: "${METADATA_DB_BACKUP_PASSWORD:-dbrepo}"
      MARIADB_DATABASE: "${METADATA_DB:-dbrepo}"
      MARIADB_PASSWORD: "${READONLY_PASSWORD:-readonly}"
      MARIADB_ROOT_PASSWORD: "${METADATA_DB_PASSWORD:-dbrepo}"
      MARIADB_SKIP_TEST_DB: "yes"
      MARIADB_USER: "${READONLY_USERNAME:-readonly}"
    healthcheck:
      test: /opt/bitnami/scripts/mariadb-galera/healthcheck.sh --connect --innodb_initialized
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-data-db:
    restart: "no"
    container_name: dbrepo-data-db
    hostname: data-db
    image: docker.io/bitnamilegacy/mariadb-galera:11.3.2
    volumes:
      - data-db-data:/bitnami/mariadb
      - ./dbrepo-data-db/1_grant-user.sql:/docker-entrypoint-initdb.d/1_grant-user.sql
    ports:
      - "3307:3306"
    environment:
      MARIADB_GALERA_MARIABACKUP_PASSWORD: "${DATA_DB_BACKUP_PASSWORD:-dbrepo}"
      MARIADB_PASSWORD: "${READONLY_PASSWORD:-readonly}"
      MARIADB_ROOT_PASSWORD: "${DATA_DB_PASSWORD:-dbrepo}"
      MARIADB_SKIP_TEST_DB: "yes"
      MARIADB_USER: "${READONLY_USERNAME:-readonly}"
    healthcheck:
      test: /opt/bitnami/scripts/mariadb-galera/healthcheck.sh --connect --innodb_initialized
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-auth-db:
    restart: "no"
    container_name: dbrepo-auth-db
    hostname: auth-db
    image: docker.io/bitnamilegacy/postgresql:17.0.0
    volumes:
      - auth-db-data:/bitnami/postgresql
    environment:
      POSTGRESQL_DATABASE: "${AUTH_DB_NAME:-keycloak}"
      POSTGRESQL_USERNAME: "${AUTH_DB_USERNAME:-keycloak}"
      POSTGRESQL_PASSWORD: "${AUTH_DB_PASSWORD:-dbrepo}"
      PGPASSWORD: "${AUTH_DB_PASSWORD:-dbrepo}"
    healthcheck:
      test: "psql -U ${AUTH_DB_USERNAME:-keycloak} -h 127.0.0.1 -p 5432 -d ${AUTH_DB_NAME:-keycloak} -c 'select version();'"
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-dashboard-db:
    restart: "no"
    container_name: dbrepo-dashboard-db
    hostname: dashboard-db
    image: docker.io/bitnamilegacy/postgresql:17.0.0
    volumes:
      - dashboard-db-data:/bitnami/postgresql
    environment:
      POSTGRESQL_DATABASE: "${DASHBOARD_DB_NAME:-grafana}"
      POSTGRESQL_USERNAME: "${DASHBOARD_DB_USERNAME:-grafana}"
      POSTGRESQL_PASSWORD: "${DASHBOARD_DB_PASSWORD:-dbrepo}"
    healthcheck:
      test: "psql -U ${DASHBOARD_DB_USERNAME:-grafana} -h 127.0.0.1 -p 5432 -d ${DASHBOARD_DB_NAME:-grafana} -c 'select version();'"
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-auth-service:
    restart: "no"
    container_name: dbrepo-auth-service
    hostname: auth-service
    image: registry.datalab.tuwien.ac.at/bitnami/keycloak:26.4.4
    volumes:
      - ./dbrepo-auth-service/master-realm.json:/opt/bitnami/keycloak/data/import/master-realm.json
      - ./dbrepo-auth-service/dbrepo-realm.json:/opt/bitnami/keycloak/data/import/dbrepo-realm.json
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${AUTH_SERVICE_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${AUTH_SERVICE_ADMIN_PASSWORD:-admin}"
      LDAP_ROOT: "${IDENTITY_SERVICE_ROOT:-dc=dbrepo,dc=at}"
      LDAP_ADMIN_DN: "${IDENTITY_SERVICE_ADMIN_DN:-cn=admin,dc=dbrepo,dc=at}"
      LDAP_ADMIN_PASSWORD: "${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin}"
      KEYCLOAK_ENABLE_HEALTH_ENDPOINTS: "true"
      KEYCLOAK_ENABLE_HTTPS: "false"
      KEYCLOAK_ENABLE_STATISTICS: "true"
      KEYCLOAK_EXTRA_ARGS: "--import-realm"
      KEYCLOAK_DATABASE_HOST: "auth-db"
      KEYCLOAK_DATABASE_NAME: "${AUTH_DB_NAME:-keycloak}"
      KEYCLOAK_DATABASE_USER: "${AUTH_DB_USERNAME:-keycloak}"
      KEYCLOAK_DATABASE_PASSWORD: "${AUTH_DB_PASSWORD:-dbrepo}"
      KEYCLOAK_HOSTNAME: "${BASE_URL:-http://localhost:8080}"
      KEYCLOAK_HOSTNAME_ADMIN: "${BASE_URL:-http://localhost:8080}"
      KEYCLOAK_PROXY_HEADERS: "forwarded"
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -fsS localhost:8080/realms/master
      <<: *healthcheck-params
    depends_on:
      dbrepo-identity-service:
        condition: service_healthy
      dbrepo-auth-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-metadata-service:
    restart: "no"
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    image: ghcr.io/dbrepo-project/dbrepo/metadata-service:latest
    ports:
      - 9099:8080
    build:
      context: ./dbrepo-metadata-service
      network: host
    environment:
      ADMIN_EMAIL: "${ADMIN_EMAIL:-noreply@localhost}"
      AUTH_SERVICE_ADMIN: ${AUTH_SERVICE_ADMIN:-admin}
      AUTH_SERVICE_ADMIN_PASSWORD: ${AUTH_SERVICE_ADMIN_PASSWORD:-admin}
      AUTH_SERVICE_CLIENT: ${AUTH_SERVICE_CLIENT:-dbrepo-client}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      BASE_URL: "${BASE_URL:-http://localhost}"
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME:-dbrepo}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-dbrepo}
      BROKER_SERVICE_ENDPOINT: ${BROKER_SERVICE_ENDPOINT:-http://broker-service:15672}
      BROKER_VIRTUALHOST: "${BROKER_VIRTUALHOST:-dbrepo}"
      CACHE_DB_PROVIDER: "${CACHE_DB_PROVIDER:-valkey}"
      CACHE_DB_HOST: "${CACHE_DB_HOST:-cache-db}"
      CACHE_DB_USERNAME: "${CACHE_DB_USERNAME:-default}"
      CACHE_DB_PASSWORD: "${CACHE_DB_PASSWORD:-valkey}"
      CROSSREF_ENDPOINT: "${CROSSREF_ENDPOINT:-http://data.crossref.org}"
      DASHBOARD_SERVICE_ENDPOINT: "${DASHBOARD_SERVICE_ENDPOINT:-http://dashboard-service:8080}"
      DATA_SERVICE_ENDPOINT: ${DATA_SERVICE_ENDPOINT:-http://data-service:8080}
      DELETED_RECORD: "${DELETED_RECORD:-persistent}"
      GRANULARITY: "${GRANULARITY:-YYYY-MM-DDThh:mm:ssZ}"
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      LOG_ROOT_LEVEL: ${LOG_ROOT_LEVEL:-warn}
      METADATA_DB: "${METADATA_DB:-dbrepo}"
      METADATA_DB_PASSWORD: "${METADATA_DB_PASSWORD:-dbrepo}"
      METADATA_HOST: "${METADATA_HOST:-metadata-db}"
      METADATA_JDBC_EXTRA_ARGS: "${METADATA_JDBC_EXTRA_ARGS:-}"
      METADATA_PORT: "${METADATA_PORT:-3306}"
      METADATA_USERNAME: root
      REPOSITORY_NAME: "${REPOSITORY_NAME:-Database Repository}"
      ROR_ENDPOINT: "${ROR_ENDPOINT:-https://api.ror.org}"
      SEARCH_SERVICE_ENDPOINT: "${SEARCH_SERVICE_ENDPOINT:-http://search-service:8080}"
      S3_ACCESS_KEY_ID: "${S3_USER_ACCESS_KEY_ID:-seaweedfsuser}"
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://storage-service:9000}"
      S3_SECRET_ACCESS_KEY: "${S3_USER_SECRET_ACCESS_KEY:-seaweedfsuser}"
      SPARQL_CONNECTION_TIMEOUT: "${SPARQL_CONNECTION_TIMEOUT:-10000}"
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/actuator/health/liveness | grep 'UP' || exit 1
      <<: *healthcheck-params
    depends_on:
      dbrepo-auth-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-data-service:
        condition: service_healthy
      dbrepo-dashboard-service:
        condition: service_healthy
      dbrepo-search-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
      dbrepo-cache-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-consumer-service:
    restart: "no"
    container_name: dbrepo-consumer-service
    hostname: consumer-service
    image: ghcr.io/dbrepo-project/dbrepo/consumer-service:latest
    build:
      context: ./dbrepo-consumer-service
      network: host
    environment:
      AUTH_SERVICE_ADMIN: ${AUTH_SERVICE_ADMIN:-admin}
      AUTH_SERVICE_ADMIN_PASSWORD: ${AUTH_SERVICE_ADMIN_PASSWORD:-admin}
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME:-dbrepo}
      BROKER_QUEUE_NAME: ${BROKER_QUEUE_NAME:-dbrepo}
      BROKER_HOST: "${BROKER_ENDPOINT:-broker-service}"
      BROKER_PASSWORD: ${BROKER_SERVICE_PASSWORD:-admin}
      BROKER_PORT: ${BROKER_PORT:-5672}
      BROKER_SERVICE_ENDPOINT: ${BROKER_SERVICE_ENDPOINT:-http://broker-service:15672}
      BROKER_USERNAME: ${BROKER_SERVICE_USERNAME:-admin}
      BROKER_VIRTUALHOST: "${BROKER_VIRTUALHOST:-dbrepo}"
      CACHE_DB_PROVIDER: "${CACHE_DB_PROVIDER:-valkey}"
      CACHE_DB_HOST: "${CACHE_DB_HOST:-cache-db}"
      CACHE_DB_USERNAME: "${CACHE_DB_USERNAME:-default}"
      CACHE_DB_PASSWORD: "${CACHE_DB_PASSWORD:-valkey}"
      DATA_SERVICE_ENDPOINT: ${DATA_SERVICE_ENDPOINT:-http://data-service:8080}
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      LOG_ROOT_LEVEL: ${LOG_ROOT_LEVEL:-warn}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/actuator/health/liveness | grep 'UP' || exit 1
      <<: *healthcheck-params
    depends_on:
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-data-service:
        condition: service_healthy
      dbrepo-cache-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-cache-db:
    restart: "no"
    container_name: dbrepo-cache-db
    hostname: cache-db
    image: docker.io/valkey/valkey:8
    command:
      - "valkey-server"
      - "/etc/valkey.conf"
    environment:
      VALKEY_PASSWORD: "${CACHE_DB_PASSWORD:-valkey}"
    ports:
      - "6379:6379"
    volumes:
      - ./dbrepo-cache-db/valkey.conf:/etc/valkey.conf
    healthcheck:
      test: "redis-cli -a ${CACHE_DB_PASSWORD:-valkey} ping | grep PONG"
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-broker-service:
    restart: "no"
    container_name: dbrepo-broker-service
    hostname: broker-service
    image: docker.io/bitnamilegacy/rabbitmq:3.13.7
    ports:
      - 15672:15672
      - 5672:5672
      - 1883:1883
    volumes:
      - ./dbrepo-broker-service/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./dbrepo-broker-service/advanced.config:/etc/rabbitmq/advanced.config
      - ./dbrepo-broker-service/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./dbrepo-broker-service/definitions.json:/app/definitions.json
      - broker-service-data:/bitnami/rabbitmq/mnesia
    environment:
      RABBITMQ_ERL_COOKIE: "${BROKER_SERVICE_ERL_COOKIE:-dbrepo}"
      RABBITMQ_LDAP_ADMIN_DN: "${IDENTITY_SERVICE_ADMIN_DN:-cn=admin,dc=dbrepo,dc=at}"
      RABBITMQ_LDAP_ADMIN_PASSWORD: "${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin}"
    depends_on:
      dbrepo-identity-service:
        condition: service_healthy
    healthcheck:
      test: rabbitmq-diagnostics -q is_running | grep 'is fully booted and running'
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-search-db:
    restart: "no"
    container_name: dbrepo-search-db
    hostname: search-db
    image: docker.io/bitnamilegacy/opensearch:2.18.0
    volumes:
      - search-db-data:/bitnami/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: curl -sSL 127.0.0.1:9200
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-search-service:
    restart: "no"
    container_name: dbrepo-search-service
    hostname: search-service
    image: ghcr.io/dbrepo-project/dbrepo/search-service:latest
    build:
      context: ./dbrepo-search-service
      network: host
    environment:
      AUTH_SERVICE_CLIENT: ${AUTH_SERVICE_CLIENT:-dbrepo-client}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      COLLECTION: ${COLLECTION:-['database','table','column','identifier','unit','concept','user','view']}
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      METADATA_SERVICE_ENDPOINT: ${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-search-db}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/health | grep 'UP' || exit 1
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-ui:
    restart: "no"
    container_name: dbrepo-ui
    hostname: ui
    image: ghcr.io/dbrepo-project/dbrepo/ui:latest
    build:
      context: ./dbrepo-ui
      args:
        APP_VERSION: ${APP_VERSION:-latest}
        COMMIT: ${CI_COMMIT_SHORT_SHA:-}
      network: host
    environment:
      NUXT_STORAGE_OIDC_PASSWORD: "${CACHE_DB_PASSWORD:-valkey}"
      NUXT_OIDC_PROVIDERS_KEYCLOAK_BASE_URL: "${BASE_URL:-http://localhost:8080}/realms/dbrepo"
      NUXT_OIDC_PROVIDERS_KEYCLOAK_LOGOUT_REDIRECT_URI: "${BASE_URL:-http://localhost}"
      NUXT_OIDC_PROVIDERS_KEYCLOAK_CLIENT_ID: "${AUTH_SERVICE_CLIENT:-dbrepo-client}"
      NUXT_OIDC_PROVIDERS_KEYCLOAK_CLIENT_SECRET: "${AUTH_SERVICE_CLIENT:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}"
      NUXT_OIDC_PROVIDERS_KEYCLOAK_REDIRECT_URI: "${BASE_URL:-http://localhost}/auth/keycloak/callback"
      NUXT_OIDC_TOKEN_KEY: "${OIDC_TOKEN_KEY:-data:;base64,aOy1Sqlm3S41V824iZg+nuTDmEOv9QZuCGPB5I3oX48=}"
      NUXT_OIDC_SESSION_SECRET: "${OIDC_SESSION_SECRET:-T1eUAWRG3A7UAfLKBP1vc-ydKa4xIJR4k_0JIeG7m8EG9zri}"
      NUXT_OIDC_AUTH_SESSION_SECRET: "${NUXT_OIDC_AUTH_SESSION_SECRET:-P2g0Yb8G0bE_0pRAy5AayM5Yr7OmnIIrnsYqyud6JD6_L4FI}"
      NUXT_PUBLIC_API_CLIENT: "${BASE_URL:-http://localhost}"
      NUXT_PUBLIC_API_SERVER: "${BASE_URL:-http://gateway-service}"
      NUXT_PUBLIC_DASHBOARD_URL: "${BASE_URL:-http://localhost}/dashboard"
    healthcheck:
      test: curl -fsSL 127.0.0.1:3000 && curl -fsSL 127.0.0.1:3000/health
      <<: *healthcheck-params
    depends_on:
      dbrepo-cache-db:
        condition: service_healthy
      dbrepo-search-service:
        condition: service_healthy
    extra_hosts:
      - "localhost:host-gateway"
    logging:
      driver: json-file

  dbrepo-gateway-service:
    restart: "no"
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: docker.io/nginx:1.28
    ports:
      - "80:8080"
    volumes:
      - ./dbrepo-gateway-service/dbrepo.conf:/etc/nginx/conf.d/dbrepo.conf:ro
    depends_on:
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-dashboard-service:
        condition: service_healthy
      dbrepo-dashboard-ui:
        condition: service_healthy
      dbrepo-ui:
        condition: service_healthy
    healthcheck:
      test: curl -sSL 127.0.0.1:8080/health | grep 'UP' | exit
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-identity-service:
    restart: "no"
    container_name: dbrepo-identity-service
    hostname: identity-service
    image: docker.io/bitnamilegacy/openldap:2.6.8
    ports:
      - '1389:1389'
      - '1636:1636'
    environment:
      LDAP_ADMIN_USERNAME: "${IDENTITY_SERVICE_ADMIN_USERNAME:-admin}"
      LDAP_ADMIN_PASSWORD: "${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin}"
      LDAP_USERS: "${READONLY_USERNAME:-readonly}"
      LDAP_PASSWORDS: "${READONLY_PASSWORD:-readonly}"
      LDAP_GROUP: "${ADMIN_GROUP:-system}"
      LDAP_ROOT: "${IDENTITY_SERVICE_ROOT:-dc=dbrepo,dc=at}"
      LDAP_ADMIN_DN: "${IDENTITY_SERVICE_ADMIN_DN:-cn=admin,dc=dbrepo,dc=at}"
    volumes:
      - identity-service-data:/bitnami/openldap
    healthcheck:
      test: "ldapwhoami -H ldap://localhost:1389 -D ${IDENTITY_SERVICE_ADMIN_DN:-cn=admin,dc=dbrepo,dc=at} -w ${IDENTITY_SERVICE_ADMIN_PASSWORD:-admin} || exit 1"
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-search-service-init:
    restart: "no"
    init: true
    container_name: dbrepo-search-service-init
    hostname: search-service-init
    image: ghcr.io/dbrepo-project/dbrepo/search-service-init:latest
    build:
      context: ./dbrepo-search-service
      dockerfile: init.Dockerfile
      network: host
    environment:
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      METADATA_SERVICE_ENDPOINT: ${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-search-db}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    depends_on:
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-dashboard-service-init:
    restart: "no"
    init: true
    container_name: dbrepo-dashboard-service-init
    image: ghcr.io/dbrepo-project/dbrepo/dashboard-service-init:latest
    build:
      context: ./dbrepo-dashboard-service
      dockerfile: init.Dockerfile
      network: host
    environment:
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      DASHBOARD_UI_ENDPOINT: "${DASHBOARD_UI_ENDPOINT:-http://dashboard-ui:3000}"
      DASHBOARD_UI_PASSWORD: "${DASHBOARD_UI_PASSWORD:-admin}"
      DASHBOARD_UI_USERNAME: "${DASHBOARD_UI_USERNAME:-admin}"
      METADATA_SERVICE_ENDPOINT: ${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    depends_on:
      dbrepo-dashboard-ui:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-storage-service:
    restart: "no"
    container_name: dbrepo-storage-service
    hostname: storage-service
    image: docker.io/chrislusf/seaweedfs:4.13
    command: [ "server", "-s3", "-s3.port=9000", "-s3.config=/app/s3_config.json", "-metricsPort=9090" ]
    volumes:
      - ./dbrepo-storage-service/s3_config.json:/app/s3_config.json
    ports:
      - "9000:9000"
      - "8888:8888"
    healthcheck:
      test: echo "cluster.check" | weed shell | grep "checking master.*ok" || exit 1
      <<: *healthcheck-params
    logging:
      driver: json-file

  dbrepo-storage-service-init:
    restart: "no"
    init: true
    container_name: dbrepo-storage-service-init
    hostname: storage-service-init
    image: ghcr.io/dbrepo-project/dbrepo/storage-service-init:latest
    build:
      context: ./dbrepo-storage-service/init
      network: host
    environment:
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_ACCESS_KEY_ID: "${S3_ADMIN_ACCESS_KEY_ID:-seaweedfsadmin}"
      S3_SECRET_ACCESS_KEY: "${S3_ADMIN_SECRET_ACCESS_KEY:-seaweedfsadmin}"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-storage-service:9000}
    depends_on:
      dbrepo-storage-service:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-data-service:
    restart: "no"
    container_name: dbrepo-data-service
    hostname: data-service
    image: ghcr.io/dbrepo-project/dbrepo/data-service:latest
    build:
      context: ./dbrepo-data-service
      network: host
    environment:
      AUTH_SERVICE_ADMIN: ${AUTH_SERVICE_ADMIN:-admin}
      AUTH_SERVICE_ADMIN_PASSWORD: ${AUTH_SERVICE_ADMIN_PASSWORD:-admin}
      AUTH_SERVICE_CLIENT: "${AUTH_SERVICE_CLIENT:-dbrepo-client}"
      AUTH_SERVICE_CLIENT_SECRET: "${AUTH_SERVICE_CLIENT_SECRET:-MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG}"
      AUTH_SERVICE_ENDPOINT: "${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}"
      BASE_URL: "${BASE_URL:-http://localhost}"
      BROKER_EXCHANGE_NAME: "${BROKER_EXCHANGE_NAME:-dbrepo}"
      BROKER_QUEUE_NAME: "${BROKER_QUEUE_NAME:-dbrepo}"
      BROKER_HOST: "${BROKER_ENDPOINT:-broker-service}"
      BROKER_PASSWORD: "${BROKER_SERVICE_PASSWORD:-admin}"
      BROKER_PORT: ${BROKER_PORT:-5672}
      BROKER_SERVICE_ENDPOINT: "${BROKER_SERVICE_ENDPOINT:-http://broker-service:15672}"
      BROKER_USERNAME: "${BROKER_SERVICE_USERNAME:-admin}"
      BROKER_VIRTUALHOST: "${BROKER_VIRTUALHOST:-dbrepo}"
      CACHE_DB_PROVIDER: "${CACHE_DB_PROVIDER:-valkey}"
      CACHE_DB_HOST: "${CACHE_DB_HOST:-cache-db}"
      CACHE_DB_USERNAME: "${CACHE_DB_USERNAME:-default}"
      CACHE_DB_PASSWORD: "${CACHE_DB_PASSWORD:-valkey}"
      CONNECTION_TIMEOUT: ${CONNECTION_TIMEOUT:-60000}
      COMPUTE_SERVICE_ENDPOINT: "${COMPUTE_SERVICE_ENDPOINT:-local[*]}"
      EXCHANGE_NAME: "${EXCHANGE_NAME:-dbrepo}"
      METADATA_SERVICE_ENDPOINT: "${METADATA_SERVICE_ENDPOINT:-http://metadata-service:8080}"
      GRANT_DEFAULT_READ: "${GRANT_DEFAULT_READ:-SELECT, EXECUTE}"
      GRANT_DEFAULT_WRITE: "${GRANT_DEFAULT_WRITE:-SELECT, CREATE, CREATE VIEW, CREATE ROUTINE, CREATE TEMPORARY TABLES, EXECUTE, LOCK TABLES, INDEX, TRIGGER, INSERT, UPDATE, DELETE}"
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      LOG_ROOT_LEVEL: ${LOG_ROOT_LEVEL:-warn}
      QUEUE_NAME: ${QUEUE_NAME:-dbrepo}
      REQUEUE_REJECTED: ${REQUEUE_REJECTED:-false}
      ROUTING_KEY: "${ROUTING_KEY:-dbrepo.#}"
      S3_ACCESS_KEY_ID: "${S3_USER_ACCESS_KEY_ID:-seaweedfsuser}"
      S3_BUCKET: "${S3_BUCKET:-dbrepo}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://storage-service:9000}"
      S3_SECRET_ACCESS_KEY: "${S3_USER_SECRET_ACCESS_KEY:-seaweedfsuser}"
      SPARK_USER: "${COMPUTE_SERVICE_USERNAME:-spark}"
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -sSL localhost:8080/actuator/health/liveness | grep 'UP' || exit 1
      <<: *healthcheck-params
    depends_on:
      dbrepo-data-db:
        condition: service_healthy
    logging:
      driver: json-file

  dbrepo-dashboard-ui:
    restart: "no"
    container_name: dbrepo-dashboard-ui
    hostname: dashboard-ui
    image: docker.io/bitnamilegacy/grafana:11.4.0
    volumes:
      - ./dbrepo-dashboard-ui/dashboards:/app/dashboards
      - ./dbrepo-dashboard-ui/grafana.ini:/opt/bitnami/grafana/conf/grafana.ini
      - ./dbrepo-dashboard-ui/provisioning/dashboards/provider.yaml:/opt/bitnami/grafana/conf/provisioning/dashboards/provider.yaml
      - ./dbrepo-dashboard-ui/provisioning/datasources/infinity.yaml:/opt/bitnami/grafana/conf/provisioning/datasources/infinity.yaml
      - ./dbrepo-dashboard-ui/provisioning/datasources/prometheus.yaml:/opt/bitnami/grafana/conf/provisioning/datasources/prometheus.yaml
      - ./dbrepo-dashboard-ui/provisioning/datasources/opensearch.yaml:/opt/bitnami/grafana/conf/provisioning/datasources/opensearch.yaml
    environment:
      BASE_URL: "${BASE_URL:-http://localhost}"
      DASHBOARD_DB_NAME: "${DASHBOARD_DB_NAME:-grafana}"
      DASHBOARD_DB_USERNAME: "${DASHBOARD_DB_USERNAME:-grafana}"
      DASHBOARD_DB_PASSWORD: "${DASHBOARD_DB_PASSWORD:-dbrepo}"
      GF_SERVER_ROOT_URL: http://dashboard-ui:3000/dashboard/
      GF_SECURITY_ADMIN_USER: "${DASHBOARD_UI_USERNAME:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${DASHBOARD_UI_PASSWORD:-admin}"
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource,grafana-opensearch-datasource"
      READONLY_USERNAME: "${READONLY_USERNAME:-readonly}"
      READONLY_PASSWORD: "${READONLY_PASSWORD:-readonly}"
    healthcheck:
      test: curl -fsSL --head 127.0.0.1:3000
      <<: *healthcheck-params
    extra_hosts:
      - "localhost:host-gateway"
    logging:
      driver: json-file

  dbrepo-dashboard-service:
    restart: "no"
    container_name: dbrepo-dashboard-service
    hostname: dashboard-service
    image: ghcr.io/dbrepo-project/dbrepo/dashboard-service:latest
    build:
      context: ./dbrepo-dashboard-service
      network: host
    environment:
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8080}
      BASE_URL: "${BASE_URL:-http://localhost}"
      DASHBOARD_UI_ENDPOINT: "${DASHBOARD_UI_ENDPOINT:-http://dashboard-ui:3000}"
      DASHBOARD_UI_PASSWORD: "${DASHBOARD_UI_PASSWORD:-admin}"
      DASHBOARD_UI_USERNAME: "${DASHBOARD_UI_USERNAME:-admin}"
      LOG_APPLICATION_LEVEL: ${LOG_APPLICATION_LEVEL:-info}
      SYSTEM_USERNAME: "${SYSTEM_USERNAME:-admin}"
      SYSTEM_PASSWORD: "${SYSTEM_PASSWORD:-admin}"
    healthcheck:
      test: curl -fsSL --head 127.0.0.1:8080/health
      <<: *healthcheck-params
    depends_on:
      dbrepo-dashboard-ui:
        condition: service_healthy
    logging:
      driver: json-file
