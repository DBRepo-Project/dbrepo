# INFO: This compose file builds the local branch and deploys them as a small, local test instance
# MODIFIED: 2023-06-01
# MAINTAINER: Martin Weise <martin.weise@tuwien.ac.at>

version: "3.6"

volumes:
  metadata-db-data:
  search-db-data:
  broker-service-data:
  authentication-service-data:

networks:
  userdb:
    name: userdb
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  public:
    name: public
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  core:
    name: core
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16

services:

  dbrepo-metadata-db:
    restart: "no"
    container_name: dbrepo-metadata-db
    hostname: metadata-db
    build: ./dbrepo-metadata-db
    image: dbrepo-metadata-db
    networks:
      core:
    volumes:
      - metadata-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
      - "9100:9100"
    env_file:
      - .env
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-metadata-db"

  dbrepo-database-service:
    restart: "no"
    container_name: dbrepo-database-service
    hostname: database-service
    build: ./dbrepo-database-service
    image: dbrepo-database-service
    networks:
      userdb:
      core:
    ports:
      - "9092:9092"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-container-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_started
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-database-service"

  dbrepo-container-service:
    restart: "no"
    container_name: dbrepo-container-service
    hostname: container-service
    build: ./dbrepo-container-service
    image: dbrepo-container-service
    networks:
      core:
    ports:
      - "9091:9091"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-container-service"

  dbrepo-authentication-service:
    restart: "no"
    container_name: dbrepo-authentication-service
    hostname: authentication-service
    image: dbrepo-authentication-service
    build: ./dbrepo-authentication-service
    networks:
      core:
    ports:
      - "8443:8443"
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - authentication-service-data:/opt/keycloak/data/
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-authentication-service"

  dbrepo-query-service:
    restart: "no"
    container_name: dbrepo-query-service
    hostname: query-service
    build: ./dbrepo-query-service
    image: dbrepo-query-service
    networks:
      core:
      userdb:
    ports:
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-table-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-query-service"

  dbrepo-table-service:
    restart: "no"
    container_name: dbrepo-table-service
    hostname: table-service
    build: ./dbrepo-table-service
    image: dbrepo-table-service
    networks:
      core:
      userdb:
    ports:
      - "9094:9094"
    env_file:
      - .env
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp:/tmp"
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-table-service"

  dbrepo-identifier-service:
    restart: "no"
    container_name: dbrepo-identifier-service
    hostname: identifier-service
    build: ./dbrepo-identifier-service
    image: dbrepo-identifier-service
    networks:
      core:
    ports:
      - "9096:9096"
    env_file:
      - .env
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-query-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    volumes:
      - /tmp:/tmp
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-identifier-service"

  dbrepo-metadata-service:
    restart: "no"
    container_name: dbrepo-metadata-service
    hostname: metadata-service
    build: ./dbrepo-metadata-service
    image: dbrepo-metadata-service
    networks:
      core:
    env_file:
      - .env
    ports:
      - "9099:9099"
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-metadata-service"

  dbrepo-analyse-service:
    restart: "no"
    container_name: dbrepo-analyse-service
    hostname: analyse-service
    build: ./dbrepo-analyse-service
    image: dbrepo-analyse-service
    networks:
      core:
      userdb:
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-analyse-service"

  dbrepo-user-service:
    restart: "no"
    container_name: dbrepo-user-service
    hostname: user-service
    build: ./dbrepo-user-service
    image: dbrepo-user-service
    networks:
      core:
    ports:
      - "9098:9098"
    env_file:
      - .env
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-analyse-service"

  dbrepo-semantics-service:
    restart: "no"
    container_name: dbrepo-semantics-service
    hostname: semantics-service
    build: ./dbrepo-semantics-service
    image: dbrepo-semantics-service
    networks:
      core:
    ports:
      - "9097:9097"
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-metadata-db:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-semantics-service"

  dbrepo-broker-service:
    restart: "no"
    container_name: dbrepo-broker-service
    hostname: broker-service
    build: ./dbrepo-broker-service
    image: dbrepo-broker-service
    networks:
      core:
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
    volumes:
      - broker-service-data:/var/lib/rabbitmq/
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-semantics-service"

  dbrepo-search-db:
    restart: "no"
    container_name: dbrepo-search-db
    hostname: search-db
    image: opensearchproject/opensearch:2.8.0
    networks:
      core:
    ports:
      - 2020:2020
    env_file:
      - .env
    healthcheck:
      test: curl -s http://search-db:9200 > /dev/null || exit 1
    environment:
      discovery.type: "single-node"
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
      logger.level: "WARN"
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - search-db-data:/usr/share/elasticsearch/data
    logging:
      driver: json-file

  dbrepo-log-service:
    restart: "no"
    container_name: dbrepo-log-service
    hostname: log-service
    image: fluent/fluent-bit:2.1.4-debug
    networks:
      core:
    ports:
      - 24224:24224
    healthcheck:
      test: curl -f http://localhost:2020 || exit 1
    entrypoint: [ "/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit.conf" ]
    environment:
      discovery.type: "single-node"
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
      logger.level: "WARN"
      bootstrap.memory_lock: "true"
    deploy:
      resources:
        limits:
          memory: 4G
    depends_on:
      dbrepo-search-db:
        condition: service_healthy
    volumes:
      - ./dbrepo-log-service/fluent-bit.conf:/fluent-bit.conf
    logging:
      driver: json-file

