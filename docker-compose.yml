#      driver: fluentd
#      options:
#        tag: metrics

  dbrepo-ui:
    restart: "no"
    container_name: dbrepo-ui
    hostname: ui
    build: ./dbrepo-ui
    image: dbrepo-ui
    networks:
      core:
      public:
    env_file:
      - .env
    volumes:
      - "/tmp:/tmp"
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-ui"

  dbrepo-gateway-service:
    restart: "no"
    container_name: dbrepo-gateway-service
    hostname: gateway-service
    image: nginx:1.25-alpine-slim
    networks:
      core:
      public:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dbrepo.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      dbrepo-log-service:
        condition: service_healthy
      dbrepo-analyse-service:
        condition: service_healthy
      dbrepo-authentication-service:
        condition: service_healthy
      dbrepo-broker-service:
        condition: service_healthy
      dbrepo-container-service:
        condition: service_healthy
      dbrepo-database-service:
        condition: service_healthy
      dbrepo-identifier-service:
        condition: service_healthy
      dbrepo-metadata-service:
        condition: service_healthy
      dbrepo-query-service:
        condition: service_healthy
      dbrepo-search-db:
        condition: service_healthy
      dbrepo-semantics-service:
        condition: service_healthy
      dbrepo-table-service:
        condition: service_healthy
      dbrepo-ui:
        condition: service_started
      dbrepo-user-service:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        tag: "dbrepo-gateway-service"
