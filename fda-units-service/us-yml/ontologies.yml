summary: "Post / Upload ontology"
description: "This is a simple API for posting ontologies (.nt, .ttl files) to DB-Repo."
consumes:
- "application/json"
produces:
- "application/json"
parameters:
- in: "formData"
  name: "file"
  required: false
  type: "file"
responses:
  200:
    description: "OK"
  201:
    description: "Created"
  400:
    description: "Bad request"
  405:
    description: "Invalid input"
  409:
    description: "Conflict"