spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: dbrepo
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: metadata-service
  rabbitmq:
    host: localhost
    virtual-host: dbrepo
    username: fda
    password: fda
    port: 5672
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true
server:
  port: 19099
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: trace
    org.springframework.security.web.FilterChainProxy: debug
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
dbrepo:
  repository-name: Database Repository
  base-url: http://localhost
  admin-email: noreply@example.com
  deleted-record: persistent
  granularity: YYYY-MM-DDThh:mm:ssZ
  exchangeName: dbrepo
  queueName: dbrepo
  connectionTimeout: 10000
  s3:
    accessKeyId: seaweedfsadmin
    secretAccessKey: seaweedfsadmin
    importBucket: dbrepo-upload
    exportBucket: dbrepo-download
  admin:
    username: admin
    password: admin
  endpoints:
    searchService: http://localhost:5000
    dataService: http://localhost:9093
    brokerService: http://localhost/admin/broker
    authService: http://localhost:8080
    storageService: http://storage-service:9000
  pid:
    base: http://localhost/pid/
  jwt:
    public_key: 
  keycloak:
    username: fda
    password: fda
    client: dbrepo-client
    clientSecret: MUwRc7yfXSJwX8AdRMWaQC3Nep1VjwgG
  website: http://localhost
