client_max_body_size 2G;

resolver 127.0.0.11 valid=30s; # docker dns

upstream authentication {
    server authentication-service:8443;
}

upstream user {
    server user-service:9098;
}

upstream broker {
    server broker-service:15672;
}

upstream analyse {
    server analyse-service:5000;
}

upstream metadata {
    server metadata-service:9099;
}

upstream identifier {
    server identifier-service:9096;
}

upstream query {
    server query-service:9093;
}

upstream table {
    server table-service:9094;
}

upstream database {
    server database-service:9092;
}

upstream container {
    server container-service:9091;
}

upstream semantics {
    server semantics-service:5010;
}

upstream search {
    server search-service:9200;
}

upstream ui {
    server ui:3000;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /insecure.crt;
    ssl_certificate_key /insecure.key;

    location /api/auth {
        rewrite /api/auth/(.*) /$1 break;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_pass              https://authentication;
        proxy_read_timeout      90;
    }

    location /api/user {
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_pass              http://user;
        proxy_read_timeout      90;
    }

    location /api/broker {
        rewrite /api/broker/(.*) /api/$1 break;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_pass              http://broker;
        proxy_read_timeout      90;
    }

    location /api/analyse {
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_pass              http://analyse;
        proxy_read_timeout      90;
    }

    location /api/oai {
