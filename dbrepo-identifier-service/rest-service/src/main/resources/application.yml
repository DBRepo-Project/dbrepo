app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: "jdbc:mariadb://metadata-db:3306/${METADATA_DB}"
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${METADATA_USERNAME}"
    password: "${METADATA_PASSWORD}"
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
      use-new-id-generator-mappings: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: "${METADATA_DB}"
        jdbc:
          time_zone: UTC
  application:
    name: identifier-service
  cloud:
    loadbalancer.ribbon.enabled: false
  rabbitmq:
    host: broker-service
    username: "${BROKER_USERNAME}"
    password: "${BROKER_PASSWORD}"
management.endpoints.web.exposure.include: health,info,prometheus
server:
  port: 9096
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: "${LOG_LEVEL}"
    at.tuwien.auth.UserPermissionEvaluator: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance:
    hostname: identifier-service
    non-secure-port: 9096
  client.serviceUrl.defaultZone: http://discovery-service:9090/eureka/
fda:
  ready.path: /ready
  jwt:
    issuer: "${JWT_ISSUER}"
    public_key: "${JWT_PUBKEY}"
  client_secret: "${DBREPO_CLIENT_SECRET}"
  client_id: "${CLIENT_ID}"
  gateway.endpoint: "${GATEWAY_ENDPOINT}"
  website: "${WEBSITE}"
  elastic:
    endpoint: search-service:9200
    username: elastic
    password: "${ELASTIC_PASSWORD}"