summary: "Save concepts to MDB"
description: "This is a simple API for saving units and concepts."
consumes:
- "application/json"
produces:
- "application/json"
parameters:
- in: "body"
  name: "body"
  description: "JSON containing cdbid (database ID), cid (column ID), tid (table ID), uri (URI of the concept). Make sure the concept already exists in the MDB. "
  required: true
  schema:
    type: "object"
    properties:
      concept_id:
        type: "integer"
        example: "1"
      cid:
        type: "integer"
        example: "1"
      tid: 
        type: "integer"
        example: "1"
      cdbid:
        type: "integer"
        example: "1"
responses:
  200: 
    description: "OK"
  201:
    description: "Created"
  405:
    description: "Invalid input"
  409:
    description: "Concept already assigned"
tags:
  - units-endpoint