summary: "Save concepts to MDB"
description: "This is a simple API for saving units and concepts."
consumes:
- "application/json"
produces:
- "application/json"
parameters:
- in: "body"
  name: "body"
  description: "Json body containing name and uri, cf. example below."
  required: true
  schema:
    type: "object"
    properties:
      uri:
        type: "string"
        example: "http://www.ontology-of-units-of-measure.org/resource/om-2/metre"
      name:
        type: "string"
        example: "metre"
responses:
  200:
    description: "OK"
  201:
    description: "Created"
  405:
    description: "Invalid input"
  409:
    description: "Concept already present"
tags:
  - units-endpoint
