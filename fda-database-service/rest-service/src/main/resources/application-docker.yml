app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:mariadb://metadata-db:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: "${METADATA_USERNAME}"
    password: "${METADATA_PASSWORD}"
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
      use-new-id-generator-mappings: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: database-service
  cloud:
    loadbalancer.ribbon.enabled: false
  rabbitmq:
    host: broker-service
    username: fda
    password: fda
management.endpoints.web.exposure.include: health,info,prometheus
server.port: 9092
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: "${LOG_LEVEL}"
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance.hostname: database-service
  client.serviceUrl.defaultZone: http://discovery-service:9090/eureka/
fda:
  elastic:
    endpoint: search-service:9200
    username: elastic
    password: "${ELASTIC_PASSWORD}"
  ready.path: /ready
  jwt:
    issuer: "${JWT_ISSUER}"
    public_key: "${JWT_PUBKEY}"
  client_secret: "${CLIENT_SECRET}"
  client_id: "${CLIENT_ID}"
  gateway.endpoint: "${GATEWAY_ENDPOINT}"