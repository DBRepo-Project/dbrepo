app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:mariadb://localhost:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: dbrepo
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
      use-new-id-generator-mappings: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: database-service
  cloud:
    loadbalancer.ribbon.enabled: false
    gateway:
      httpclient:
        ssl:
          useInsecureTrustManager: true
  rabbitmq:
    host: localhost
    username: fda
    password: fda
management.endpoints.web.exposure.include: health,info,prometheus
server:
  port: 9092
  ssl:
    enabled: true
    key-alias: database-service
    key-store: ./server.keystore
    key-store-type: jks
    key-store-password: password
    key-password: password
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: info
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance:
    hostname: database-service
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 9092
  client.serviceUrl.defaultZone: http://localhost:9090/eureka/
fda:
  elastic:
    endpoint: localhost:9200
    username: elastic
    password: elastic
  ready.path: ./ready
  jwt:
    issuer: http://localhost:8080/realms/dbrepo
    public_key: 
  client_secret: client-secret
  client_id: dbrepo-client
  gateway.endpoint: http://localhost:9095