app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: "jdbc:postgresql://metadata-db:5432/${METADATA_DB}"
    driver-class-name: org.postgresql.Driver
    username: "${METADATA_USERNAME}"
    password: "${METADATA_PASSWORD}"
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  application:
    name: query-service
  rabbitmq:
    host: broker-service
    username: "${BROKER_USERNAME}"
    password: "${BROKER_PASSWORD}"
  cloud:
    loadbalancer.ribbon.enabled: false
server.port: 9093
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: debug
    at.tuwien.mapper.: debug
    at.tuwien.service.: debug
    at.tuwien.config.: debug
    at.tuwien.auth.UserPermissionEvaluator: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance.hostname: query-service
  client.serviceUrl.defaultZone: http://discovery-service:9090/eureka/
fda:
  gateway.endpoint: "${GATEWAY_ENDPOINT}"
  ready.path: /ready
  consumers: "${BROKER_CONSUMERS}"
