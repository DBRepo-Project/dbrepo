app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/fda
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  application:
    name: query-service
  rabbitmq:
    host: localhost
    username: fda
    password: fda
  cloud:
    loadbalancer.ribbon.enabled: false
server.port: 9093
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: debug
    at.tuwien.mapper.: trace
    at.tuwien.service.: debug
    at.tuwien.config.: debug
    at.tuwien.auth.UserPermissionEvaluator: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance.hostname: query-service
  client.serviceUrl.defaultZone: http://localhost:9090/eureka/
fda:
  gateway.endpoint: http://localhost:9095
  ready.path: ./ready
  consumers: 2
