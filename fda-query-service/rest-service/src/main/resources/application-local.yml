app.version: '@project.version@'
spring:
  main.banner-mode: off
  datasource:
    url: jdbc:mariadb://localhost:3306/fda
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: dbrepo
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
      use-new-id-generator-mappings: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: fda
        jdbc:
          time_zone: UTC
  application:
    name: query-service
  rabbitmq:
    host: localhost
    username: fda
    password: fda
  cloud:
    loadbalancer.ribbon.enabled: false
    gateway:
      httpclient:
        ssl:
          useInsecureTrustManager: true
management.endpoints.web.exposure.include: health,info,prometheus
server:
  port: 9093
  ssl:
    enabled: true
    key-alias: query-service
    key-store: ./server.keystore
    key-store-type: jks
    key-store-password: password
    key-password: password
logging:
  pattern.console: "%d %highlight(%-5level) %msg%n"
  level:
    root: warn
    at.tuwien.: trace
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: debug
eureka:
  instance:
    hostname: query-service
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 9093
  client.serviceUrl.defaultZone: http://discovery-service:9090/eureka/
fda:
  gateway.endpoint: http://localhost:9095
  ready.path: ./ready
  jwt:
    issuer: https://localhost:8443/realms/dbrepo
    public_key: 
  client_secret: client-secret
  client_id: dbrepo-client
  consumers: 2
  unsupported: \*,AVG,BIT_AND,BIT_OR,BIT_XOR,COUNT,COUNTDISTINCT,GROUP_CONCAT,JSON_ARRAYAGG,JSON_OBJECTAGG,MAX,MIN,STD,STDDEV,STDDEV_POP,STDDEV_SAMP,SUM,VARIANCE,VAR_POP,VAR_SAMP,--
  elastic:
    endpoint: search-service:9200
    username: elastic
    password: elastic