# order of config evaluation is grafana.ini < defaults.ini

[security]
disable_initial_admin_creation = true

[auth.ldap]
enabled = true
config_file = /opt/bitnami/grafana/conf/ldap.toml

[live]
max_connections = 100
allowed_origins =

[auth.anonymous]
enabled = true
org_role = Viewer
hide_version = true

[dashboards]
enabled = true
path = /opt/bitnami/grafana/conf/dashboards

[log]
mode = console file
