x-healthcheck-params: &healthcheck-params
  interval: 30s
  timeout: 10s
  retries: 15

services:
  postgres:
    restart: "no"
    container_name: postgres
    hostname: postgres
    image: postgres:18-periods-alpine
    build: .
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbrepo
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      <<: *healthcheck-params
    logging:
      driver: json-file
