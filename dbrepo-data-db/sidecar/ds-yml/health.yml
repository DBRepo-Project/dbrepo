summary: Return a healthcheck
description: |
  Return UP if the instance is ready to serve connections.
consumes:
  - application/json
produces:
  - application/json
parameters: [ ]

responses:
  200:
    description: OK, service is up and running
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Health"
  404:
    description: Service is not yet ready
tags:
  - actuator

components:
  schemas:
    Health:
      title: Status object
      type: object
      properties:
        status:
          type: string
          example: UP
      required:
        - status